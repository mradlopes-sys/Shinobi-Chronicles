  /* ===== FICHAS CANVA ORIGINAIS: PÁGINAS A4 COM CAMPOS EDITÁVEIS ===== */
  .cv-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0 16px}
  .cv-toolbar h2{font:600 22px var(--serif);margin:0}.cv-toolbar p{font-size:12px;color:var(--muted);margin:4px 0 0}
  .cv-pages{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}
  .cv-pages button{padding:9px 14px;border:1px solid var(--line);background:#fffdfa;color:#4b4b4b;cursor:pointer;font-weight:700;font-size:12px}
  .cv-pages button.active{background:#202723;color:white;border-color:#202723}
  .cv-wrap{width:100%;display:flex;justify-content:center;overflow:auto;padding:8px 0 26px}
  .cv-page{width:min(100%,828px);flex:0 0 auto;aspect-ratio:8.27/11.69;position:relative;background:linear-gradient(120deg,#f0e7df,#fff9f5 45%,#e6ddd3);box-shadow:0 10px 30px #1b242025;border:1px solid #eee2d7;overflow:hidden}
  .cv-page img.cv-bg{width:100%;height:100%;display:block;position:absolute;inset:0;z-index:0;object-fit:fill}
  .cv-page .cv-missing{position:absolute;top:20%;left:10%;right:10%;text-align:center;pointer-events:none;color:#80645f;opacity:.6;font:600 25px var(--serif)}
  .cv-spot{position:absolute;z-index:2;overflow:hidden}
  .cv-in{width:100%;height:100%;margin:0!important;display:block;min-width:0;padding:0 3px!important;background:rgba(255,255,255,.95)!important;border:1px solid rgba(100,79,76,.18)!important;border-radius:0!important;color:#2b2929!important;font-family:"DM Sans",sans-serif!important;font-size:clamp(7px,1vw,12px)!important;line-height:1.18!important;box-shadow:none!important}
  .cv-in:focus{outline:1.5px solid #834b46!important;background:#fff!important;z-index:4}
  .cv-spot textarea.cv-in{resize:none;overflow:auto;line-height:1.4!important;padding:3px!important}
  .cv-readonly{height:100%;width:100%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.88);color:#6d333d;font-weight:700;font-size:clamp(7px,.95vw,12px)}
  .cv-stepper{width:100%;height:100%;display:flex;align-items:center;justify-content:space-evenly;background:rgba(255,255,255,.95);gap:1px;color:#803c48}
  .cv-stepper button{height:100%;flex:1;border:0;background:transparent;color:#803c48;font-weight:800;cursor:pointer;font-size:clamp(8px,1.2vw,15px)}
  .cv-stepper button:hover{background:#e5c2c5}.cv-stepper b{flex:1;text-align:center;font-size:clamp(8px,1.25vw,15px)}
  .cv-image{position:absolute;z-index:2;left:62.7%;top:17.2%;width:30.7%;height:22%;object-fit:cover;object-position:center}
  .cv-status{font-size:12px;line-height:1.6;color:#65605c;text-align:center;margin:8px auto 28px;max-width:800px}
  @media(max-width:700px){.cv-page{min-width:620px}.cv-wrap{justify-content:flex-start}.cv-in{font-size:10px!important}}
  @media print{@page{size:A4;margin:0}.sidebar,.topbar,.cv-toolbar,.cv-pages,.cv-status,.statusbar,.cv-extra{display:none!important}.main-area,.content,.app-main{padding:0!important;margin:0!important}.cv-wrap{overflow:visible;padding:0}.cv-page{width:210mm!important;height:297mm!important;max-width:none;box-shadow:none;border:0}.cv-in{print-color-adjust:exact!important}}


  /* Fichas múltiplas e feedback de artes ausentes */
  .my-sheet-list{display:grid;gap:14px}
  .my-sheet-card{display:flex;align-items:center;gap:16px;padding:14px;background:#fffdfa;border:1px solid var(--line);border-radius:4px}
  .my-sheet-mini{flex:0 0 140px;width:140px;aspect-ratio:16/9;background:linear-gradient(135deg,#f4f1ed,var(--wash));position:relative;overflow:hidden}
  .my-sheet-mini img{width:100%;height:100%;object-fit:cover}
  .my-sheet-mini span{position:absolute;right:10px;bottom:3px;opacity:.24;font-size:32px}
  .my-sheet-info{flex:1;min-width:0}
  .my-sheet-info h3{font:600 21px var(--serif);margin:5px 0}
  .my-sheet-info p{font-size:12px;color:var(--muted);margin:3px 0}
  .my-sheet-buttons,.my-sheet-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .my-sheet-buttons{justify-content:flex-end}.my-sheet-strip{margin:14px 0}
  .danger-quiet{color:#a5423d!important;border-color:#d2b4b2!important}
  .button-danger{background:#a5423d!important;color:#fff!important;border-color:#a5423d!important}

/* Abertura da ficha: pincelada curta, papel japonês e selo, sem bloquear a navegação */
.shinobi-entrance{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;isolation:isolate;opacity:0;pointer-events:auto;transition:opacity .26s ease-out}
.shinobi-entrance:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 48% 48% at 50% 50%,rgba(224,212,188,.96),rgba(213,206,187,.95) 66%,rgba(39,57,46,.87));clip-path:circle(0% at 50% 50%);transition:clip-path .42s cubic-bezier(.16,.7,.31,1);box-shadow:0 0 70px #3548374d inset}
.shinobi-entrance:after{content:"";position:absolute;inset:0;opacity:.2;pointer-events:none;background:repeating-linear-gradient(110deg,transparent 0 6px,rgba(53,70,56,.1) 7px,transparent 8px 16px)}
.shinobi-entrance.is-opening{opacity:1}
.shinobi-entrance.is-opening:before{clip-path:circle(85% at 50% 50%)}
.shinobi-entrance-ink{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:11px;opacity:0;transform:translateY(15px) scale(.94);transition:opacity .28s ease .10s,transform .32s ease .10s;text-align:center;color:#27392f}
.shinobi-entrance.is-opening .shinobi-entrance-ink{opacity:1;transform:translateY(0) scale(1)}
.shinobi-entrance-symbol{display:grid;place-items:center;border:2px solid #ad6d64;border-radius:50%;width:75px;height:75px;font:700 39px var(--serif);color:#864e4b;background:rgba(254,248,235,.3)}
.shinobi-entrance-title{font-size:11px;font-weight:800;letter-spacing:.21em}
.shinobi-entrance-ink small{font-size:12px;letter-spacing:.03em;color:#606b60}
.shinobi-entrance.is-closing{opacity:0;pointer-events:none;transition:opacity .36s ease}
.shinobi-entrance.is-closing .shinobi-entrance-ink{opacity:0;transform:translateY(-9px)}
@media(prefers-reduced-motion:reduce){
 .shinobi-entrance,.shinobi-entrance:before,.shinobi-entrance-ink{transition-duration:.01s!important}
}


/* Retratos por upload: integra o espaço original das fichas do Canva */
.cv-portrait{position:absolute;left:62.7%;top:17.2%;width:30.7%;height:22%;z-index:4;overflow:hidden;border-radius:2px}
.cv-portrait-image{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.cv-portrait-pick{position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;padding:12px 6px;border:0;background:transparent;color:#894644;font-size:11px;font-weight:800;cursor:pointer;transition:background .18s ease;white-space:normal}
.cv-portrait-pick span{display:inline-block;border:1px solid #af8b84;background:#eee7d9ee;padding:5px 9px;border-radius:4px;box-shadow:0 2px 9px #29181724}
.cv-portrait-pick:hover,.cv-portrait-pick:focus-visible{background:rgba(177,132,123,.16);outline:2px solid #9a5550;outline-offset:-3px}
.cv-portrait.has-image .cv-portrait-pick{opacity:0;background:linear-gradient(0deg,#201a1a9c,transparent 40%);color:#fff}
.cv-portrait.has-image:hover .cv-portrait-pick,.cv-portrait.has-image .cv-portrait-pick:focus-visible{opacity:1}
.cv-portrait-remove{position:absolute;top:5px;right:6px;width:28px;height:28px;border:1px solid #eee0d0;border-radius:50%;background:#693b3bdd;color:white;font-size:20px;line-height:1;cursor:pointer}
.cv-portrait:not(:hover):not(:focus-within) .cv-portrait-remove{opacity:0}
.portrait-editor{grid-column:1/-1;display:flex;align-items:center;gap:16px;border:1px solid #b8afa0;background:linear-gradient(110deg,#eee5d6,#dcd9cb);padding:12px;border-radius:5px}
.portrait-editor-preview{width:108px;height:138px;flex:0 0 108px;overflow:hidden;display:grid;place-items:center;background:#d8d2c2;color:#777367;font:700 43px var(--serif);border:1px solid #aca79a}
.portrait-editor-preview img{width:100%;height:100%;object-fit:cover}
.portrait-editor-info{flex:1;min-width:0}
.portrait-editor-info strong{font-family:var(--serif);font-size:17px}
.portrait-editor-info p{font-size:12px;line-height:1.65;color:#646357;margin:6px 0 12px}
@media(max-width:700px){.cv-portrait-pick{font-size:10px}.portrait-editor{align-items:flex-start}.portrait-editor-preview{width:80px;height:108px;flex-basis:80px}}
@media print{.cv-portrait{z-index:5}.cv-portrait-pick,.cv-portrait-remove{display:none!important}.cv-portrait-image{print-color-adjust:exact}}


/* ============================================================
   CANVA — CORREÇÃO DE SOBREPOSIÇÃO DOS CAMPOS DIGITAIS
   As caixas já estão desenhadas nas 48 páginas originais.
   Os controles HTML devem exibir somente os valores, sem
   criar um segundo retângulo sobre cada caixa da ilustração.
   ============================================================ */
.shell .cv-page .cv-spot{
  box-sizing:border-box;
  z-index:3;
  overflow:visible;
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
}
.shell .cv-page .cv-spot .cv-in,
.shell .cv-page .cv-spot input.cv-in,
.shell .cv-page .cv-spot select.cv-in,
.shell .cv-page .cv-spot textarea.cv-in{
  box-sizing:border-box!important;
  width:100%!important;
  height:100%!important;
  min-width:0!important;
  max-width:100%!important;
  margin:0!important;
  padding:1px 2px!important;
  display:block!important;
  border:1px solid transparent!important;
  border-radius:2px!important;
  background:transparent!important;
  background-image:none!important;
  box-shadow:none!important;
  color:#322c2a!important;
  font-family:"DM Sans",Arial,sans-serif!important;
  font-size:clamp(9px,1vw,12px)!important;
  font-weight:600!important;
  line-height:1.12!important;
  letter-spacing:0!important;
  text-align:center!important;
  text-overflow:clip;
  outline:0!important;
  transition:background-color .14s ease,box-shadow .14s ease;
  -webkit-appearance:none;
  appearance:none;
}
.shell .cv-page .cv-spot textarea.cv-in{
  padding:2px 4px!important;
  text-align:left!important;
  line-height:1.25!important;
  overflow:auto;
  resize:none;
  white-space:pre-wrap;
}
.shell .cv-page .cv-spot select.cv-in{
  cursor:pointer;
  text-align-last:center;
  padding-right:1px!important;
}
.shell .cv-page .cv-spot input[type="number"]{
  -moz-appearance:textfield!important;
  appearance:textfield!important;
}
.shell .cv-page .cv-spot input[type="number"]::-webkit-outer-spin-button,
.shell .cv-page .cv-spot input[type="number"]::-webkit-inner-spin-button{
  -webkit-appearance:none!important;
  appearance:none!important;
  margin:0!important;
  display:none!important;
}
/* Indicação delicada apenas ao interagir: as molduras originais
   continuam visíveis por baixo, sem blocos brancos duplicados. */
.shell .cv-page .cv-spot:hover .cv-in{
  border-color:rgba(83,75,63,.22)!important;
  background:rgba(245,239,226,.26)!important;
  box-shadow:inset 0 0 0 1px rgba(109,102,81,.06)!important;
}
.shell .cv-page .cv-spot .cv-in:focus,
.shell .cv-page .cv-spot .cv-in:focus-visible{
  border-color:var(--theme-deep,#526354)!important;
  outline:0!important;
  background:rgba(248,242,229,.94)!important;
  box-shadow:0 0 0 2px rgba(47,63,51,.18)!important;
  position:relative;
  z-index:6;
}
.shell .cv-page .cv-spot:focus-within{z-index:8}
/* Valores calculados: só números e texto, sem um quadrado extra. */
.shell .cv-page .cv-readonly{
  box-sizing:border-box!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  width:100%!important;
  height:100%!important;
  padding:0 2px!important;
  margin:0!important;
  background:transparent!important;
  border:none!important;
  box-shadow:none!important;
  color:#3c3631!important;
  font-weight:800!important;
  font-size:clamp(9px,1.05vw,12px)!important;
  line-height:1.1!important;
  text-align:center!important;
  white-space:nowrap;
}
/* Ajuste de atributo: não esconder o número com três caixas. */
.shell .cv-page .cv-stepper{
  display:grid!important;
  grid-template-columns:minmax(0,1fr) minmax(0,1.45fr) minmax(0,1fr);
  align-items:center!important;
  justify-items:stretch!important;
  width:100%!important;
  height:100%!important;
  margin:0!important;
  padding:0!important;
  gap:0!important;
  border:0!important;
  background:transparent!important;
  box-shadow:none!important;
  color:#4e3537!important;
}
.shell .cv-page .cv-stepper b{
  grid-column:2;
  grid-row:1;
  display:block!important;
  min-width:0;
  width:100%;
  text-align:center!important;
  font-size:clamp(10px,1.1vw,13px)!important;
  font-weight:800!important;
  line-height:1!important;
}
.shell .cv-page .cv-stepper button{
  display:flex!important;
  justify-content:center!important;
  align-items:center!important;
  min-width:0!important;
  width:100%!important;
  height:100%!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  border-radius:2px!important;
  box-shadow:none!important;
  background:transparent!important;
  color:var(--theme-deep,#69464c)!important;
  opacity:.42;
  font-size:clamp(10px,1vw,13px)!important;
  font-weight:800!important;
  line-height:1!important;
  cursor:pointer;
  transition:opacity .12s ease,background .12s ease;
}
.shell .cv-page .cv-stepper button:first-child{grid-column:1;grid-row:1}
.shell .cv-page .cv-stepper button:last-child{grid-column:3;grid-row:1}
.shell .cv-page .cv-stepper:hover button,
.shell .cv-page .cv-stepper button:focus-visible{opacity:1}
.shell .cv-page .cv-stepper button:hover{
  background:rgba(var(--theme-rgb,93,123,105),.13)!important;
}
.shell .cv-page .cv-stepper button:focus-visible{
  outline:1px solid var(--theme-deep,#526354)!important;
  opacity:1;
}
/* Impressão: sem realce de formulário, somente os dados sobre a arte. */
@media print{
  .shell .cv-page .cv-spot .cv-in,
  .shell .cv-page .cv-spot .cv-in:focus,
  .shell .cv-page .cv-spot .cv-in:hover,
  .shell .cv-page .cv-readonly,
  .shell .cv-page .cv-stepper{
    background:transparent!important;
    border:0!important;
    outline:0!important;
    box-shadow:none!important;
  }
  .shell .cv-page .cv-stepper button{visibility:hidden!important}
}


/* GUIA DE CRIAÇÃO · livro de campo em aquarela sumi-ê */
.guide-head{position:relative;display:grid;grid-template-columns:1.25fr .75fr;min-height:215px;overflow:hidden;border:1px solid #aaa99a;background:linear-gradient(118deg,#e9e2d3,#dddcd0);box-shadow:0 14px 28px #292f291b}
.guide-head-copy{position:relative;z-index:2;padding:30px clamp(20px,3vw,42px)}
.guide-head h1{font:600 clamp(28px,3vw,42px)/1.16 var(--serif);color:#2b332c;letter-spacing:-.026em;margin:10px 0 12px}
.guide-head p{font-size:13px;color:#596359;max-width:560px;line-height:1.8;margin:0}
.guide-head-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:19px}
.guide-mark,.guide-count{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid #bab4a2;font-size:11px;font-weight:700;color:#47564b;background:#e9e5d8}
.guide-count{background:#dedfcf}
.guide-head-illustration{position:relative;overflow:hidden;min-height:200px;background:linear-gradient(130deg,rgba(229,222,211,.5),var(--wash,#9caa9a))}
.guide-head-illustration img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.guide-head-illustration>span{position:absolute;right:16px;bottom:2px;color:#2e3e3542;font-size:95px;font-family:var(--serif)}
.guide-meter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}
.guide-meter-item{padding:13px 14px;background:linear-gradient(130deg,#e9e2d3,#dfddd1);border:1px solid #b5b3a5;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px}
.guide-meter-item>span{font-size:11px;color:#596357;font-weight:700}
.guide-meter-item>strong{font-size:19px;color:#303c32}
.guide-meter-item>strong small{font-size:12px;color:#778075}
.guide-meter-bar{height:4px;background:#c9c9b8;width:100%;border-radius:6px;overflow:hidden}
.guide-meter-bar i{display:block;background:var(--theme-deep,#4d6a55);height:100%;transition:width .18s ease}

.guide-layout{display:grid;grid-template-columns:minmax(225px,285px) minmax(0,1fr);align-items:start;gap:18px}
.guide-nav{display:flex;flex-direction:column;gap:2px;border:1px solid #adaf9f;background:#e3dfd2;padding:10px}
.guide-nav-title{font-size:10px;color:#7c635b;letter-spacing:.17em;font-weight:800;padding:12px 10px}

.guide-nav button:hover{background:#d5d6c8}

.guide-nav .guide-index{display:grid;place-items:center;flex:0 0 28px;width:28px;height:28px;border:1px solid #a2a99b;border-radius:50%;font-size:11px;font-weight:800}

.guide-nav .active .guide-index{border-color:#d1dccc;color:#e4ecde}
.guide-nav button>span:last-child{display:flex;flex-direction:column;gap:4px;min-width:0}

.guide-nav small{color:#737c70;font-size:10px;line-height:1.4}
.guide-nav button.active small{color:#d0d9cd}

.guide-article-kicker{font-size:11px;font-weight:800;letter-spacing:.18em;color:#8a655c}
.guide-article h2{font:600 clamp(23px,2.7vw,32px)/1.25 var(--serif);margin:11px 0 5px;color:#2d382e}
.guide-subtitle{font-size:12px;color:#7b8173;margin-bottom:24px}
.guide-rule{font-size:13px;line-height:1.9;color:#465047}
.guide-rule p{margin:0 0 17px}
.guide-rule b,.guide-rule strong{color:#2b392d}

.guide-attr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:20px 0}
.guide-attr-grid span{background:#e0dfd3;padding:10px 12px;border:1px solid #c4c4b6;font-size:11px}

.guide-where{display:flex;flex-direction:column;gap:4px}
.guide-where span{font-size:10px;font-weight:800;letter-spacing:.14em;color:#798074}
.guide-where b{font-size:12px;color:#3c4d3f}
.guide-pager{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:19px}
.guide-pager span{color:#7b8277;font-size:11px}
.guide-checklist{border:1px solid #b9bfb0;margin:16px 0}
.guide-checklist>div{display:flex;align-items:center;gap:13px;padding:11px 15px;background:#e8e4d8;border-bottom:1px solid #c8c9ba}
.guide-checklist>div:last-child{border:0}
.guide-checklist>div>span{border-radius:50%;width:26px;height:26px;flex-shrink:0;display:grid;place-items:center;border:1px solid #aeb0a1;color:#8b7663;font-weight:800}

function isImageDataUrl(value){
    return typeof value==='string'&&/^data:image\/(jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(value);
  }
  async function compressPortrait(file){
    const accepted=['image/jpeg','image/png','image/webp'];
    if(!file||!accepted.includes(file.type))throw Error('Escolha uma imagem JPG, PNG ou WebP.');
    if(!file.size||file.size>PORTRAIT_SOURCE_MAX)throw Error('Arquivo muito grande. Envie uma imagem de até 12 MB.');
    const url=URL.createObjectURL(file);
    let bitmap=null;
    try{
      bitmap=await new Promise((resolve,reject)=>{
        const img=new Image();
        img.onload=()=>resolve(img);
        img.onerror=()=>reject(new Error('Não foi possível ler essa imagem.'));
        img.src=url;
      });
      if(!bitmap.naturalWidth||!bitmap.naturalHeight)throw Error('A imagem selecionada não é válida.');
      const canvas=document.createElement('canvas');
      const ctx=canvas.getContext('2d',{alpha:true});
      if(!ctx)throw Error('Seu navegador não conseguiu preparar a imagem.');
      for(const maxSide of [900,720,560,440,320]){
        const ratio=Math.min(1,maxSide/Math.max(bitmap.naturalWidth,bitmap.naturalHeight));
        canvas.width=Math.max(1,Math.round(bitmap.naturalWidth*ratio));
        canvas.height=Math.max(1,Math.round(bitmap.naturalHeight*ratio));
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.imageSmoothingEnabled=true;
        ctx.imageSmoothingQuality='high';
        ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
        for(const quality of [.82,.7,.58,.45]){
          let data=canvas.toDataURL('image/webp',quality);
          if(!data.startsWith('data:image/webp;'))data=canvas.toDataURL('image/jpeg',quality);
          if(isImageDataUrl(data)&&data.length<=PORTRAIT_DATA_MAX)return data;
        }
      }
      throw Error('Não foi possível comprimir essa imagem. Tente outra foto.');
    }finally{URL.revokeObjectURL(url)}
  }

async function deleteSheet(){

 S.modal=null;if(S.sheetId===id){clearTimeout(S.saveTimer);S.saveTimer=null}
 try{
   if(S.pendingWrite)await S.pendingWrite.catch(()=>{});

function themeClan(){
 const mine=(S.sheets||[]).filter(x=>x?.data?.clanId);
 if(!mine.length)return null;
 mine.sort((a,b)=>{
  const dateA=n(a.data?.criadoEm)||0,dateB=n(b.data?.criadoEm)||0;
  if(dateB!==dateA)return dateB-dateA;
  return String(b.id||'').localeCompare(String(a.id||''));
 });
 return CLANS.find(c=>c.id===mine[0].data.clanId)||null;
}
function themeStyle(){
 const clan=themeClan();
 if(!clan)return '';
 const hex=clan.color.replace('#','');
 const rgb=[0,2,4].map(i=>parseInt(hex.slice(i,i+2),16));
 const deep=rgb.map(x=>Math.round(x*.67+38*.33));
 const deepHex='#'+deep.map(x=>x.toString(16).padStart(2,'0')).join('');
 return `style="--theme-accent:${clan.color};--theme-rgb:${rgb.join(',')};--theme-deep:${deepHex};--theme-wash:${clan.wash}" data-theme="${clan.id}"`;
}

  function home(){const c=active()?clanOf(active().clanId):null;return layout(`<section class="hero hero-inkwash"><div class="hero-copy"><div class="eyebrow">UM NOVO CICLO · SHINOBI CHRONICLES</div><h1>Seu caminho<br>começa aqui.</h1><p>Explore as famílias shinobi, registre seu personagem e acompanhe sua evolução com uma ficha automatizada pelo sistema D8.</p><div class="flex wrap mt24"><button class="button" data-action="nav" data-view="clans">Explorar os clãs <span>↗</span></button><button class="button secondary" data-action="nav" data-view="fichas">Minhas fichas</button></div></div><div class="hero-scene">${heroArt}</div></section>${!CONFIGURED?`<div class="notice warn mt16"><b>Modo de demonstração.</b> A interface e os cálculos já funcionam, mas os dados não serão salvos online até configurar o Firebase no arquivo <code>index.html</code>. É possível testar a ficha agora.</div>`:''}<div class="section-head"><div><div class="eyebrow">ARQUIVOS DE KONOHA</div><h2>Explore os clãs</h2></div><p>11 linhagens e um caminho independente</p></div><div class="clans-grid">${CLANS.slice(0,6).map(clanCard).join('')}</div><div class="section-head"><div><div class="eyebrow">O SEU REGISTRO</div><h2>Ficha de personagem</h2></div></div>${c?`<div class="paper-panel"><div class="flex between wrap"><div><div class="eyebrow">PERSONAGEM ATIVO</div><h3 style="margin:8px 0">${E(active().nome||'Personagem sem nome')} · ${E(c.name)}</h3><div class="panel-caption">Nível de Campanha ${active().nc} · ${E(active().graduacao)}</div></div><button class="button" data-action="nav" data-view="sheet">Continuar edição ↗</button></div></div>`:`<div class="empty"><h3>Sua história ainda não foi registrada</h3><p>Escolha um clã e crie sua ficha; os atributos e as perícias serão calculados automaticamente.</p><button class="button" data-action="nav" data-view="clans">Escolher clã</button></div>`}`)}

n>`}</form><p class="auth-help">${master?'A senha fica na sua conta do Firebase, nunca no código. A primeira entrada cadastra o mestre; faça isso antes de compartilhar o endereço com amigos.':'As fichas são privadas. Sem e-mail real, a recuperação automática de senha não está disponível.'}</p></div></div></main></div>`;

  function identity(p){return `<div class="two-col"><section class="paper-panel"><h3>Dados do personagem</h3><div class="form-grid">${field('Nome do personagem','nome',p.nome)}${field('Idade','idade',p.idade)}${field('Vila','vila',p.vila)}${field('Graduação narrativa','graduacao',p.graduacao)}<div class="field"><label>Nível de Campanha (NC)</label><select data-bind="nc">${Object.entries(NC_TABLE).map(([k,t])=>`<option value="${k}" ${Number(k)===p.nc?'selected':''}>NC ${k} — ${E(t.label)}</option>`).join('')}</select></div><div class="field full">${portraitEditor(p)}</div><div class="field full">${area('Conceito e aparência','descricao',p.descricao,3)}</div></div></section><section class="paper-panel"><h3>Identificação e recursos</h3><div class="stat-row"><span>Clã escolhido</span><strong>${E(clanOf(p.clanId).name)}</strong></div><div class="stat-row"><span>Nível shinobi</span><strong>${E(currentNC().label)}</strong></div><div class="stat-row"><span>Limite máximo de atributo</span><strong>${p.nc}</strong></div><div class="stat-row"><span>Limite de poder/perícia</span><strong>${limit()}</strong></div><div class="stat-row"><span>Mínimo de cada atributo</span><strong>${currentNC().min}</strong></div><div class="stat-row"><span>Ryos iniciais (referência)</span><strong>${fmt(currentNC().ryos)}</strong></div><p class="panel-caption mt24">A família escolhida serve como referência de acesso a poderes restritos. Este editor não distribui automaticamente Sharingan, Byakugan ou outras técnicas.</p></section></div>`}

  function combatView(p){const cs=['CC','CD','ESQ','LM'], names={CC:'Combate Corporal',CD:'Combate à Distância',ESQ:'Esquiva',LM:'Ler Movimento'};let totalShift=cs.reduce((s,k)=>s+Math.max(0,n(p.combateAjustes[k])),0);return `<div class="two-col"><div class="stack"><section class="paper-panel"><h3>Habilidades de combate</h3>${cs.map(k=>`<div class="stat-row"><span>${names[k]} <small class="muted">(base ${3+n(p.combateAjustes[k])})</small></span><strong>${combat(p,k)}</strong></div>`).join('')}<p class="panel-caption mt16">CC = base + FOR · CD = base + DES · ESQ = base + AGI · LM = base + PER</p></section><section class="paper-panel"><h3>Redistribuição de bases</h3><p class="panel-caption">Pode transferir até 2 pontos de base entre as quatro habilidades. Cada base começa em 3.</p><div class="form-grid mt16"><div class="field"><label>Retirar 1 ponto de</label><select id="shift-from">${cs.map(k=>`<option value="${k}">${names[k]}</option>`).join('')}</select></div><div class="field"><label>Adicionar 1 ponto em</label><select id="shift-to">${cs.map(k=>`<option value="${k}">${names[k]}</option>`).join('')}</select></div></div><div class="flex wrap mt16"><button class="button small" data-action="shift">Transferir 1 ponto</button><button class="button secondary small" data-action="reset-shift">Restaurar bases</button><span class="pill">${totalShift} / 2 transferências</span></div></section></div><div class="stack"><section class="paper-panel"><h3>Energias de combate</h3>${pool(p,'vit','Vitalidade',vitMax(p))}<div style="height:12px"></div>${pool(p,'chakra','Chakra',chakraMax(p))}</section><section class="paper-panel"><h3>Valores automáticos</h3><div class="stat-row"><span>Dificuldade para Esquiva</span><strong>${9+combat(p,'ESQ')}</strong></div><div class="stat-row"><span>Deslocamento / movimento</span><strong>${10+Math.ceil(n(p.atributos.AGI)/2)} m</strong></div><div class="stat-row"><span>Iniciativa</span><strong>1d8 + ${n(p.atributos.AGI)+skillTotal(p,'Prontidão')}</stro function describeSheetChange(before,after,type){

 for(const [path,label] of [['nome','Nome'],['nc','NC'],['graduacao','Graduação'],['recursos.vit','Vitalidade'],['recursos.chakra','Chakra']]){
  const a=getAt(before,path),b=getAt(after,path);
  if(String(a??'')!==String(b??''))return label+': '+String(a??'—').slice(0,30)+' → '+String(b??'—').slice(0,30);
 }
 for(const [key,name] of ATTRS)if(n(before.atributos?.[key])!==n(after.atributos?.[key]))return name+': '+n(before.atributos?.[key])+' → '+n(after.atributos?.[key]);

 for(const [field,label] of [['jutsus','Jutsus'],['poderes','Poderes'],['aptidoes','Aptidões'],['inventario','Inventário'],['historia','História']])

 return 'Dados da ficha atualizados';

function startAdminLive(){
 if(!fb||!canAdmin()||!S.adminUnlocked||S.adminUnsubscribe)return;
 S.adminLive=false;S.adminLiveError=false;S.adminLiveReady=false;
 S.adminUnsubscribe=fb.onSnapshot(fb.collection(fb.db,'fichas'),snapshot=>{
   if(!canAdmin()||!S.adminUnlocked)return;
   const previous=new Map(S.adminSheets.map(x=>[x.__id,x]));
   const next=snapshot.docs.map(d=>({...d.data(),__id:d.id}));
   if(S.adminLiveReady){
     for(const change of snapshot.docChanges()){
       const after=change.doc.data(),before=previous.get(change.doc.id);
       if(S.lastSavedWrite?.id===change.doc.id&&n(S.lastSavedWrite?.stamp)===n(after?.atualizadoEm))continue;
       S.adminEvents.unshift({nome:after.nome||before?.nome||'Personagem',resumo:describeSheetChange(before,after,change.type),hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})});
     }
     S.adminEvents=S.adminEvents.slice(0,20);
   }
   S.adminLiveReady=true;S.adminLive=true;S.adminLiveError=false;S.adminSheets=next;
   if(S.adminViewing&&S.sheetId){
     const remote=next.find(x=>x.__id===S.sheetId);
     if(remote&&n(remote.atualizadoEm)!==n(S.sheet?.atualizadoEm)){
       const own=S.lastSavedWrite?.id===S.sheetId&&n(S.lastSavedWrite?.stamp)===n(remote.atualizadoEm);
       if(!own){
         const focus=!!document.activeElement?.matches?.('[data-bind],[data-cv-array],[data-cv-skill],input,textarea,select');
         if(focus||S.locallyDirty||S.saveTimer||S.isSaving){
           S.pendingRemote=remote;const label=$('#admin-sheet-sync');
           if(label){label.textContent='Alteração externa recebida · clique para atualizar';label.classList.add('has-update')}
         }else{S.sheet=normalize(remote);S.pendingRemote=null;render()}
       }else S.sheet.atualizadoEm=remote.atualizadoEm;
     }
   }
   showAdminLiveUI();
 },error=>{
   console.error('Firestore ao vivo:',error.code||error);
   S.adminLive=false;S.adminLiveError=true;
   if(S.adminUnsubscribe){try{S.adminUnsubscribe()}catch(_){}S.adminUnsubscribe=null}
   showAdminLiveUI();showToast('A sincronização do mestre foi interrompida. Confira as regras do Firestore.',true);
 });
 showAdminLiveUI();
}

function guideStepDone(i,p,t,r){
 const c=p.aptidoes.filter(a=>a?.nome?.trim()).length;

 if(i===1)return !!NC_TABLE[p.nc];
 if(i===2)return t.attrs===r.attrs&&ATTRS.every(([k])=>n(p.atributos[k])>=r.min);
 if(i===3)return true;
 if(i===4)return t.skills===r.skills;
 if(i===5)return t.social===r.social;
 if(i===6)return c>=3;
 if(i===7)return t.powers===r.powers;
 if(i===8)return true;
 if(i===9)return !!String(p.historia||'').trim();
 if(i===10)return [0,2,4,5,6,7].every(k=>guideStepDone(k,p,t,r));
 return false;
}

 if(index===3)return `<p>Cada habilidade de combate usa <b>Valor Base 3 + atributo</b>. A ficha calcula automaticamente os valores enquanto você altera FOR, DES, AGI e PER.</p><div class="guide-table"><div><span>Combate Corporal (CC)</span><b>${3+n(p.combateAjustes?.CC)} + FOR = ${combat(p,'CC')}</b></div><div><span>Combate à Distância (CD)</span><b>${3+n(p.combateAjustes?.CD)} + DES = ${combat(p,'CD')}</b></div><div><span>Esquiva (ESQ)</span><b>${3+n(p.combateAjustes?.ESQ)} + AGI = ${combat(p,'ESQ')}</b></div><div><span>Ler Movimento (LM)</span><b>${3+n(p.combateAjustes?.LM)} + PER = ${combat(p,'LM')}</b></div></div><p>Durante a criação, você pode transferir até <b>dois pontos de Valor Base</b> entre essas quatro habilidades. Essa escolha não pode ser refeita livremente após a criação.</p><div class="guide-example">Use o <b>Editor detalhado → Combate</b> para configurar as transferências. Não é obrigatório transferir pontos.</div>`;

 if(index===5)return `<p>Os atributos sociais são separados dos sete atributos principais: <b>Carisma</b> mede influência e simpatia, enquanto <b>Manipulação</b> abrange blefes, lábia e enganação.</p><p>No NC ${p.nc}, distribua ${num(r.social)} pontos entre os dois, respeitando o limite de ${num(lv)} por atributo social.</p><div class="guide-example">Exemplo no NC 4: Carisma 1 e Manipulação 1. Você também pode investir 2 em apenas um deles. O manual admite que grupos que prefiram interpretar sem testes sociais ignorem essa etapa, conforme decisão do mestre.</div><p><b>Na sua ficha:</b> ${t.social} de ${r.social} pontos sociais distribuídos.</p>`;
 if(index===6)return `<p>Escolha <b>três aptidões gratuitas</b> dentre as opções permitidas. Se o clã ${E(clan.name)} permitir aptidões específicas e o personagem cumprir seus pré-requisitos, elas também podem ser opções gratuitas.</p><p>Aptidões adicionais, além das três gratuitas, custam <b>2 pontos de poder cada</b>. Não confunda aptidão com poder: cada uma tem sua própria função e requisitos.</p><div class="guide-example">Algumas aptidões mencionadas no manual são Acuidade, Reflexos, Especialista, Velocista e Clone. Confira os requisitos de cada uma no livro antes de selecionar.</div><p><b>Na sua ficha:</b> ${abilities} aptidão(ões) registradas. As adicionais já entram no orçamento de poder.</p>`;
 if(index===7)return `<p>Agora use seus <b>${r.powers} pontos de poder</b>. Cada nível de um poder custa um ponto, e no NC ${p.nc} nenhum poder pode ultrapassar nível ${lv}. Aptidões extras também descontam desse orçamento.</p><p>O clã ${E(clan.name)} permite acesso a opções restritas correspondentes, mas <b>nenhuma técnica é obtida automaticamente</b>. Os poderes precisam ser comprados e os pré-requisitos verificados.</p><div class="guide-example"><b>Exemplo no NC 4:</b> comprar Katon nível 2 custa 2 pontos de poder, deixando 2 para outros poderes ou uma aptidão extra. Técnicas básicas são gratuitas; jutsus conhecidos devem ser registrados de acordo com o nível e as regras do poder correspondente.</div><p>Em geral, o custo de Chakra da técnica é igual ao nível usado. Confira exceções no livro.</p><p><b>Na sua ficha:</b> ${t.powers} de ${r.powers} pontos de poder comprometidos.</p>`;
 if(index===8)return `<p>O site calcula as energias com os atributos e NC selecionados. Você não precisa fazer a conta manualmente, mas vale saber de onde vêm os números.</p><div class="guide-formula">Vitalidade máxima = 10 + (3 × VIG) + (5 × NC)<br>Chakra máximo = 10 + (3 × ESP)</div><div class="guide-table"><div><span>Sua Vitalidade máxima</span><b>${vitMax(p)}</b></div><div><span>Seu Chakra máximo</span><b>${chakraMax(p)}</b></div></div><p>Para um Genin NC 4 com Vigor 1 e Espírito 2, os valores seriam <b>33 de Vitalidade e 16 de Chakra</b>. Os campos de recursos atuais indicam quanto ainda resta durante o jogo.</p>`;
 if(index===9)return `<p>Registre seus Ryos e equipamentos na quarta página. O dinheiro inicial de um Genin NC 4 é <b>100 Ryos</b>. O equipamento básico, como kunais e shurikens, costuma ser fornecido pela Vila, respeitando a capacidade de carga.</p><p>Os itens ocupam compartimentos. Consulte o manual para preços, limites e equipamentos especiais; o guia não preenche esses valores por conta própria.</p><div class="guide-example"><b>História:</b> escreva a família, as relações, um objetivo e o que motiva o personagem a atuar como shinobi. Isso ajuda o mestre a inserir seu personagem na campanha.</div><p>No editor, você pode enviar a imagem do personagem diretamente do aparelho, trocar o retrato e salvar tudo na sua conta.</p>`;

}

function guideChecks(p,t,r){
 const abilities=p.aptidoes.filter(x=>x?.nome?.trim()).length;
 return [
  {label:'Identidade',detail:p.nome?`Nome: ${p.nome}`:'Preencha o nome do personagem',ok:!!String(p.nome||'').trim()},
  {label:'Atributos',detail:`${t.attrs} / ${r.attrs} pontos; mínimo ${r.min} em cada atributo`,ok:t.attrs===r.attrs&&ATTRS.every(([k])=>n(p.atributos[k])>=r.min&&n(p.atributos[k])<=p.nc)},
  {label:'Perícias',detail:`${t.skills} / ${r.skills} pontos; máximo ${limit()} por perícia`,ok:t.skills===r.skills&&SKILLS.every(([name])=>n(p.pericias[name])<=limit())&&!(p.nc===4&&n(p.pericias.Venefício)>0)},
  {label:'Sociais',detail:`${t.social} / ${r.social} pontos em Carisma e Manipulação`,ok:t.social===r.social},
  {label:'Aptidões',detail:`${abilities} registradas; três gratuitas e extras pagas com poderes`,ok:abilities>=3},
  {label:'Poderes',detail:`${t.powers} / ${r.powers} pontos investidos, incluindo aptidões extras`,ok:t.powers===r.powers},
  {label:'Energia calculada',detail:`Vitalidade ${vitMax(p)} · Chakra ${chakraMax(p)}`,ok:true},
 ];
}

function guideField(label,path,value,opts={}){
 const attr=`data-bind="${E(path)}" aria-label="${E(label)}"`;
 const input=opts.area?`<textarea ${attr} rows="${opts.rows||3}" placeholder="${E(opts.placeholder||'')}">${E(value??'')}</textarea>`:
 `<input ${attr} type="${opts.type==='number'?'number':'text'}" value="${E(value??'')}" ${opts.type==='number'?'min="0" step="1"':''} placeholder="${E(opts.placeholder||'')}" autocomplete="off">`;
 return `<label class="guide-field"><span>${E(label)}</span>${input}</label>`;
}

function guideListEditor(p,array,label,fields,hint){
 const records=p[array]||[];
 const entries=records.length?records.map((item,i)=>`
 <div class="guide-entry"><div class="guide-entry-title"><span class="guide-entry-index">${String(i+1).padStart(2,'0')}</span><b>${E(label)} ${i+1}</b>
 ${array==='aptidoes'?`<small>${i<3?'Gratuita':'Extra · 2 pontos de poder'}</small>`:''}
 <button type="button" class="guide-remove" data-action="remove-item" data-array="${E(array)}" data-index="${i}" aria-label="Remover ${E(label)} ${i+1}">Remover ×</button></div>
 <div class="guide-fields">${fields.map(([title,key,type])=>guideField(title,`@${array}.${i}.${key}`,item?.[key],{type,area:type==='area',rows:3})).join('')}</div></div>`).join(''):'<p class="guide-empty">Nenhum registro ainda. Adicione o primeiro pelo botão abaixo.</p>';
 return `<section class="guide-list-editor"><div class="guide-list-head"><h4>${E(label)}</h4><small>${E(hint||'')}</small></div><div class="guide-entries">${entries}</div><button type="button" class="guide-add" data-action="add-item" data-array="${E(array)}">+ Adicionar ${E(label.toLowerCase())}</button></section>`;
}

function refreshGuideFeedback(){
 if(S.view!=='guia'||!active())return;
 const p=active(),r=currentNC(),t=totals(p);
 const done=GUIDE_STEPS.filter((_,i)=>guideStepDone(i,p,t,r)).length;
 const count=$('.guide-count');if(count)count.textContent=`${done} de ${GUIDE_STEPS.length} verificações atendidas`;
 const progress=$('.guide-nav-progress strong');if(progress)progress.textContent=`${done} / ${GUIDE_STEPS.length}`;
 const track=$('.guide-nav-progress-track i');if(track)track.style.width=`${Math.round(100*done/GUIDE_STEPS.length)}%`;
 [[t.attrs,r.attrs],[t.skills,r.skills],[t.powers,r.powers],[t.social,r.social]].forEach(([used,max],i)=>{
  const el=document.querySelectorAll('.guide-meter .guide-meter-item')[i];if(!el)return;
  el.classList.toggle('complete',used===max);
  const val=el.querySelector('strong');if(val)val.innerHTML=`${used} <small>/ ${max}</small>`;
  const bar=el.querySelector('i');if(bar)bar.style.width=`${Math.max(0,Math.min(100,Math.round(100*used/Math.max(1,max))))}%`;
 });
 document.querySelectorAll('.guide-nav button[data-step]').forEach((el,i)=>{
  const okay=guideStepDone(i,p,t,r);el.classList.toggle('done',okay);
  const marker=el.querySelector('.guide-index');if(marker)marker.textContent=okay?'✓':String(i+1).padStart(2,'0');
 });
}

  function cvWrap(inner,x,y,w,h,extraClass=''){
  const f=(a,b)=>(100*a/b).toFixed(4)+"%";
  return `<div class="cv-spot${extraClass?" "+extraClass:""}" style="left:${f(x,8.27)};top:${f(y,11.69)};width:${f(w,8.27)};height:${f(h,11.69)}">${inner}</div>`;
}
function cvInput(path,value,x,y,w,h,opts={}){
  const num=opts.num?'type="number" step="1"':'type="text"';
  const val=E(value??'');
  const label=E(opts.label||path);
  let element=opts.multiline?
    `<textarea class="cv-in" data-bind="${E(path)}" aria-label="${label}">${val}</textarea>`:
    `<input class="cv-in" data-bind="${E(path)}" ${num} value="${val}" aria-label="${label}" autocomplete="off">`;
  return cvWrap(element,x,y,w,h);
}
function cvArray(p,array,i,key,x,y,w,h,opts={}){
  const v=p[array]?.[i]?.[key]??'';
  const extra=`data-cv-array="${E(array)}" data-cv-index="${i}" data-cv-key="${E(key)}"`;
  const field=opts.multiline?`<textarea class="cv-in" ${extra} aria-label="${E(array+' '+key)}">${E(v)}</textarea>`:
    `<input class="cv-in" ${extra} ${opts.num?'type="number" step="1"':'type="text"'} value="${E(v)}" aria-label="${E(array+' '+key)}">`;
  return cvWrap(field,x,y,w,h);
}
function cvDisplay(value,x,y,w,h){return cvWrap(`<span class="cv-readonly">${E(value)}</span>`,x,y,w,h);}
function cvAttr(p,key,x,y,w,h){

 return cvWrap(`<span class="cv-stepper"><button type="button" data-action="attr" data-key="${key}" data-delta="-1" aria-label="Reduzir ${label}" ${n(p.atributos[key])<=0?"disabled":""}>−</button><b aria-label="${label}: ${n(p.atributos[key])}">${n(p.atributos[key])}</b><button type="button" data-action="attr" data-key="${key}" data-delta="1" aria-label="Aumentar ${label}" ${n(p.atributos[key])>=p.nc||totals(p).attrs>=currentNC().attrs?"disabled":""}>+</button></span>`,x,y,w,h,"cv-attr-spot");
}

function adjustSocial(key,delta){
 if(!canEditCurrent()||!['Carisma','Manipulacao'].includes(key))return;
 const p=active(),old=n(p.sociais?.[key]);
 if(delta===0)return;
 const next=old+delta;
 if(next<0||next>limit())return showToast('O limite de cada atributo social é metade do NC.',true);
 if(delta>0&&totals(p).social>=currentNC().social)return showToast('Você já distribuiu todos os pontos sociais.',true);
 p.sociais[key]=next;
 render();scheduleSave();
}

 }).join('');
}

}
function updateCanvaSkill(el,preserveFocus=false){
 const p=active(),k=el.dataset.cvSkill;
 if(!p||!canEditCurrent())return;
 const old=n(p.pericias[k]),next=bound(el.value,0,limit()),delta=next-old;
 if(delta>0&&totals(p).skills+delta>currentNC().skills){
   el.value=old;showToast('Pontos de perícia insuficientes.',true);return;
 }
 p.pericias[k]=next;scheduleSave();
 if(!preserveFocus)render();
}
function canvaUpdateArray(el,preserveFocus=false){
 const p=active();if(!p||!canEditCurrent())return;
 const array=el.dataset.cvArray,index=Number(el.dataset.cvIndex),key=el.dataset.cvKey;
 if(!['poderes','aptidoes','jutsus','inventario'].includes(array)||!Number.isInteger(index)||index<0||index>30)return;
 const values=p[array]||[];
 const old=values[index]?.[key]??'';
 let value=el.value;
 if(['nivel','quantidade','compartimentos','custo'].includes(key))value=bound(value,0,key==='nivel'?limit():9999);
 if(array==='poderes'&&key==='nivel'&&value-n(old)>0&&totals(p).powers+(value-n(old))>currentNC().powers){el.value=old;showToast('Pontos de poder insuficientes.',true);return;}
 if(array==='aptidoes'&&key==='nome'&&value.trim()&&!String(old).trim()&&p.aptidoes.filter(x=>x?.nome?.trim()).length>=3&&totals(p).powers+2>currentNC().powers){el.value=old;showToast('Sem pontos suficientes para mais uma aptidão.',true);return;}
 while(values.length<=index)values.push({});
 values[index][key]=value;
 p[array]=values;
 scheduleSave();
 if(!preserveFocus)render();
}

  function setStatus(st){S.saveState=st;const x=$('#save-status');if(x)x.textContent=st;const y=$('#save-footer');if(y)y.textContent=st}
  async function persist(){
 if(!active()||!S.sheetId)return false;
 if(!canEditCurrent()){showToast('Você não possui permissão para editar esta ficha.',true);return false}
 if(!CONFIGURED||!fb){setStatus('Modo demonstração · sem nuvem');return false}
 if(!S.user){showToast('Entre na conta para salvar.',true);return false}
 const target=S.sheetId;
 const original=S.adminViewing?S.adminSheets.find(x=>x.__id===target):null;
 const data=JSON.parse(JSON.stringify(active()));S.isSaving=true;
 data.ownerUid=S.adminViewing?original?.ownerUid:uid();
 if(!data.ownerUid){S.isSaving=false;return false}
 data.atualizadoEm=Date.now();S.lastSavedWrite={id:target,stamp:data.atualizadoEm};
 const own=S.sheets.find(x=>x.id===target);
 try{
   setStatus('Salvando...');
   S.pendingWrite=(S.pendingWrite||Promise.resolve()).catch(()=>{}).then(()=>fb.setDoc(fb.doc(fb.db,'fichas',target),data));
   await S.pendingWrite;
   if(own)own.data.atualizadoEm=data.atualizadoEm;
   if(original)Object.assign(original,data);
   S.locallyDirty=false;S.isSaving=false;setStatus('Salvo no Firebase ✓');
   return true;
 }catch(error){
   console.error('Erro ao salvar ficha:',error.code||error);
   S.isSaving=false;setStatus('Falha ao salvar');
   showToast('Não foi possível salvar. Confira a publicação das regras do Firestore.',true);
   return false;
 }
}
  function scheduleSave(){if(!active()||!canEditCurrent())return;S.locallyDirty=true;setStatus(CONFIGURED?'Alterações pendentes':'Prévia local');clearTimeout(S.saveTimer);S.saveTimer=setTimeout(()=>void persist(),280)}
  function updateValue(path,val){const p=active();if(!p||!canEditCurrent())return;const isArray=path.startsWith('@');if(isArray){const bits=path.slice(1).split('.');const [a,index,...rest]=bits;const obj=p[a]?.[Number(index)];if(!obj)return;const key=rest.join('.');let next=val;const numFields=['nivel','quantidade'];if(a==='aptidoes'&&key==='nome'&&String(next).trim()&&!String(obj[key]||'').trim()&&p.aptidoes.filter(x=>x?.nome?.trim()).length>=3&&totals(p).powers+2>currentNC().powers){showToast('Faltam pontos de poder para outra aptidão.',true);return false}if(numFields.includes(key)){next=bound(val,0,key==='nivel'?limit():9999);if(key==='nivel'&&a==='poderes'){const diff=next-n(obj[key]);if(diff>0&&totals(p).powers+diff>currentNC().powers){showToast('Pontos de poder insuficientes.',true);return false}}}obj[key]=next}else{let next=val;if(path==='nc'){const newNC=n(val);if(!NC_TABLE[newNC])return false;p.nc=newNC;render();scheduleSave();return true}if(['ryos','sociais.Carisma','sociais.Manipulacao','recursos.vit','recursos.chakra'].includes(path)){next=bound(val,path.startsWith('recursos')?-99:0,99999);if(path.startsWith('recursos')&&String(val).trim()==='')next=null;if(path.startsWith('sociais')){next=bound(val,0,limit());const before=n(getAt(p,path));if(totals(p).social-before+next>currentNC().social){showToast('Pontos sociais insuficientes.',true);return false}}}setAt(p,path,next);if(path==='recursos.vit'){S.portraitPreview=null;refreshPortraitUI()}}scheduleSave();return true}
  function adjustAttr(key,delta){if(!canEditCurrent())return;const p=active(),t=totals(p),cur=n(p.atributos[key]),next=cur+delta;if(next<0||next>p.nc)return showToast(`Atributos vão de 0 até NC ${p.nc}.`,true);if(delta>0&&t.attrs>=currentNC().attrs)return showToast('Todos os pontos de atributo disponíveis foram usados.',true);p.atributos[key]=next;render();scheduleSave()}
  function adjustSkill(key,delta){if(!canEditCurrent())return;const p=active(),t=totals(p),cur=n(p.pericias[key]),next=cur+delta;if(next<0||next>limit())return showToast(`Máximo de ${limit()} pontos nesta perícia.`,true);if(delta>0&&t.skills>=currentNC().skills)return showToast('Pontos de perícia insuficientes.',true);if(key==='Venefício'&&p.nc<8&&delta>0)return showToast('Venefício não pode ser comprada no NC 4.',true);p.pericias[key]=next;render();scheduleSave()}
  function shiftCombat(){if(!canEditCurrent())return;const p=active(),from=$('#shift-from')?.value,to=$('#shift-to')?.value;if(!from||!to||from===to)return showToast('Escolha habilidades diferentes.',true);const m=p.combateAjustes;let positive=Object.values(m).reduce((s,x)=>s+Math.max(0,n(x)),0);if(positive>=2&&n(m[from])<=0&&n(m[to])>=0)return showToast('Limite de duas transferências.',true);const copy={...m,[from]:n(m[from])-1,[to]:n(m[to])+1};if(Object.values(copy).reduce((s,x)=>s+Math.max(0,n(x)),0)>2||Object.values(copy).some(x=>3+n(x)<0))return showToast('As bases não podem transferir mais de 2 pontos.',true);p.combateAjustes=copy;render();scheduleSave()}
  function modifyItem(array,index,remove=false){if(!canEditCurrent())return;const p=active();if(!p||!['poderes','aptidoes','jutsus','inventario'].includes(array))return;if(remove){p[array].splice(index,1);render();scheduleSave();return}if(p[array].length>=MAX_ITEMS)return showToast('Limite de registros atingido.',true);if(array==='aptidoes'&&p.aptidoes.filter(x=>x?.nome?.trim()).length>=3&&totals(p).powers+2>currentNC().powers)return showToast('Faltam 2 pontos de poder para comprar outra aptidão.',true);const patterns={poderes:{nome:'',nivel:1,descricao:''},aptidoes:{nome:'',tipo:''},jutsus:{nome:'',nivel:1,acao:'',duracao:'',alvo:'',alcance:'',efeito:''},inventario:{nome:'',quantidade:1,obs:''}};if(array==='poderes'&&totals(p).powers+1>currentNC().powers)return showToast('Sem pontos de poder disponíveis.',true);p[array].push({id:randomId(),...patterns[array]});render();scheduleSave()}
  function roll(diceCount,bonus,label){const rolls=Array.from({length:diceCount},()=>1+Math.floor(Math.random()*8)),sum=rolls.reduce((a,b)=>a+b,0);let critical=diceCount===2&&(sum>=15?' · SUCESSO CRÍTICO':sum<=3?' · FALHA CRÍTICA':'');showToast(`${label}: ${rolls.join(' + ')} + ${bonus} = ${sum+bonus}${critical}`)}
  function exportSheet(){if(!active())return;const data=JSON.stringify(active(),null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`shinobi-${active().nome.toLowerCase().replace(/[^a-z0-9]/g,'-')||'personagem'}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}

  async function createSheetAnimated(){
    if(S.creating||!S.activeClan)return;

    document.body.appendChild(layer);
    requestAnimationFrame(()=>layer.classList.add('is-opening'));
    await new Promise(resolve=>setTimeout(resolve,540));

  }

  async function createSheet(){
  if(!S.activeClan)return;
  if(ownsCurrent()&&S.saveTimer){clearTimeout(S.saveTimer);S.saveTimer=null;await persist()}
  if(S.sheets.length>=40)return showToast('Máximo de 40 fichas por conta.',true);
  S.modal=null;
  const p=fresh(S.activeClan),id=uid()+'_'+randomId();
  S.sheets.push({id,data:p});S.sheet=p;S.sheetId=id;S.adminViewing=false;S.view='guia';S.guideStep=0;S.canvaMode='original';S.canvaPage=1;S.tab='identidade';render();
  const saved=await persist();
  if(CONFIGURED&&saved)showToast('Nova ficha criada. Você pode criar outras em Minhas fichas.');
}
  async function refreshAdmin(){
 if(!fb||!canAdmin()||!S.adminUnlocked)return;
 try{
   if(S.adminViewing&&S.saveTimer){clearTimeout(S.saveTimer);S.saveTimer=null;await persist()}
   if(S.pendingWrite)await S.pendingWrite.catch(()=>{});
   if(!S.adminUnsubscribe)startAdminLive();
   const first=ownSheets()[0];S.adminViewing=false;S.pendingRemote=null;S.sheet=first?.data||null;S.sheetId=first?.id||null;
   S.view='admin';render();showAdminLiveUI();
 }catch(err){console.error(err);showToast('Não foi possível sincronizar o painel.',true)}
}
  function pseudoEmail(raw){return raw.toLowerCase().trim()+'@players.shinobi-chronicles.invalid'}
  async function submitAuth(form){
 if(!fb||S.authWorking)return;
 const fd=new FormData(form),username=String(fd.get('username')||'').toLowerCase().trim(),password=String(fd.get('password')||'');
 if(!/^[a-z0-9._-]{3,20}$/.test(username))return showToast('Nome de usuário inválido: use de 3 a 20 caracteres.',true);
 if(password.length<6)return showToast('A senha deve ter pelo menos 6 caracteres.',true);
 const mode=S.authPane,master=mode==='admin',register=mode==='register';
 S.authWorking=true;S.adminLoginBusy=master;
 const button=form.querySelector('button[type="submit"]');
 if(button)button.disabled=true;
 try{
  const email=pseudoEmail(username);
  if(register&&username===MASTER_USERNAME)throw {code:'auth/master-reserved'};
  let credential;
  if(master&&username===MASTER_USERNAME){
    try{credential=await fb.signInWithEmailAndPassword(fb.auth,MASTER_EMAIL,password)}
    catch(error){
      if(!['auth/invalid-credential','auth/user-not-found'].includes(error.code))throw error;
      try{credential=await fb.createUserWithEmailAndPassword(fb.auth,MASTER_EMAIL,password)}
      catch(createError){
        if(createError.code==='auth/email-already-in-use')throw {code:'auth/invalid-credential'};
        throw createError;
      }
    }
  }else{
    credential=register?await fb.createUserWithEmailAndPassword(fb.auth,email,password):await fb.signInWithEmailAndPassword(fb.auth,email,password);
  }
  if(register)await fb.setDoc(fb.doc(fb.db,'users',credential.user.uid),{username,criadoEm:Date.now()});
  if(master){
   const authDoc=await fb.getDoc(fb.doc(fb.db,'admins',credential.user.uid));
   if(!authDoc.exists()&&credential.user.email!==MASTER_EMAIL){
    await fb.signOut(fb.auth);
    S.adminUnlocked=false;S.isAdmin=false;
    showToast('Esta conta não está autorizada como administrador.',true);
    return;
   }
   S.isAdmin=true;S.adminUnlocked=true;
   await refreshAdmin();
   showToast('Bem-vindo ao painel do mestre.');
  }else{
   S.view='home';showToast('Acesso autorizado. Bem-vindo ao Shinobi Chronicles.');
  }
 }catch(e){
  const msg={'auth/email-already-in-use':'Nome de usuário já ocupado.','auth/invalid-credential':'Usuário ou senha incorretos.','auth/wrong-password':'Usuário ou senha incorretos.','auth/weak-password':'Senha muito fraca.','auth/operation-not-allowed':'Ative E-mail/senha no Firebase Authentication.','auth/invalid-email':'Login configurado incorretamente.','permission-denied':'As regras de acesso do Firestore precisam ser publicadas.','auth/master-reserved':'Este nome é reservado para a conta do mestre.'}[e.code]||'Não foi possível autenticar. Verifique Firebase e suas permissões.';
  console.error('Falha de autenticação:',e.code||'erro');showToast(msg,true);
 }finally{
  S.authWorking=false;S.adminLoginBusy=false;
  if(button?.isConnected)button.disabled=false;
 }
}
  function clickAction(el){const action=el.dataset.action;if(!action)return;const p=active();if(action==='guide-step'){S.guideStep=bound(el.dataset.step,0,GUIDE_STEPS.length-1);S.view='guia';render();window.scrollTo({top:0,behavior:'smooth'});return}if(action==='guide-open'){if(!active())return nav('clans');S.canvaPage=bound(el.dataset.page||1,1,4);S.canvaMode=el.dataset.advanced==='true'?'advanced':'original';S.tab=el.dataset.tab||'identidade';S.view='sheet';render();window.scrollTo({top:0,behavior:'smooth'});return}if(action==='cv-page'){S.canvaPage=Number(el.dataset.page)||1;render();return}if(action==='cv-mode'){S.canvaMode=S.canvaMode==='advanced'?'original':'advanced';render();return}if(action==='open-sheet')return openSheet(el.dataset.id);if(action==='ask-delete')return askDelete(el.dataset.id);if(action==='confirm-delete')return deleteSheet();if(action==='lock-admin')return lockAdmin();if(action==='apply-remote')return applyRemoteSheet();if(action==='nav')return nav(el.dataset.view);if(action==='tab'){S.tab=el.dataset.tab;render();return}if(action==='clan'){S.activeClan=el.dataset.clan;S.modal='clan';render();return}if(action==='close-modal'){S.modal=null;render();return}if(action==='create-sheet')return createSheetAnimated();if(action==='auth-pane'){S.authPane=el.dataset.pane==='admin'?'admin':'login';render();return}if(action==='auth-switch'){S.authPane=S.authPane==='register'?'login':'register';render();return}if(action==='logout'){S.adminUnlocked=false;stopAdminLive();S.adminSheets=[];if(fb)fb.signOut(fb.auth);else{S.user=null;S.sheet=null;S.sheetId=null;S.sheets=[];S.view='home';render()}return}if(action==='portrait-upload')return uploadPortrait(el.dataset.slot);if(action==='portrait-switch')return switchPortrait(el.dataset.slot);if(action==='portrait-remove')return removePortrait(el.dataset.slot);if(action==='save')return persist();if(action==='print')return window.print();if(action==='export')return exportSheet();if(action==='social')return adjustSocial(el.dataset.key,n(el.dataset.delta));if(action==='attr')return adjustAttr(el.dataset.key,n(el.dataset.delta));if(action==='skill')return adjustSkill(el.dataset.key,n(el.dataset.delta));if(action==='shift')return shiftCombat();if(action==='reset-shift'){if(!canEditCurrent())return;p.combateAjustes={CC:0,CD:0,ESQ:0,LM:0};render();scheduleSave();return}if(action==='add-item')return modifyItem(el.dataset.array);if(action==='remove-item')return modifyItem(el.dataset.array,n(el.dataset.index),true);if(action==='roll-skill'){const k=el.dataset.key;if(!trained(p,k))return showToast('Esta perícia exige treinamento.',true);return roll(2,skillTotal(p,k),k)}if(action==='roll-combat')return roll(2,combat(p,el.dataset.key),'Combate corporal');if(action==='roll-initiative')return roll(1,n(p.atributos.AGI)+skillTotal(p,'Prontidão'),'Iniciativa');if(action==='refresh-admin')return refreshAdmin();if(action==='open-admin'){if(!canAdmin()||!S.adminUnlocked)return showToast('Confirme a senha para acessar as fichas.',true);const x=S.adminSheets.find(a=>a.__id===el.dataset.id);if(x){const {__id,...safeData}=x;S.sheet=normalize(safeData);S.sheetId=__id;S.adminViewing=true;S.canvaMode='original';S.view='sheet';S.tab='identidade';render();}return}}
  document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;if(el.classList.contains('modalshade')&&ev.target!==el)return;clickAction(el)});
  document.addEventListener('submit',ev=>{if(ev.target.id==='auth-form'){ev.preventDefault();submitAuth(ev.target)}else if(ev.target.id==='admin-auth-form'){ev.preventDefault();unlockAdmin(ev.target)}});
  document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='admin-filter'){const q=el.value.toLocaleLowerCase('pt-BR');$('#admin-rows').innerHTML=adminRows(S.adminSheets.filter(x=>[x.nome,x.usuario,clanOf(x.clanId).name].some(z=>String(z||'').toLocaleLowerCase('pt-BR').includes(q))));return}if(el.dataset.cvArray){canvaUpdateArray(el,true);return}if(el.dataset.cvSkill){updateCanvaSkill(el,true);return}if(!el.dataset.bind||el.tagName==='SELECT')return;const current=active(),path=el.dataset.bind,old=getAt(current,path.startsWith('@')?path.slice(1):path);if(!updateValue(path,el.value)){el.value=old??''}else refreshGuideFeedback()});
  document.addEventListener('change',ev=>{const el=ev.target;if(el.matches('[data-portrait-file]')){const file=el.files?.[0];el.value='';void handlePortraitSelected(file,S.portraitUploadSlot);return}if(el.dataset.cvArray){canvaUpdateArray(el);return}if(el.dataset.cvSkill){updateCanvaSkill(el);return}if(!el.dataset.bind||el.tagName!=='SELECT')return;updateValue(el.dataset.bind,el.value)});
  async function startFirebase(){try{const base=`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;const [{initializeApp},{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,reauthenticateWithCredential,EmailAuthProvider},{getFirestore,doc,getDoc,setDoc,deleteDoc,collection,getDocs,query,where,onSnapshot}]=await Promise.all([import(base+'/firebase-app.js'),import(base+'/firebase-auth.js'),import(base+'/firebase-firestore.js')]);const app=initializeApp(FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);fb={auth,db,doc,getDoc,setDoc,deleteDoc,collection,getDocs,query,where,onSnapshot,reauthenticateWithCredential,EmailAuthProvider,signOut,createUserWithEmailAndPassword,signInWithEmailAndPassword};onAuthStateChanged(auth,async(user)=>{clearTimeout(S.saveTimer);if(!user){stopAdminLive();S.adminUnlocked=false;S.adminAuthBusy=false;S.adminLoginBusy=false;S.adminSheets=[];S.user=null;S.isAdmin=false;S.sheet=null;S.sheetId=null;S.sheets=[];S.adminViewing=false;S.loading=false;S.view='login';render();return}const fallback=user.email?.split('@')[0]||'Shinobi';S.user={uid:user.uid,displayName:fallback};try{const [profile,admin,found]=await Promise.all([getDoc(doc(db,'users',user.uid)),getDoc(doc(db,'admins',user.uid)),getDocs(query(collection(db,'fichas'),where('ownerUid','==',user.uid)))]);if(profile.exists())S.user.displayName=profile.data().username||fallback;S.isAdmin=admin.exists()||user.email===MASTER_EMAIL;if(user.email===MASTER_EMAIL)S.adminUnlocked=true;S.sheets=found.docs.map(d=>({id:d.id,data:normalize(d.data())}));const first=ownSheets()[0];S.sheet=first?.data||null;S.sheetId=first?.id||null;S.adminViewing=false;S.loading=false;if(S.adminUnlocked&&S.isAdmin)startAdminLive();S.view=S.adminUnlocked&&S.isAdmin?'admin':S.authPane==='admin'?'login':'home';render()}catch(e){console.error(e);S.loading=false;S.view='home';render();showToast('Conta conectada, mas houve um erro ao carregar os dados. Confira as regras do Firestore.',true)}})}catch(e){console.error(e);S.loading=false;S.view='login';render();showToast('Falha ao inicializar Firebase. Confira as chaves e o domínio autorizado.',true)}}
  if(CONFIGURED)startFirebase();else{S.loading=false;render()}
