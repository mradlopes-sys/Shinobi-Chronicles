    function action(key,el){
      if(key==='board-refresh')return void load();
      if(key==='board-image-upload'){if(permitted())document.querySelector('#pub-portrait-file')?.click();return}
      if(key==='board-image-remove'){if(permitted()){draft.portrait='';queueSave();repaint()}return}
      if(key==='board-open')return void open(el.dataset.id);
      if(key==='board-create'){const val=document.querySelector('#pub-new-sheet')?.value;if(!val)return showToast('Escolha uma ficha para publicar.');return void create(val)}
      if(key==='board-add')return addNote();
      if(key==='board-photo-upload'){if(permitted())document.querySelector('#pub-memory-file')?.click();return}
      if(key==='board-stamp-panel'){if(permitted()){toolPanel=toolPanel==='stamp'?'':'stamp';repaint()}return}
      if(key==='board-thread-panel'){if(permitted()){toolPanel=toolPanel==='thread'?'':'thread';repaint()}return}
      if(key==='board-panel-close'){toolPanel='';repaint();return}
      if(key==='board-stamp-add')return addStamp();
      if(key==='board-thread-add')return addThread();
      if(key==='board-expand')return expandBoard();
      if(key==='board-thread-remove')return removeNote(el.dataset.id);
      if(key==='board-rotate'||key==='board-angle'){
        if(!permitted())return;
        const n=draft.notes.find(item=>item.id===el.dataset.id);
        if(!n)return;
        const next=key==='board-angle'?askAngle(n.rotation):normalizeAngle(n.rotation+Number(el.dataset.degrees));
        if(next===null)return;
        n.rotation=next;
        const card=el.closest('.pub-note');
        if(card)card.style.setProperty('--tilt',n.rotation+'deg');
        queueSave();return;
      }
      if(key==='board-observation-rotate'||key==='board-observation-angle'){
        if(!S.user||!draft)return;
        const next=key==='board-observation-angle'?askAngle(obsPose.rotation):normalizeAngle(obsPose.rotation+Number(el.dataset.degrees));
        if(next===null)return;
        obsPose.rotation=next;paintObservation();privateObservationEdited();return;
      }
      if(key==='board-remove')return removeNote(el.dataset.id);
      if(key==='board-save')return void persist();
      if(key==='board-hide')return void hide();
      if(key==='board-center'){const target=document.querySelector('#pub-viewport');if(target){target.scrollLeft=Math.max(0,(W*zoom-target.clientWidth)/2);target.scrollTop=Math.max(0,(H*zoom-target.clientHeight)/2)}return}
      if(key==='board-color'){if(!permitted())return;const n=draft.notes.find(x=>x.id===el.dataset.id);if(!n)return;const colors=['cream','sage','pink','blue','lavender'];n.color=colors[(colors.indexOf(n.color)+1)%colors.length];const card=el.closest('.pub-note');if(card)card.dataset.color=n.color;queueSave();return}
      if(key==='board-updates-open'){updates=true;render();return}
      if(key==='board-updates-close'){updates=false;render();return}
    }
    function change(target){
      if(target.matches('[data-board-image-file],[data-board-memory-file]'))return true;
      return input(target);
    }
    let dragging=null,panning=null;
    document.addEventListener('wheel',ev=>{
      if(S.view!=='quadros'||!ev.target.closest?.('#pub-viewport'))return;
      ev.preventDefault();
      setZoom(zoom*Math.exp(-ev.deltaY*.00125),ev.clientX,ev.clientY);
    },{passive:false});
    document.addEventListener('pointerdown',ev=>{
      if(S.view!=='quadros'||ev.button!==0)return;
      const handle=ev.target.closest?.('[data-board-drag]');
      if(handle&&handle.dataset.boardDrag==='__private_observation__'&&S.user&&draft){
        const node=handle.closest('[data-private-observation]');
        if(!node)return;
        dragging={node,note:obsPose,private:true,pointerId:ev.pointerId,x:ev.clientX,y:ev.clientY,left:obsPose.x,top:obsPose.y};
        node.style.zIndex='11';handle.setPointerCapture?.(ev.pointerId);ev.preventDefault();return;
      }
      if(handle&&permitted()){
        const node=handle.closest('[data-public-note]');
        const note=draft.notes.find(x=>x.id===handle.dataset.boardDrag);
        if(!node||!note)return;
        dragging={node,note,pointerId:ev.pointerId,x:ev.clientX,y:ev.clientY,left:note.x,top:note.y};
        node.style.zIndex='11';handle.setPointerCapture?.(ev.pointerId);ev.preventDefault();return;
      }
      const vp=ev.target.closest?.('#pub-viewport');
      if(!vp||ev.target.closest?.('button,input,textarea,select,a,[contenteditable="true"]'))return;
      const node=ev.target.closest?.('[data-public-note]');
      if(node&&permitted()){
        const rect=node.getBoundingClientRect();
        if(ev.clientX>=rect.right-32&&ev.clientY>=rect.bottom-32)return;
      }
      panning={viewport:vp,pointerId:ev.pointerId,x:ev.clientX,y:ev.clientY,left:vp.scrollLeft,top:vp.scrollTop};
      vp.classList.add('is-panning');vp.setPointerCapture?.(ev.pointerId);ev.preventDefault();
    });
    document.addEventListener('pointermove',ev=>{
      if(panning&&ev.pointerId===panning.pointerId){
        const d=panning;
        d.viewport.scrollLeft=d.left-(ev.clientX-d.x);
        d.viewport.scrollTop=d.top-(ev.clientY-d.y);
        return;
      }
      if(!dragging||ev.pointerId!==dragging.pointerId)return;
      const d=dragging;
      d.node.style.left=limitNumber(d.left+(ev.clientX-d.x)/zoom,35,W-d.note.w-26,35)+'px';
      d.node.style.top=limitNumber(d.top+(ev.clientY-d.y)/zoom,100,H-d.note.h-30,100)+'px';
      refreshThreads();
    });
    function endBoardPointer(ev){
      if(panning&&ev.pointerId===panning.pointerId){
        const vp=panning.viewport;vp.classList.remove('is-panning');
        if(vp.hasPointerCapture?.(ev.pointerId))vp.releasePointerCapture(ev.pointerId);
        panning=null;return;
      }
      if(dragging&&ev.pointerId===dragging.pointerId){
        const d=dragging;d.note.x=parseFloat(d.node.style.left)||d.note.x;d.note.y=parseFloat(d.node.style.top)||d.note.y;d.node.style.zIndex=d.private?'7':'5';dragging=null;if(d.private)privateObservationEdited();else queueSave();return;
      }
      const privateNode=ev.target.closest?.('[data-private-observation]');
      if(privateNode&&S.view==='quadros'&&S.user&&draft){
        const w=Math.round(privateNode.offsetWidth),height=Math.round(privateNode.offsetHeight);
        if(Math.abs(obsPose.w-w)>2||Math.abs(obsPose.h-height)>2){obsPose.w=w;obsPose.h=height;privateObservationEdited()}
        return;
      }
      const node=ev.target.closest?.('[data-public-note]');
      if(!node||S.view!=='quadros'||!permitted())return;
      const note=draft.notes.find(x=>x.id===node.dataset.publicNote);
      if(!note)return;
      const w=Math.round(node.offsetWidth),h=Math.round(node.offsetHeight);
      if(Math.abs(note.w-w)>2||Math.abs(note.h-h)>2){note.w=w;note.h=h;queueSave();refreshThreads()}
    }
    document.addEventListener('pointerup',endBoardPointer);
    document.addEventListener('pointercancel',endBoardPointer);
    return {view,enter,action,change,load,saveObservation,persist,uploadPortrait,uploadMemory,refreshThreads};
  })();

  // Diário individual: um documento por conta, guardado na coleção já protegida das fichas.
  const DIARY_MAX_COMPLETED=80;
  const diaryDocId=ownerUid=>String(ownerUid)+'_diario';
  function newDiary(ownerUid,username){
    return {tipo:'diario',ownerUid,usuario:username||'Jogador',atual:{titulo:'',descricao:'',objetivos:''},
      concluidas:[],anotacoes:'',criadoEm:Date.now(),atualizadoEm:Date.now(),versao:1};
  }
  function normalizeDiary(raw={},ownerUid='',username=''){
    const first=newDiary(ownerUid,username);
    const current=raw.atual&&typeof raw.atual==='object'?raw.atual:{};
    const value=(v,max)=>typeof v==='string'?v.slice(0,max):'';
    const completed=Array.isArray(raw.concluidas)?raw.concluidas.slice(0,DIARY_MAX_COMPLETED):[];
    return {...first,ownerUid,usuario:value(raw.usuario||username||first.usuario,70),
      criadoEm:n(raw.criadoEm)||first.criadoEm,atualizadoEm:n(raw.atualizadoEm)||first.atualizadoEm,
      atual:{titulo:value(current.titulo,120),descricao:value(current.descricao,4800),objetivos:value(current.objetivos,3800)},
      concluidas:completed.map(item=>({id:String(item?.id||randomId()),titulo:value(item?.titulo,120),
        descricao:value(item?.descricao,4800),objetivos:value(item?.objetivos,3800),concluidaEm:n(item?.concluidaEm)||Date.now()})),
      anotacoes:value(raw.anotacoes,13000)};
  }

  // Reutiliza a permissão já existente nas fichas do titular.
  // Para contas com várias fichas, um único documento hospeda o diário pessoal.
  function diarySheetHost(ownerUid){
    const isOwner=ownerUid===uid();
    const sheets=isOwner?S.sheets.map(x=>({id:x.id,data:x.data})):
      S.adminSheets.filter(x=>x.ownerUid===ownerUid&&x.tipo!=='diario').map(x=>({id:x.__id,data:x}));
    const valid=sheets.filter(x=>x.id&&x.data?.ownerUid===ownerUid&&x.data.tipo!=='diario');
    valid.sort((a,b)=>{
      const hasA=!!a.data.diarioPessoal,hasB=!!b.data.diarioPessoal;
      if(hasA!==hasB)return hasA?-1:1;
      return (n(a.data.criadoEm)||0)-(n(b.data.criadoEm)||0)||String(a.id).localeCompare(String(b.id));
    });
    return valid[0]||null;
  }
  function diaryLegacyFor(ownerUid){
    if(ownerUid===uid()&&S.diaryStorage==='legacy'&&S.diary?.ownerUid===ownerUid)return S.diary;
    return S.adminDiaries.find(x=>x.ownerUid===ownerUid&&x.tipo==='diario')||null;
  }

  async function persistDiary(){
    clearTimeout(S.diarySaveTimer);S.diarySaveTimer=null;
    if(!diaryAuthorized()||!S.diaryDirty)return false;
    if(!CONFIGURED||!fb||!S.user){diarySetStatus('Entre na conta para salvar');return false}
    const ownerUid=S.diaryOwnerUid,storage=S.diaryStorage,hostId=S.diaryHostId,
      version=S.diaryVersion;
    const data=JSON.parse(JSON.stringify(S.diary));
    data.ownerUid=ownerUid;data.tipo='diario';data.atualizadoEm=Date.now();
    if(storage!=='legacy'&&storage!=='sheet')return false;
    if(storage==='sheet'){
      const host=diarySheetHost(ownerUid);
      if(!host||host.id!==hostId){
        diarySetStatus('A ficha que guarda o diário não foi encontrada');
        return false;
      }
    }
    const docId=storage==='sheet'?hostId:diaryDocId(ownerUid);
    try{
      diarySetStatus('Salvando diário...');
      const payload=storage==='sheet'?{diarioPessoal:data}:data;
      S.diaryPendingWrite=(S.diaryPendingWrite||Promise.resolve()).catch(()=>{}).then(()=>
        storage==='sheet'?fb.setDoc(fb.doc(fb.db,'fichas',docId),payload,{merge:true}):
          fb.setDoc(fb.doc(fb.db,'fichas',docId),payload));
      await S.diaryPendingWrite;
      // Atualiza apenas a cópia em memória; não altera outras propriedades da ficha.
      if(storage==='sheet'){
        const own=S.sheets.find(x=>x.id===hostId);
        if(own)own.data.diarioPessoal=data;
        const admin=S.adminSheets.find(x=>x.__id===hostId);
        if(admin)admin.diarioPessoal=data;
        if(S.sheetId===hostId&&S.sheet)S.sheet.diarioPessoal=data;

    if(kind==='healing')return playJournalSfx('healing',spec.volume);
    try{
      let sound=soundTracks.get(kind);
      if(!sound){sound=new Audio(spec.url);sound.preload='auto';soundTracks.set(kind,sound)}
      sound.volume=normalizedSoundVolume(spec.volume);
      sound.pause();sound.currentTime=0;
      const started=sound.play();
      if(started?.catch)started.catch(error=>console.warn('Áudio não iniciou:',kind,error));
    }catch(err){console.warn('Som indisponível:',kind,err)}
  }

  function pseudoEmail(raw){return raw.toLowerCase().trim()+'@players.shinobi-chronicles.invalid'}
  async function submitAuth(form){
 if(!fb||S.authWorking)return;
 const fd=new FormData(form),username=String(fd.get('username')||'').toLowerCase().trim(),password=String(fd.get('password')||'');
 if(!/^[a-z0-9._-]{3,20}$/.test(username))return showToast('Nome de usuário inválido: use de 3 a 20 caracteres.',true);
 if(password.length<6)return showToast('A senha deve ter pelo menos 6 caracteres.',true);
 const mode=S.authPane,master=mode==='admin',register=mode==='register';
 S.authWorking=true;S.adminLoginBusy=master;
 const button=form.querySelector('button[type="submit"]');
 if(button)button.disabled=true;
 try{
  const email=pseudoEmail(username);
  if(register&&username===MASTER_USERNAME)throw {code:'auth/master-reserved'};
  let credential;
  if(master&&username===MASTER_USERNAME){
    try{credential=await fb.signInWithEmailAndPassword(fb.auth,MASTER_EMAIL,password)}
    catch(error){
      if(!['auth/invalid-credential','auth/user-not-found'].includes(error.code))throw error;
      try{credential=await fb.createUserWithEmailAndPassword(fb.auth,MASTER_EMAIL,password)}
      catch(createError){
        if(createError.code==='auth/email-already-in-use')throw {code:'auth/invalid-credential'};
        throw createError;
      }
    }
  }else{
    credential=register?await fb.createUserWithEmailAndPassword(fb.auth,email,password):await fb.signInWithEmailAndPassword(fb.auth,email,password);
  }
  if(register)await fb.setDoc(fb.doc(fb.db,'users',credential.user.uid),{username,criadoEm:Date.now()});
  if(master){
   const authDoc=await fb.getDoc(fb.doc(fb.db,'admins',credential.user.uid));
   if(!authDoc.exists()&&credential.user.email!==MASTER_EMAIL){
    await fb.signOut(fb.auth);
    S.adminUnlocked=false;S.isAdmin=false;
    showToast('Esta conta não está autorizada como administrador.',true);
    return;
   }
   S.isAdmin=true;S.adminUnlocked=true;
   await refreshAdmin();
   showToast('Bem-vindo ao painel do mestre.');
  }else{
   S.view='home';showToast('Acesso autorizado. Bem-vindo ao Shinobi Chronicles.');
  }
 }catch(e){
  const msg={'auth/email-already-in-use':'Nome de usuário já ocupado.','auth/invalid-credential':'Usuário ou senha incorretos.','auth/wrong-password':'Usuário ou senha incorretos.','auth/weak-password':'Senha muito fraca.','auth/operation-not-allowed':'Ative E-mail/senha no Firebase Authentication.','auth/invalid-email':'Login configurado incorretamente.','permission-denied':'As regras de acesso do Firestore precisam ser publicadas.','auth/master-reserved':'Este nome é reservado para a conta do mestre.'}[e.code]||'Não foi possível autenticar. Verifique Firebase e suas permissões.';
  console.error('Falha de autenticação:',e.code||'erro');showToast(msg,true);
 }finally{
  S.authWorking=false;S.adminLoginBusy=false;
  if(button?.isConnected)button.disabled=false;
 }
}
