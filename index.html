  /* Resumo sistemático elaborado a partir do livro básico SNS 4.1b.
     Mantido separado da ficha: registros já salvos nunca são sobrescritos. */
  const SYSTEM_RULES={"ninpou":["Uma arte não elemental configurada por efeitos escolhidos a cada nível.","Um efeito novo por nível de poder, escolhido em ordem. Normalmente usa-se somente um efeito por ação; o nível usado pode ser inferior ao comprado.","Dano e dureza = nível usado + metade de Espírito (arredondada para cima). Dificuldade = 9 + nível usado + metade de Espírito. Alcance = 10 m + 2 m por Espírito.","Chakra igual ao nível usado do efeito, salvo exceção."],"doton":["Controle de terra e pedra, com construções e barreiras mais resistentes.","Permite todos os efeitos gerais de Ninpou e efeitos próprios, como Imergir.","Alcance curto = 5 m + 1 m por Espírito; criações com +2 de dureza.","Chakra igual ao nível usado, salvo exceções."],"fuuton":["Manipulação do vento para pressão, cortes e dano elevado.","Usa somente efeitos permitidos para Fuuton; não cria todos os tipos de prisão sólida.","Alcance = 10 m + 2 m por Espírito; +2 de dano base nos efeitos.","Chakra igual ao nível usado, salvo exceções."],"katon":["Manipulação de fogo para projéteis e ataques de área.","Os jutsus de fogo podem ser montados pelos efeitos adquiridos; técnicas como Goukakyuu são modelos de execução.","Consulte área, alcance e dano do efeito utilizado, acrescidos dos parâmetros do Katon.","Chakra igual ao nível usado, salvo exceções."],"raiton":["Manipulação de eletricidade para ataques de longo alcance e contato.","Usa os efeitos permitidos do elemento, com opções de descarga e técnicas elétricas específicas.","Alcance longo = 15 m + 3 m por Espírito; tamanho = 0,5 m por Espírito; +1 de dano base.","Chakra igual ao nível usado, salvo exceções."],"suiton":["Manipulação de água para ataque, contenção e defesa.","Pode acessar todos os efeitos genéricos de Ninpou e técnicas próprias de água.","Alcance = 10 m + 2 m por Espírito; tamanho = 1 m por Espírito.","Chakra igual ao nível usado, salvo exceções."],"fuuinjutsu":["Poder de técnicas prontas que evolui selos e armazenamento.","No primeiro nível, armazena objetos e jutsus em pergaminhos; outras técnicas são liberadas nos níveis seguintes.","Armazenamento exige suporte físico, limitações de compartimentos e pagamento ao selar e liberar.","Para objetos, 1 chakra por compartimento; jutsus têm custos específicos."],"iryou":["Poder de cura concentrada por chakra, toque e Medicina.","O paciente e o usuário ficam imóveis enquanto o tratamento é realizado.","Cura por turno = nível usado + metade de Medicina arredondada para cima. Perito e Perícia Inata em Medicina dão +1 cada. Autocura é reduzida até Iryou 3.","Custo igual ao nível usado.","Padrão","Toque","Concentração"],"rasengan":["Esfera giratória de chakra que ataca por toque.","Rasengan básico exige ação completa; formas superiores reduzem o preparo e aumentam o dano.","Ataque por CC. Básico: dano = 2 + nível usado + metade de Espírito. Completo: dano = nível usado + Espírito. Empurra o alvo e pode derrubá-lo.","Chakra igual ao nível usado.","Completa na forma básica","Toque","Instantânea"],"kikai":["Arte Aburame que usa grupos de insetos para ataque, suporte e drenagem.","Exige Kikaichuu. Os insetos usados por um jutsu ficam ocupados enquanto a técnica estiver em vigor.","Controle e quantidade dependem de Lidar com Animais. Ataques comuns drenam chakra; efeitos de Kikai Ninpou seguem seus níveis.","Custo depende da técnica de insetos."],"baika":["Arte Akimichi de expansão corporal e ataques por massa.","Permite aumentar partes do corpo ou a categoria de tamanho conforme o nível; libera Nikudan Sensha.","Expansão básica custa 1 chakra. Formas Grande, Enorme e Imensa custam 3, 4 e 5, respectivamente.","Chakra varia conforme a forma."],"juuken":["Estilo Hyūga de golpes desarmados letais contra órgãos internos.","Exige Byakugan ativo e Acuidade. A postura é ativada com ação livre.","Dano = metade de Destreza + dano de arma, que cresce até 4 no nível 6. Ignora até 2 pontos da dureza corporal passiva.","0 para ativar a postura.","Livre","Pessoal; ataques corpo a corpo","Contínua"],"shikakyu":["Estilo de combate quadrúpede Inuzuka com garras e mordidas.","Usa Hakken; em níveis superiores libera transformações e golpes coordenados com o parceiro.","Dano natural = metade de Força + dano de arma (1 inicialmente, até 4 no nível 6); +2 iniciativa e +1 Intimidação.","1 chakra para a postura.","Parcial","Pessoal","Contínua"],"kage":["Poder Nara para imobilizar, conduzir e atacar com sombras.","Kage Shibari aparece no nível 1; Kage Mane no 3; técnicas de projéteis e constrição são liberadas depois.","Alcance = 5 m + 2 m por nível de Kagejutsu; resistência comum para se libertar = 9 + nível usado + metade de Inteligência.","Em geral, 1 chakra por nível usado."],"mokuton":["Kekkei Genkai Senju que cria madeira e vegetação para ofensiva e defesa.","Segue os efeitos compatíveis de Ninpou, com habilidades próprias e técnicas que exigem efeitos anteriores.","Alcance = 10 m + 2 m por Espírito; +1 dano base e +1 na dificuldade de resistência.","Custo do efeito escolhido, salvo exceções."],"shindenshin":["Técnicas Yamanaka de transferência de consciência e comunicação telepática.","A troca de mente pode deixar o corpo original vulnerável; níveis posteriores permitem comunicação ou controle remoto.","Teste de resistência usual: Inteligência contra 9 + nível do poder + metade da Inteligência do usuário.","Custo conforme cada técnica."],"sharingan":["Doujutsu Uchiha de visão de chakra e leitura avançada do movimento.","Ativação parcial para uma cena. Não atravessa todas as coberturas nem substitui o Byakugan.","Requer Percepção 3. Melhora percepção e análise de técnicas conforme evolução descrita no clã.","1 chakra na ativação.","Parcial","Pessoal","Contínua por uma cena"],"elemento-katon":["Aptidão Uchiha que concede acesso especial a Katon.","Pode permitir o uso específico de Sopro Destrutivo 4 conforme as condições da aptidão, sem compra convencional do poder.","É uma exceção ao método padrão de aquisição de afinidade/efeitos; conferir a regra própria do clã.","Custo do efeito usado."],"byakugan":["Doujutsu Hyūga de visão de 360° e leitura de chakra.","Enxerga estruturas e rede de chakra. Enquanto ativo impede surpresa e flanqueamento; amplia o alcance visual.","Requer Percepção 1. Alcance da visão = 10 m + 2 m por nível de Rastrear, com progressões próprias.","1 chakra na ativação.","Parcial","Pessoal","Contínua por uma cena"],"kikaichuu":["Aptidão Aburame para manter e comandar insetos parasitas.","Um kikaichuu é grupo de 100 insetos. Lidar com Animais define grupos disponíveis e seu controle.","Ataque comum por CD pode usar até metade dos grupos e drena chakra igual aos grupos usados, sem dano direto.","Ataque comum sem custo de chakra.","Padrão para atacar","Conforme insetos e cena"],"corpulencia":["Aptidão Akimichi que amplia Vitalidade e permite converter energia física.","Aumenta a capacidade física, mas não concede automaticamente imunidade a condições adversas.","+3 × Vigor de Vitalidade; +2 nos testes de Vigor. Pode trocar 2 de Vitalidade por 1 de chakra ao executar técnica.","Custo especial em Vitalidade, se optar pela conversão."],"hakken":["Aptidão Inuzuka de rastreamento pelo olfato.","Melhora buscas por cheiro e perseguições quando o olfato pode ser utilizado.","Reduz em 1 nível a dificuldade de Prontidão, Procurar e Rastrear aplicáveis.","Conforme ativação e regra da aptidão."],"companheiro":["Aptidão Inuzuka que concede um cão ou lobo ninja.","O animal atua como parceiro e recebe comandos; possui ficha derivada do personagem.","Requer Lidar com Animais 1. Características e tamanho evoluem de acordo com a perícia e as regras de parceiro.","Sem custo padrão de chakra."],"chakra-expandido":["Aptidão Uzumaki para ampliar a reserva de chakra.","Eleva a capacidade total de chakra, sem modificar o custo de qualquer jutsu.","Aumenta a reserva máxima em 50%.","Sem custo de ativação."],"ninja-medico":["Aptidão geral necessária para técnicas médicas avançadas.","Habilita cirurgias, remédios e curas; não deixa o usuário desprevenido ao tratar aliado em combate.","Requer Medicina 7. Sem a aptidão, Medicina fica limitada sobretudo aos primeiros socorros.","Sem custo de ativação."],"acuidade":["Aptidão que utiliza Destreza para precisão corporal em ataques apropriados.","Aplica-se a golpes desarmados, armas leves, técnicas de toque e bloqueios permitidos.","CC = valor base + Destreza; exige Destreza 3. Não muda o dano do ataque.","Sem custo de ativação."],"reflexos":["Aptidão de combate para esquivar-se melhor.","Concede vantagem na defesa, mas respeita restrições de movimento e outros estados prejudiciais.","Bônus de +1 na Esquiva conforme a regra da aptidão.","Sem custo de ativação."],"canhao":["Efeito nível 1 de disparo direto contra um alvo.","Ação padrão, alcance comum do poder e duração instantânea.","Causa 2 de dano base por nível usado. Do nível 2 em diante, pode gastar 0 chakra e causar metade do dano, sem acumular outros benefícios.","Chakra igual ao nível usado, ou 0 na variante reduzida.","Padrão","Comum do poder","Instantânea"],"orbe":["Efeito nível 2 de projétil esférico.","Cria orbe de meio metro e o dispara contra uma criatura.","Dano base comum do poder; no nível 7 pode custar metade do chakra, com restrição a benefícios adicionais.","Chakra igual ao nível usado.","Padrão","Comum do poder","Instantânea"],"barreira":["Efeito nível 3 de defesa por parede ou redoma.","Cria uma proteção para interceptar ataques antes de alcançarem o usuário.","Dureza padrão do poder. Para defender, teste de Ler Movimento com +2; nível 6 permite redoma e nível 9 concede +2 dureza.","Chakra igual ao nível usado.","Movimento","Comum do poder","Permanente em sólidos; sustentada nos demais"],"flechas":["Efeito nível 3 de vários disparos.","Lança um projétil por nível usado contra um ou vários alvos.","Cada projétil tem dano base 2; cada alvo faz uma defesa. Pode fintar por Prestidigitação pagando 2 chakra, sem causar dano.","Chakra do nível usado; 2 para fintar.","Padrão","Comum do poder","Instantânea"],"sopro":["Efeito nível 4 de ataque em área.","Atinge vários alvos na região formada pelo elemento, conforme parâmetros do efeito.","Área, dano e defesas dependem do nível e do elemento usado; áreas não admitem Bloqueio comum.","Chakra igual ao nível usado.","Padrão","Conforme área e elemento","Instantânea"],"bunshin":["Jutsu básico: um ou dois clones ilusórios.","Clones não causam dano, não conjuram e desaparecem ao toque. Para fintar, use ação padrão.","Finta: Prestidigitação contra Prontidão; sucesso deixa vítima fintada contra próximo ataque corporal ou projétil.","1 normal, 4 para finta.","Movimento; padrão na finta","Pessoal","Sustentada"],"henge":["Jutsu básico de transformação de aparência.","Transforma-se em pessoa, animal ou objeto de categoria de tamanho equivalente.","Percepção de quem interagir contra 7 + nível em Disfarces revela falhas na transformação.","1 chakra.","Movimento","Pessoal","Sustentada"],"kawarimi":["Jutsu básico de substituição defensiva.","Uma vez por cena, pode evitar totalmente um ataque individual e se deslocar com substituto.","Sem rolagem de ataque ou defesa. Não funciona contra ataques em área, nem se estiver impedido, fintado ou desprevenido.","1 chakra.","Ação defensiva especial","Pessoal","Instantânea"],"kai":["Jutsu básico para desfazer genjutsu.","Para libertar outra pessoa, alcance de toque; pode libertar-se após identificar a ilusão.","Teste de Espírito ou Inteligência contra a dificuldade do genjutsu. Em si mesmo, após notar genjutsu, não requer teste ou chakra.","Custo da ilusão dissipada; 0 para si após notar.","Padrão","Toque","Instantânea"],"kinobori":["Jutsu básico para aderir a paredes e árvores.","Concentra chakra nos pés para andar em superfícies verticais ou no teto.","Sem teste normal; desequilíbrio pode exigir Atletismo ou Acrobacia.","1 chakra.","Livre","Pessoal","Contínua por uma cena"],"shunshin":["Jutsu básico de deslocamento veloz, não teletransporte.","Move-se até o deslocamento normal com velocidade cinematográfica.","Não concede bônus em combate nem distância adicional de movimento.","1 chakra.","Movimento","Pessoal","Instantânea"],"juuken-jutsu":["Postura Juuken de ataque interno com chakra.","Exige Byakugan ativo e golpes desarmados com as mãos.","Dano = Destreza/2 + dano de arma do nível de Juuken; ignora até 2 da dureza corporal passiva.","0 chakra.","Livre","Pessoal","Contínua"],"kaiten":["Rotação Hyūga que protege e pode atingir criaturas próximas.","Em ataque cobre 2 m, ampliáveis a 5 m no nível 6; defensivamente é barreira de chakra.","Dureza na defesa = 3 + 2 × nível usado de Juuken; teste defensivo usa CC desarmado em vez de LM.","2 ao atacar; 1 por nível usado ao defender.","Padrão ou parcial na defesa sem dano","Pessoal","Instantânea"],"hakke32":["Sequência Hyūga de 32 golpes.","Realize três ataques Juuken com Ataque Múltiplo e +3 de dano antes da divisão.","Cada acerto retira 3 chakra. Se os três retirarem chakra, teste de Vigor contra 7 + 2 × nível de Juuken para evitar atordoamento.","4 chakra.","Padrão","Toque","Instantânea"],"hakke64":["Sequência Hyūga de 64 golpes.","Realize três ataques Juuken com +4 de dano antes da divisão.","Cada acerto retira 4 chakra; três retiradas exigem Vigor contra 7 + 2 × nível para evitar atordoamento e fadiga.","6 chakra.","Padrão","Toque","Instantânea"],"shikakyu-jutsu":["Forma quadrúpede Inuzuka.","Ative a forma para ganhar garras, mordida e bônus físicos.","Dano = metade de Força + dano de arma do nível; +2 iniciativa e +1 Intimidação.","1 chakra.","Parcial","Pessoal","Contínua"],"juujin":["Transforma o companheiro animal em cópia do Inuzuka.","A réplica atua como parceiro, mantendo sua própria Vitalidade e Chakra.","Termina se o companheiro ficar inconsciente ou perder mais de metade da Vitalidade.","2 chakra por animal.","Movimento","Toque","Contínua"],"tsuuga":["Investida giratória Inuzuka com dano corporal.","Exige Shikakyu ativo e distância mínima de 3 m antes do ataque.","Atropelamento usando dano das garras. Vigor do alvo contra 2 + CC para evitar queda.","1 chakra.","Completa","Corpo a corpo","Instantânea"],"kage-shibari":["Prisão de sombras Nara.","Ataque de CD conecta sombras e paralisa; usuário permanece imóvel e concentrado.","Escapar: Força contra 9 + nível usado + metade de Inteligência. Alcance 5 m + 2 m por nível. Uso visível tem -3 CD.","1 chakra por nível usado.","Padrão","Curto: 5 m + 2 m por nível","Concentração limitada por turnos"],"kage-mane":["Imitação dos movimentos pela sombra.","Segue Kage Shibari, mas permite movimentar-se e fazer o alvo repetir gestos.","Escapar: Força contra dificuldade do Kagejutsu. A conexão quebra acima do alcance.","1 chakra por nível usado.","Padrão","Curto: 5 m + 2 m por nível","Concentração; evolução pode sustentar"],"kage-shuriken":["Prende sombra por meio de arma arremessada.","Prepare com ação parcial e depois arremesse arma condutora de chakra sobre a sombra do alvo.","Se atingir, paralisa pelas regras do Kage Shibari por até dois turnos.","1 chakra por nível usado.","Parcial para preparar; padrão para arremessar","Curto","Concentração, máximo 2 turnos"],"kage-kubi":["Estrangulamento usando sombra de vítima já presa.","Transforme Kage Mane ou Kage Shibari ativo em técnica de sufocamento.","Dano fixo ao fim do turno = nível usado + metade de Inteligência. A vítima pode tentar Força para escapar.","1 chakra por nível usado.","Movimento","Alvo previamente preso","Mesma duração da prisão"],"kage-nui":["Costura ofensiva com agulhas de sombra.","Arremessa filamentos perfurantes e pode usar ação completa para costurar o alvo.","Uma agulha causa 1 dano base; com grau de dano suficiente pode deixar impedido ou paralisado.","1 chakra por nível usado.","Padrão; completa para costurar","Curto","Instantânea; controle pode persistir"],"shintenshin":["Troca de consciência Yamanaka.","Assuma o corpo de alvo imóvel, indefeso ou surpreendido; corpo original fica vulnerável.","Vítima pode resistir por Inteligência e escapar do controle; ações contrárias à sua natureza permitem novas resistências.","Nível usado do poder.","Padrão","5 m + 1 m por Inteligência","Até 1 dia por nível, sujeita a resistência"],"shindenshin-jutsu":["Telepatia Yamanaka.","Transmite fala e memórias para pessoas conhecidas ou à vista dentro do alcance.","Até um alvo por nível do poder; alvo que se opõe resiste com Inteligência.","Nível usado do poder.","Padrão","10 m + 2 m por Inteligência","Concentração, até uma cena"],"shinten-bunshin":["Divide mente entre dois corpos.","Controla dois animais, cadáveres ou corpos inanimados, não duas pessoas humanas conscientes.","Corpos atuam como parceiros; danos podem refletir no usuário.","4 chakra.","Padrão","10 m","10 min por nível"],"shinranshin":["Controle motor de uma vítima sem deixar o próprio corpo.","Requer concentração; a vítima mantém consciência, mas suas ações básicas podem ser comandadas.","Vítima resiste por Inteligência. No nível 8 pode alcançar três alvos, com ajuste de dano.","Nível usado do poder.","Padrão","10 m + 2 m por Inteligência","Concentração"],"baika-jutsu":["Expansão corporal Akimichi.","Formas: inicial arredondada; Grande no nível 4, Enorme no 5 e Imensa no 6.","Mudanças de categoria aplicam regras de tamanho. Armas crescem a partir do nível 4, sem bônus de dano automático.","1, 3, 4 ou 5 de chakra conforme forma.","Movimento; parcial para Nikudan","Pessoal","Contínua"],"nikudan":["Tanque humano Akimichi.","Após Baika, faça atropelamento com investida usando o corpo como esfera.","Dano do ataque corporal. Vigor do alvo contra dificuldade 2 + CC para não cair.","1 chakra além da ativação de Baika.","Completa","Corpo a corpo","Instantânea"],"mokujoheki":["Parede de madeira Senju.","Requer Mokuton 3 e efeito Barreira. Cria proteção entre usuário e ameaça.","Defesa com Ler Movimento; dureza e dano excedente seguem a barreira de Mokuton.","Conforme nível do efeito Barreira.","Movimento","Pessoal","Criação instantânea; proteção sólida permanece"],"goukakyuu":["Bola de fogo ampla que usa Sopro Destrutivo.","É um modelo de jutsu Katon, não poder independente: exige acesso ao efeito correspondente.","Dano e área seguem Sopro Destrutivo no nível utilizado, com regras de Katon.","Conforme nível do efeito.","Padrão","Médio, conforme Katon","Instantânea"],"hiakahou":["Disparo concentrado de fogo baseado em Canhão.","É modelo visual para o efeito Canhão já comprado em Katon.","Dano = 2 por nível usado, com ajustes elementais aplicáveis.","Conforme nível do efeito.","Padrão","Médio, conforme Katon","Instantânea"],"shoukakyuu":["Projétil pequeno de fogo baseado em Orbe.","Exige efeito Orbe do Katon; não é compra separada.","Dano padrão do Orbe, modificado pelo elemento e nível usado.","Conforme nível do efeito.","Padrão","Médio, conforme Katon","Instantânea"],"housenka":["Vários projéteis de fogo usando Flechas.","Exige efeito Flechas do Katon; pode repartir projéteis entre alvos.","Um projétil por nível usado, 2 dano base por projétil e uma defesa por alvo.","Conforme nível do efeito.","Padrão","Médio, conforme Katon","Instantânea"]};
  function systemRules(item){return SYSTEM_RULES[item?.id]||null}
  function systemSummary(item){return systemRules(item)?.[0]||item.desc||''}
  function systemRulesHTML(item,compact=false){
    const m=systemRules(item);if(!m)return '';
    const req=[];
    if(item.clan&&item.clan!=='comum')req.push('Clã '+clanOf(item.clan).name);
    for(const [attr,v] of Object.entries(item.attr||{}))req.push(attr+' '+v);
    for(const [skill,v] of Object.entries(item.skill||{}))req.push(skill+' '+v);
    for(const apt of item.apt||[])req.push('Aptidão '+apt);
    if(item.power)req.push('Poder '+(catalogItem(item.power)?.name||item.power));
    if(item.min)req.push((item.kind==='jutsu'?'Poder':'Nível')+' '+item.min);
    const lines=[
      ['Requisitos',req.join(' · ')],
      ['Ação',m[4]||item.action||''],
      ['Alcance',m[5]||item.range||''],
      ['Duração',m[6]||''],
      ['Chakra / custo',m[3]||item.cost||''],
      ['Execução',m[1]||''],
      ['Testes e efeitos',m[2]||'']
    ].filter(([k,v])=>String(v).trim());
    return '<details class="system-rules'+(compact?' compact':'')+'"><summary>▤ Ver funcionamento sistemático</summary><div class="system-rules-content">'+lines.map(([label,value])=>'<div class="system-rules-row"><b>'+E(label)+'</b><span>'+E(value)+'</span></div>').join('')+'</div><p class="system-rules-source">SNS 4.1b · página '+E(item.page||'—')+'. Consulte o texto do livro e o mestre para evoluções, exceções e efeitos não catalogados.</p></details>';
  }

  function catalogItem(id){return LIBRARY_ENTRIES.find(x=>x.id===id)}
  function catalogPower(p,id){
    const item=catalogItem(id);if(!item)return null;
    return (p.poderes||[]).find(x=>x.catalogId===id||catalogKey(x.nome)===catalogKey(item.name))||null;
  }
  function catalogApt(p,name){return (p.aptidoes||[]).some(x=>catalogKey(x.nome)===catalogKey(name))}
  function catalogTech(p,item){return (p.jutsus||[]).find(x=>x.catalogId===item.id||catalogKey(x.nome)===catalogKey(item.name))}
  function catalogHasEffect(p,powerId,name){
    const power=catalogPower(p,powerId);
    return !!power&&(power.efeitos||[]).some(x=>catalogKey(x.nome||x)===catalogKey(name));
  }
  function catalogRequirements(p,item){
    if(item.clan&&item.clan!=='comum'&&item.clan!==p.clanId)
      return 'Restrito ao clã '+clanOf(item.clan).name+'.';
    for(const [attr,min] of Object.entries(item.attr||{}))
      if(n(p.atributos?.[attr])<min)return 'Requer '+attr+' '+min+'.';
    for(const [skill,min] of Object.entries(item.skill||{}))
      if(n(p.pericias?.[skill])<1||skillTotal(p,skill)<min)return 'Requer '+skill+' '+min+' (treinada).';
    for(const apt of item.apt||[])
      if(!catalogApt(p,apt))return 'Requer a aptidão '+apt+'.';
    return '';
  }
  function catalogGate(p,item){
    if(!p||!item)return {ok:false,reason:'Abra uma ficha primeiro.',text:'Indisponível'};
    const reason=catalogRequirements(p,item);
    if(reason)return {ok:false,reason,text:'Bloqueado'};
    const spent=totals(p).powers,budget=currentNC().powers;
    if(item.kind==='power'){
      const elemental=['doton','fuuton','katon','raiton','suiton'];
      if(elemental.includes(item.id)&&!catalogPower(p,item.id)&&n(p.atributos?.ESP)<10&&elemental.some(id=>id!==item.id&&catalogPower(p,id)))
        return {ok:false,reason:'Uma segunda afinidade básica exige Espírito 10, salvo exceções do manual.',text:'Afinidade bloqueada'};
      const owned=catalogPower(p,item.id),level=n(owned?.nivel);
      if(level>=limit())return {ok:false,reason:'Limite no NC atual: '+limit()+'.',text:'Nível máximo'};
      if(spent+1>budget)return {ok:false,reason:'Falta 1 ponto de poder.',text:'Pontos insuficientes'};
      if(!owned&&p.poderes.length>=MAX_ITEMS)return {ok:false,reason:'Limite de poderes atingido.',text:'Lista cheia'};
      return {ok:true,text:level?'Evoluir para nível '+(level+1):'Comprar nível 1'};
    }
    if(item.kind==='aptitude'){
      if(catalogApt(p,item.name))return {ok:false,reason:'Aptidão já registrada.',text:'Já aprendida'};
      if(p.aptidoes.length>=MAX_ITEMS)return {ok:false,reason:'Limite de aptidões atingido.',text:'Lista cheia'};
      const qty=p.aptidoes.filter(x=>x?.nome?.trim()).length;
      if(qty>=3&&spent+2>budget)return {ok:false,reason:'Aptidão extra custa 2 pontos de poder.',text:'Pontos insuficientes'};
      return {ok:true,text:qty<3?'Adicionar gratuitamente':'Comprar por 2 pontos'};
    }
    if(item.kind==='effect'){
      const selected=S.libraryPowerId||'ninpou',power=catalogPower(p,selected),def=catalogItem(selected);
      if(!def?.effectPower)return {ok:false,reason:'Selecione um poder de efeitos.',text:'Escolha o poder'};
      if(['katon','raiton'].includes(selected)&&item.id==='barreira')return {ok:false,reason:'Barreira não está na lista de efeitos permitidos deste elemento (manual pp. 108-109).',text:'Efeito incompatível'};
      if(!power||n(power.nivel)<1)return {ok:false,reason:'Compre o poder '+def.name+' antes.',text:'Sem poder'};
      const chosen=(power.efeitos||[]).length;
      if(chosen>=n(power.nivel))return {ok:false,reason:'Todos os níveis já têm um efeito escolhido.',text:'Sem espaço'};
      if(item.min>chosen+1)return {ok:false,reason:'Escolha primeiro o efeito do nível '+(chosen+1)+'.',text:'Nível insuficiente'};
      if(catalogHasEffect(p,selected,item.name))return {ok:false,reason:'Efeito já selecionado. Evoluções seguem regras específicas.',text:'Já escolhido'};
      return {ok:true,text:'Escolher para nível '+(chosen+1)};
    }
    if(item.kind==='jutsu'){
      if(catalogTech(p,item))return {ok:false,reason:'Já está na ficha.',text:'Já registrado'};
      if(p.jutsus.length>=MAX_ITEMS)return {ok:false,reason:'Limite de técnicas atingido.',text:'Lista cheia'};
      if(!item.free){
        const special=item.id==='goukakyuu'&&p.clanId==='uchiha'&&catalogApt(p,'Elemento Natural: Katon');
        const power=catalogPower(p,item.power);
        if(!special&&(!power||n(power.nivel)<n(item.min)))
          return {ok:false,reason:'Requer '+(catalogItem(item.power)?.name||item.power)+' nível '+item.min+'.',text:'Poder insuficiente'};
        if(item.effectNeed&&!special&&!catalogHasEffect(p,item.power,item.effectNeed))
          return {ok:false,reason:'Selecione o efeito '+item.effectNeed+' neste poder.',text:'Falta efeito'};
        if(item.id==='shikakyu-jutsu'&&!catalogApt(p,'Hakken no Jutsu'))
          return {ok:false,reason:'Requer Hakken no Jutsu.',text:'Falta aptidão'};
        if(item.id==='juujin'&&!catalogApt(p,'Companheiro Animal'))
          return {ok:false,reason:'Requer Companheiro Animal.',text:'Falta aptidão'};
        const parent=catalogItem(item.power);
        if(parent){const pr=catalogRequirements(p,parent);if(pr)return {ok:false,reason:pr,text:'Pré-requisito'};}
      }
      return {ok:true,text:item.free?'Registrar (gratuito)':'Adicionar à ficha · gratuito'};
    }
    return {ok:false,reason:'Tipo desconhecido.',text:'Indisponível'};
  }

  function syncCatalogEffectDescription(power){
    const base=String(power.descricao||'').replace(/\s*【Efeitos da biblioteca:[^】]*】/g,'').trim();
    const names=(power.efeitos||[]).map(x=>x.nome||x).filter(Boolean);
    power.descricao=base+(names.length?(base?'\n':'')+'【Efeitos da biblioteca: '+names.join(', ')+'】':'');
  }
  function forgetCatalogEffect(powerIndex,effectIndex){
    if(!canEditCurrent())return showToast('Esta ficha não está disponível para edição.',true);
    const power=active()?.poderes?.[powerIndex];
    if(!power||!Array.isArray(power.efeitos))return;
    if(effectIndex!==power.efeitos.length-1)return showToast('Remova os efeitos do mais recente para o mais antigo.',true);
    power.efeitos.splice(effectIndex,1);
    syncCatalogEffectDescription(power);
    render();scheduleSave();showToast('Último efeito removido.');
  }
  function libraryEffectsSummary(p){
    const groups=(p.poderes||[]).map((power,i)=>({power,i})).filter(({power})=>Array.isArray(power.efeitos)&&power.efeitos.length);
    if(!groups.length)return '<div class="lib-mini-notice">Os efeitos escolhidos na biblioteca aparecerão aqui e na descrição dos poderes, inclusive no modelo Canva.</div>';
    return '<section class="lib-chosen-effects"><h3>Efeitos selecionados na biblioteca</h3>'+groups.map(({power,i})=>
     '<div class="lib-chosen-group"><strong>'+E(power.nome)+' · Nv '+n(power.nivel)+'</strong><div class="lib-chosen-items">'+power.efeitos.map((effect,idx)=>
      '<div class="lib-chosen-chip"><span>'+E(effect.nome||effect)+'</span>'+
      (idx===power.efeitos.length-1?'<button type="button" data-action="library-forget-effect" data-index="'+idx+'" data-power-index="'+i+'" aria-label="Remover efeito '+E(effect.nome||effect)+'">×</button>':'')+'</div>').join('')+'</div></div>'
    ).join('')+'</section>';
  }

  function catalogLearn(id){
    const p=active(),item=catalogItem(id);
    if(!p||!canEditCurrent())return showToast('Abra uma ficha com permissão de edição.',true);
    const gate=catalogGate(p,item);if(!gate.ok)return showToast(gate.reason,true);
    if(item.kind==='power'){
      const owned=catalogPower(p,item.id);
      if(owned)owned.nivel=n(owned.nivel)+1;
      else p.poderes.push({id:randomId(),nome:item.name,nivel:1,descricao:systemSummary(item),catalogId:item.id,efeitos:[]});
      if(item.effectPower){S.libraryPowerId=item.id;S.libraryKind='effect';S.inlineKind='effect';S.inlineSearch='';}
    }else if(item.kind==='aptitude'){
      p.aptidoes.push({id:randomId(),nome:item.name,tipo:item.clan==='comum'?'Geral':'Clã: '+clanOf(item.clan).name,catalogId:item.id});
    }else if(item.kind==='effect'){
      const power=catalogPower(p,S.libraryPowerId);
      if(!power)return showToast('Escolha um poder.',true);
      if(!Array.isArray(power.efeitos))power.efeitos=[];
      power.efeitos.push({nome:item.name,nivelEscolha:power.efeitos.length+1,catalogId:item.id});
      syncCatalogEffectDescription(power);
    }else if(item.kind==='jutsu'){
      const special=item.id==='goukakyuu'&&p.clanId==='uchiha'&&catalogApt(p,'Elemento Natural: Katon');
      p.jutsus.push({id:randomId(),nome:item.name,nivel:item.free?0:(special?4:n(item.min)||1),
        acao:systemRules(item)?.[4]||item.action||'',duracao:systemRules(item)?.[6]||'',alvo:'',alcance:systemRules(item)?.[5]||item.range||'',efeito:[systemSummary(item),systemRules(item)?.[1],systemRules(item)?.[2]].filter(Boolean).join(' '),
        origemPoder:item.power||'',catalogId:item.id,rank:item.rank||'',custoChakra:item.cost||systemRules(item)?.[3]||'Ver descrição do poder',custo:/^\d+$/.test(String(item.cost??''))?Number(item.cost):''});
    }
    scheduleSave();render();
    showToast((item.kind==='power'?'Poder atualizado: ':item.kind==='effect'?'Efeito selecionado: ':'Registrado: ')+item.name);
  }


  /* Biblioteca integrada: dados salvos na ficha, sem novas coleções Firebase. */
  function integratedCost(record,item){
    const official=String(item?.cost??'').trim();
    if(official)return /^\d+$/.test(official)?Number(official):null;
    // Campo numérico da ficha Canva e da continuação.
    const typed=String(record?.custo??'').trim();
    if(/^\d+$/.test(typed))return Number(typed);
    const note=String(record?.custoChakra??'').trim();
    if(note)return /^\d+$/.test(note)?Number(note):null;
    return n(record?.nivel)>0?n(record.nivel):null;
  }
  function integratedBlock(p,record){
    const item=catalogItem(record.catalogId);
    if(!item||item.kind!=='jutsu')return '';
    const shadow={...p,jutsus:(p.jutsus||[]).filter(j=>j!==record)};
    const state=catalogGate(shadow,item);
    return state.ok?'':state.reason;
  }
  function integratedUse(index){
    const p=active();
    if(!p||!canEditCurrent())return showToast('Ficha sem permissão de edição.',true);
    const j=p.jutsus?.[index];
    if(!j)return showToast('Jutsu não encontrado.',true);
    const error=integratedBlock(p,j);
    if(error)return showToast('Pré-requisito não atendido: '+error,true);
    const item=catalogItem(j.catalogId);
    let cost=integratedCost(j,item);
    if(cost===null){
      const input=document.querySelector('[data-integrated-cost="'+index+'"]');
      if(!input||input.value.trim()==='')return showToast('Informe o custo variável de Chakra.',true);
      cost=Number(input.value);
    }
    if(!Number.isInteger(cost)||cost<0||cost>999)return showToast('Custo de Chakra inválido.',true);
    const chakra=p.recursos?.chakra===null||p.recursos?.chakra===undefined||p.recursos?.chakra===''?chakraMax(p):n(p.recursos.chakra);
    if(chakra<cost)return showToast('Chakra insuficiente: '+chakra+' disponível.',true);
    p.recursos={...p.recursos,chakra:chakra-cost};
    const inCombat=S.combatMode&&S.view==='sheet';
    scheduleSave();render();
    if(inCombat)combatFeedback('jutsu',j.nome+' · −'+cost+' Chakra');
    showToast(j.nome+': −'+cost+' Chakra.');
  }
  function integratedKnown(p){
    const list=(p.jutsus||[]).filter(x=>String(x.nome||'').trim());
    const chakra=p.recursos?.chakra===null||p.recursos?.chakra===undefined||p.recursos?.chakra===''?chakraMax(p):n(p.recursos.chakra);
    return `<section class="int-known"><header><div><b>Técnicas do meu personagem</b><small>Use as técnicas durante a sessão e consulte os efeitos.</small></div><strong>Chakra: ${chakra} / ${chakraMax(p)}</strong></header>
      ${list.length?list.map(j=>{
        const i=p.jutsus.indexOf(j),item=catalogItem(j.catalogId),cost=integratedCost(j,item),error=integratedBlock(p,j);
        return `<article class="int-known-row"><div><b>${E(j.nome)}</b><small>${E(j.acao||item?.action||'Ação conforme manual')} · ${E(j.alcance||item?.range||'Alcance conforme manual')} · ${cost===null?'custo variável':cost+' Chakra'}</small>
        ${error?`<small class="int-alert">⚠ ${E(error)}</small>`:''}
        <details><summary>Descrição e regras</summary><p>${E(j.efeito||item?.desc||'Consulte a descrição oficial.')}</p>${item?.page?`<small>Referência: Shinobi no Sho 4.1b, página ${item.page}</small>`:''}</details></div>
        <aside>${cost===null?`<input type="number" min="0" max="999" step="1" placeholder="Chakra" aria-label="Custo em Chakra" data-integrated-cost="${i}">`:''}
        <button type="button" class="button small" data-action="integrated-use" data-index="${i}" ${error?'disabled':''}>${cost===null?'Usar jutsu':'Usar · −'+cost}</button></aside></article>`;
      }).join(''):'<p class="int-hint">Nenhum jutsu registrado. Escolha a aba Jutsus para adicioná-los.</p>'}</section>`;
  }
  function integratedFilter(){
    const query=catalogKey(S.inlineSearch||'');let count=0;
    document.querySelectorAll('[data-int-card]').forEach(el=>{
      const yes=!query||String(el.dataset.intCard||'').includes(query);
      el.hidden=!yes;if(yes)count++;
    });
    document.querySelectorAll('[data-int-count]').forEach(el=>el.textContent=count+' resultado(s)');
    document.querySelectorAll('[data-int-empty]').forEach(el=>el.hidden=count>0);
  }
  function integratedLibrary(p,mode='powers'){
    const aptitudeOnly=mode==='aptitudes';
    const kind=aptitudeOnly?'aptitude':(['power','effect','jutsu','aptitude'].includes(S.inlineKind)?S.inlineKind:'power');
    const powers=LIBRARY_ENTRIES.filter(x=>x.kind==='power'&&x.effectPower);
    const chosen=powers.some(x=>x.id===S.libraryPowerId)?S.libraryPowerId:(powers.find(x=>catalogPower(p,x.id))?.id||'ninpou');
    S.libraryPowerId=chosen;
    const remaining=currentNC().powers-totals(p).powers;
    const entries=LIBRARY_ENTRIES.filter(x=>x.kind===kind&&(x.clan==='comum'||x.clan===p.clanId));
    const kinds=[['power','Poderes'],['effect','Efeitos'],['jutsu','Jutsus'],['aptitude','Aptidões']];
    const cards=entries.map(x=>{
      const gate=catalogGate(p,x),owned=x.kind==='power'?catalogPower(p,x.id):null;
      const already=x.kind==='jutsu'?catalogTech(p,x):x.kind==='aptitude'?catalogApt(p,x.name):x.kind==='effect'?catalogHasEffect(p,chosen,x.name):false;
      const meta=[x.kind==='power'?'Poder · '+(owned?'nível '+n(owned.nivel):'a aprender'):x.kind==='effect'?'Efeito':x.kind==='aptitude'?'Aptidão':'Jutsu',x.min?'Nível '+x.min:'',x.rank?'Rank '+x.rank:'',x.page?'p. '+x.page:''].filter(Boolean);
      const cost=x.kind==='power'?'1 ponto de poder por nível':x.kind==='aptitude'?'3 gratuitas; extras 2 pontos':x.kind==='effect'?'1 efeito por nível':'registro gratuito; Chakra conforme nível ou descrição';
      const details=x.kind==='jutsu'?'Ação: '+(x.action||'consultar livro')+'. Alcance: '+(x.range||'consultar livro')+'. Chakra: '+(x.cost||'conforme nível usado')+'. '+(x.power?'Poder: '+(catalogItem(x.power)?.name||x.power)+'.':''):
        x.kind==='effect'?'Selecione um poder de efeitos adquirido. Efeitos são escolhidos em ordem, até o nível comprado.':
        x.kind==='power'?'O nível adquirido determina efeitos e técnicas liberados. Limite atual: '+limit()+'.':
        'Só pode ser aprendida quando os requisitos são atendidos.';
      return `<article class="int-card" data-int-card="${E(catalogKey([x.name,x.desc,x.power,x.clan].join(' ')))}"><div class="int-tags">${meta.map(t=>`<span>${E(t)}</span>`).join('')}</div>
      <div class="int-row"><div><strong>${E(x.name)}</strong><p>${E(systemSummary(x))}</p></div><button type="button" class="button small ${gate.ok?'':'secondary'}" data-action="library-learn" data-id="${E(x.id)}" ${gate.ok?'':'disabled'}>${E(gate.text)}</button></div>
      ${owned||already?`<small class="int-owned">✓ ${owned?'Adquirido · nível '+n(owned.nivel):'Na ficha'}</small>`:''}
      ${!gate.ok&&!already&&!owned?`<small class="int-alert">${E(gate.reason)}</small>`:''}
      ${systemRulesHTML(x,true)}</article>`;
    }).join('');
    return `<section class="int-library" aria-label="Biblioteca integrada na criação da ficha">
      <header class="int-header"><div><div class="eyebrow">SISTEMA INTEGRADO · SHINOBI CHRONICLES</div><h3>Aprendizado de técnicas</h3><p>Adicione à ficha aqui mesmo. Requisitos e orçamento são conferidos antes da compra.</p></div><span class="int-balance"><strong>${remaining}</strong><small>pontos livres</small></span></header>
      ${!aptitudeOnly?`<nav class="int-nav" aria-label="Escolher tipo de técnica">${kinds.map(([id,title])=>`<button type="button" data-action="integrated-kind" data-kind="${id}" class="${kind===id?'on':''}" aria-pressed="${kind===id}">${title}</button>`).join('')}</nav>`:
      '<p class="int-hint">As três primeiras aptidões são gratuitas. Extras gastam 2 pontos de poder.</p>'}
      <div class="int-filters"><label>Buscar <input type="search" data-int-search value="${E(S.inlineSearch||'')}" placeholder="Ex.: Katon, Sharingan, sombra..." autocomplete="off"></label>
      ${kind==='effect'?`<label>Escolher efeito para <select data-library-power>${powers.map(x=>`<option value="${x.id}" ${x.id===chosen?'selected':''}>${E(x.name)}${catalogPower(p,x.id)?' ✓':''}</option>`).join('')}</select></label>`:''}
      <small data-int-count>${entries.length} resultado(s)</small></div>
      <div class="int-grid">${cards}</div><p class="int-hint" data-int-empty hidden>Nenhuma opção encontrada para esta busca.</p>
      <div class="int-bottom"><small>Regras específicas e efeitos não cadastrados devem ser conferidos com o mestre.</small><button type="button" class="button secondary small" data-action="nav" data-view="biblioteca">Abrir biblioteca completa</button></div>
      ${aptitudeOnly||mode==='canva'?'':integratedKnown(p)}
    </section>`;
  }

 return layout(`<div class="lib-hero">

function describeSheetChange(before,after,type){
 if(type==='added')return 'Nova ficha criada';
 if(type==='removed')return 'Ficha excluída';
 if(!before)return 'Ficha sincronizada';
 for(const [path,label] of [['nome','Nome'],['nc','NC'],['graduacao','Graduação'],['recursos.vit','Vitalidade'],['recursos.chakra','Chakra']]){
  const a=getAt(before,path),b=getAt(after,path);
  if(String(a??'')!==String(b??''))return label+': '+String(a??'—').slice(0,30)+' → '+String(b??'—').slice(0,30);
 }
 for(const [key,name] of ATTRS)if(n(before.atributos?.[key])!==n(after.atributos?.[key]))return name+': '+n(before.atributos?.[key])+' → '+n(after.atributos?.[key]);
 for(const [name] of SKILLS)if(n(before.pericias?.[name])!==n(after.pericias?.[name]))return 'Perícia '+name+': '+n(before.pericias?.[name])+' → '+n(after.pericias?.[name]);
 for(const [field,label] of [['jutsus','Jutsus'],['poderes','Poderes'],['aptidoes','Aptidões'],['inventario','Inventário'],['historia','História']])
   if(JSON.stringify(before[field]||'')!==JSON.stringify(after[field]||''))return label+' atualizados';
 return 'Dados da ficha atualizados';
}

function startAdminLive(){
 if(!fb||!canAdmin()||!S.adminUnlocked||S.adminUnsubscribe)return;
 S.adminLive=false;S.adminLiveError=false;S.adminLiveReady=false;
 S.adminUnsubscribe=fb.onSnapshot(fb.collection(fb.db,'fichas'),snapshot=>{
   if(!canAdmin()||!S.adminUnlocked)return;
   const previous=new Map(S.adminSheets.map(x=>[x.__id,x]));
   const all=snapshot.docs.map(d=>({...d.data(),__id:d.id}));
   const next=all.filter(x=>x.tipo!=='diario');
   S.adminDiaries=all.filter(x=>x.tipo==='diario');
   if(S.adminLiveReady){
     for(const change of snapshot.docChanges()){
       const after=change.doc.data(),before=previous.get(change.doc.id);
       if(after.tipo==='diario'||before?.tipo==='diario')continue;
       if(S.lastSavedWrite?.id===change.doc.id&&n(S.lastSavedWrite?.stamp)===n(after?.atualizadoEm))continue;
       S.adminEvents.unshift({nome:after.nome||before?.nome||'Personagem',resumo:describeSheetChange(before,after,change.type),hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})});
     }
     S.adminEvents=S.adminEvents.slice(0,20);
   }
   S.adminLiveReady=true;S.adminLive=true;S.adminLiveError=false;S.adminSheets=next;
   if(S.adminViewing&&S.sheetId){
     const remote=next.find(x=>x.__id===S.sheetId);
     if(remote&&n(remote.atualizadoEm)!==n(S.sheet?.atualizadoEm)){
       const own=S.lastSavedWrite?.id===S.sheetId&&n(S.lastSavedWrite?.stamp)===n(remote.atualizadoEm);
       if(!own){
         const focus=!!document.activeElement?.matches?.('[data-bind],[data-cv-array],[data-cv-skill],input,textarea,select');
         if(focus||S.locallyDirty||S.saveTimer||S.isSaving){
           S.pendingRemote=remote;const label=$('#admin-sheet-sync');
           if(label){label.textContent='Alteração externa recebida · clique para atualizar';label.classList.add('has-update')}
         }else{S.sheet=normalize(remote);S.pendingRemote=null;render()}
       }else S.sheet.atualizadoEm=remote.atualizadoEm;
     }
   }
   if(S.view==='diario'&&S.diaryFromAdmin&&S.diary&&!S.diaryDirty){
     const freshDiary=S.diaryStorage==='sheet'?
       S.adminSheets.find(x=>x.__id===S.diaryHostId)?.diarioPessoal:
       S.adminDiaries.find(x=>x.ownerUid===S.diaryOwnerUid);
     if(freshDiary&&n(freshDiary.atualizadoEm)>n(S.diary.atualizadoEm)
       &&!document.activeElement?.matches?.('[data-diary-field],[data-diary-completed]')){
       S.diary=normalizeDiary(freshDiary,S.diaryOwnerUid,freshDiary.usuario);
       render();
     }
   }
   showAdminLiveUI();
 },error=>{
   console.error('Firestore ao vivo:',error.code||error);
   S.adminLive=false;S.adminLiveError=true;
   if(S.adminUnsubscribe){try{S.adminUnsubscribe()}catch(_){}S.adminUnsubscribe=null}
   showAdminLiveUI();showToast('A sincronização do mestre foi interrompida. Confira as regras do Firestore.',true);
 });
 showAdminLiveUI();
}

function guideStepDone(i,p,t,r){
 const c=p.aptidoes.filter(a=>a?.nome?.trim()).length;
 if(i===0)return !!String(p.nome||'').trim();
 if(i===1)return !!NC_TABLE[p.nc];
 if(i===2)return t.attrs===r.attrs&&ATTRS.every(([k])=>n(p.atributos[k])>=r.min);
 if(i===3)return true;
 if(i===4)return t.skills===r.skills;
 if(i===5)return t.social===r.social;
 if(i===6)return c>=3;
 if(i===7)return t.powers===r.powers;
 if(i===8)return true;
 if(i===9)return !!String(p.historia||'').trim();
 if(i===10)return [0,2,4,5,6,7].every(k=>guideStepDone(k,p,t,r));
 return false;
}

 if(index===4)return `<p>Para cada perícia, o valor inicial é a metade do atributo relacionado, <b>arredondada para cima</b>. Depois você soma os pontos investidos nela.</p><div class="guide-formula">Precisão da perícia = ⌈atributo ÷ 2⌉ + pontos gastos + modificadores</div><p>Distribua ${num(r.skills)} pontos. Em NC ${p.nc}, você pode gastar no máximo ${num(lv)} em uma única perícia. As marcadas como <b>treinadas [x]</b> exigem pelo menos um ponto investido para serem usadas.</p><p>Exemplos: Medicina, Mecanismos, Ocultismo e Lidar com Animais exigem treinamento. <b>Venefício não pode ser comprada no NC 4</b>.</p><div class="guide-example"><b>Exemplo:</b> com INT 2, uma perícia de Inteligência começa em 1. Investindo 2 pontos, a precisão dela fica 3 (antes de outros bônus).</div><p><b>Na sua ficha:</b> ${t.skills} de ${r.skills} pontos de perícias distribuídos.</p>`;
 if(index===5)return `<p>Os atributos sociais são separados dos sete atributos principais: <b>Carisma</b> mede influência e simpatia, enquanto <b>Manipulação</b> abrange blefes, lábia e enganação.</p><p>No NC ${p.nc}, distribua ${num(r.social)} pontos entre os dois, respeitando o limite de ${num(lv)} por atributo social.</p><div class="guide-example">Exemplo no NC 4: Carisma 1 e Manipulação 1. Você também pode investir 2 em apenas um deles. O manual admite que grupos que prefiram interpretar sem testes sociais ignorem essa etapa, conforme decisão do mestre.</div><p><b>Na sua ficha:</b> ${t.social} de ${r.social} pontos sociais distribuídos.</p>`;

 if(index===7)return `<p>Agora use seus <b>${r.powers} pontos de poder</b>. Cada nível de um poder custa um ponto, e no NC ${p.nc} nenhum poder pode ultrapassar nível ${lv}. Aptidões extras também descontam desse orçamento.</p><p>O clã ${E(clan.name)} permite acesso a opções restritas correspondentes, mas <b>nenhuma técnica é obtida automaticamente</b>. Os poderes precisam ser comprados e os pré-requisitos verificados.</p><div class="guide-example"><b>Exemplo no NC 4:</b> comprar Katon nível 2 custa 2 pontos de poder, deixando 2 para outros poderes ou uma aptidão extra. Técnicas básicas são gratuitas; jutsus conhecidos devem ser registrados de acordo com o nível e as regras do poder correspondente.</div><p>Em geral, o custo de Chakra da técnica é igual ao nível usado. Confira exceções no livro.</p><p><b>Na sua ficha:</b> ${t.powers} de ${r.powers} pontos de poder comprometidos.</p>`;

 if(index===9)return `<p>Registre seus Ryos e equipamentos na quarta página. O dinheiro inicial de um Genin NC 4 é <b>100 Ryos</b>. O equipamento básico, como kunais e shurikens, costuma ser fornecido pela Vila, respeitando a capacidade de carga.</p><p>Os itens ocupam compartimentos. Consulte o manual para preços, limites e equipamentos especiais; o guia não preenche esses valores por conta própria.</p><div class="guide-example"><b>História:</b> escreva a família, as relações, um objetivo e o que motiva o personagem a atuar como shinobi. Isso ajuda o mestre a inserir seu personagem na campanha.</div><p>No editor, você pode enviar a imagem do personagem diretamente do aparelho, trocar o retrato e salvar tudo na sua conta.</p>`;

}

function guideChecks(p,t,r){
 const abilities=p.aptidoes.filter(x=>x?.nome?.trim()).length;
 return [
  {label:'Identidade',detail:p.nome?`Nome: ${p.nome}`:'Preencha o nome do personagem',ok:!!String(p.nome||'').trim()},
  {label:'Atributos',detail:`${t.attrs} / ${r.attrs} pontos; mínimo ${r.min} em cada atributo`,ok:t.attrs===r.attrs&&ATTRS.every(([k])=>n(p.atributos[k])>=r.min&&n(p.atributos[k])<=p.nc)},
  {label:'Perícias',detail:`${t.skills} / ${r.skills} pontos; máximo ${limit()} por perícia`,ok:t.skills===r.skills&&SKILLS.every(([name])=>n(p.pericias[name])<=limit())&&!(p.nc===4&&n(p.pericias.Venefício)>0)},
  {label:'Sociais',detail:`${t.social} / ${r.social} pontos em Carisma e Manipulação`,ok:t.social===r.social},
  {label:'Aptidões',detail:`${abilities} registradas; três gratuitas e extras pagas com poderes`,ok:abilities>=3},
  {label:'Poderes',detail:`${t.powers} / ${r.powers} pontos investidos, incluindo aptidões extras`,ok:t.powers===r.powers},
  {label:'Energia calculada',detail:`Vitalidade ${vitMax(p)} · Chakra ${chakraMax(p)}`,ok:true},
 ];
}

function guideField(label,path,value,opts={}){
 const attr=`data-bind="${E(path)}" aria-label="${E(label)}"`;
 const input=opts.area?`<textarea ${attr} rows="${opts.rows||3}" placeholder="${E(opts.placeholder||'')}">${E(value??'')}</textarea>`:
 `<input ${attr} type="${opts.type==='number'?'number':'text'}" value="${E(value??'')}" ${opts.type==='number'?'min="0" step="1"':''} placeholder="${E(opts.placeholder||'')}" autocomplete="off">`;
 return `<label class="guide-field"><span>${E(label)}</span>${input}</label>`;
}

function guideListEditor(p,array,label,fields,hint){
 const records=p[array]||[];
 const entries=records.length?records.map((item,i)=>`
 <div class="guide-entry"><div class="guide-entry-title"><span class="guide-entry-index">${String(i+1).padStart(2,'0')}</span><b>${E(label)} ${i+1}</b>
 ${array==='aptidoes'?`<small>${i<3?'Gratuita':'Extra · 2 pontos de poder'}</small>`:''}
 <button type="button" class="guide-remove" data-action="remove-item" data-array="${E(array)}" data-index="${i}" aria-label="Remover ${E(label)} ${i+1}">Remover ×</button></div>
 <div class="guide-fields">${fields.map(([title,key,type])=>guideField(title,`@${array}.${i}.${key}`,item?.[key],{type,area:type==='area',rows:3})).join('')}</div></div>`).join(''):'<p class="guide-empty">Nenhum registro ainda. Adicione o primeiro pelo botão abaixo.</p>';
 return `<section class="guide-list-editor"><div class="guide-list-head"><h4>${E(label)}</h4><small>${E(hint||'')}</small></div><div class="guide-entries">${entries}</div><button type="button" class="guide-add" data-action="add-item" data-array="${E(array)}">+ Adicionar ${E(label.toLowerCase())}</button></section>`;
}

function refreshGuideFeedback(){
 if(S.view!=='guia'||!active())return;
 const p=active(),r=currentNC(),t=totals(p);
 const done=GUIDE_STEPS.filter((_,i)=>guideStepDone(i,p,t,r)).length;
 const count=$('.guide-count');if(count)count.textContent=`${done} de ${GUIDE_STEPS.length} verificações atendidas`;
 const progress=$('.guide-nav-progress strong');if(progress)progress.textContent=`${done} / ${GUIDE_STEPS.length}`;
 const track=$('.guide-nav-progress-track i');if(track)track.style.width=`${Math.round(100*done/GUIDE_STEPS.length)}%`;
 [[t.attrs,r.attrs],[t.skills,r.skills],[t.powers,r.powers],[t.social,r.social]].forEach(([used,max],i)=>{
  const el=document.querySelectorAll('.guide-meter .guide-meter-item')[i];if(!el)return;
  el.classList.toggle('complete',used===max);
  const val=el.querySelector('strong');if(val)val.innerHTML=`${used} <small>/ ${max}</small>`;
  const bar=el.querySelector('i');if(bar)bar.style.width=`${Math.max(0,Math.min(100,Math.round(100*used/Math.max(1,max))))}%`;
 });
 document.querySelectorAll('.guide-nav button[data-step]').forEach((el,i)=>{
  const okay=guideStepDone(i,p,t,r);el.classList.toggle('done',okay);
  const marker=el.querySelector('.guide-index');if(marker)marker.textContent=okay?'✓':String(i+1).padStart(2,'0');
 });
}

  function combatChakraValue(p){
    const raw=p.recursos?.chakra;
    return raw===null||raw===undefined||raw===''?chakraMax(p):Math.max(0,Math.min(chakraMax(p),Math.round(n(raw))));
  }
  function combatCondition(p){
    const v=vitalityValue(p),max=vitMax(p),ratio=max?v/max:1;
    return ratio<=.25?'Gravemente ferido':ratio<=.5?'Ferido':'Em combate';
  }

  // Volume geral único para os efeitos de todo o site, sem alterar arquivos de áudio.
  const SHINOBI_AUDIO_GAIN=.34;
  const normalizedSoundVolume=volume=>Math.max(0,Math.min(1,n(volume)*SHINOBI_AUDIO_GAIN));
  let combatCueContext=null;
  function combatCue(kind){
    if(!S.combatMode||S.view!=='sheet')return;
    if(kind==='healing')return playSfx('healing');
    try{
      const Engine=window.AudioContext||window.webkitAudioContext;
      if(!Engine)return;
      const ctx=combatCueContext||(combatCueContext=new Engine());
      if(ctx.state==='suspended')void ctx.resume().catch(()=>{});
      const melodies={
        roll:[[340,0,.07],[460,.075,.075]],
        chakra:[[230,0,.09],[340,.06,.13]],
        jutsu:[[300,0,.09],[500,.07,.16]],
        healing:[[510,0,.09],[660,.07,.14]],
        hit:[[165,0,.09]]
      };
      const tones=melodies[kind]||melodies.chakra;
      for(const [hz,delay,duration] of tones){
        const oscillator=ctx.createOscillator(),gain=ctx.createGain(),time=ctx.currentTime+delay;
        oscillator.type=kind==='hit'?'triangle':'sine';
        oscillator.frequency.setValueAtTime(hz,time);
        oscillator.frequency.exponentialRampToValueAtTime(Math.max(60,hz*(kind==='hit'?.74:1.04)),time+duration);
        gain.gain.setValueAtTime(.0001,time);
        gain.gain.exponentialRampToValueAtTime(normalizedSoundVolume(.14),time+.012);
        gain.gain.exponentialRampToValueAtTime(.0001,time+duration);
        oscillator.connect(gain);gain.connect(ctx.destination);
        oscillator.start(time);oscillator.stop(time+duration+.02);
      }
    }catch(error){console.warn('Efeito suave de combate indisponível:',error)}
  }
  function combatFeedback(kind,label,withCue=true){
    if(!S.combatMode||S.view!=='sheet')return;
    const shell=document.querySelector('.cb-portrait-shell');
    if(!shell)return;
    shell.querySelectorAll('.cb-feedback-effect').forEach(el=>el.remove());
    const previous=['cb-react-hit','cb-react-healing','cb-react-chakra','cb-react-roll','cb-react-jutsu'];
    shell.classList.remove(...previous);
    const type=['hit','healing','chakra','roll','jutsu'].includes(kind)?kind:'chakra';
    void shell.offsetWidth;
    shell.classList.add('cb-react-'+type);
    const symbols={hit:'斬',healing:'癒',chakra:'気',roll:'八',jutsu:'忍'};
    const el=document.createElement('div');
    el.className='cb-feedback-effect is-'+type;
    el.setAttribute('aria-hidden','true');
    el.innerHTML='<span class="cb-feedback-rune">'+symbols[type]+'</span><span class="cb-feedback-caption">'+E(label)+'</span>';
    shell.appendChild(el);
    if(withCue){if(type==='healing')playSfx('healing');else combatCue(type)}
    window.setTimeout(()=>{
      el.remove();
      if(shell.isConnected)shell.classList.remove('cb-react-'+type);
    },1050);
  }

  function combatSyncResources(){
    if(!S.combatMode||S.view!=='sheet')return;
    const p=active();if(!p)return;
    const current=vitalityValue(p),max=vitMax(p),chakra=combatChakraValue(p),chakraMaxVal=chakraMax(p);
    document.querySelectorAll('[data-combat-hp]').forEach(el=>el.textContent=current);
    document.querySelectorAll('[data-combat-cp]').forEach(el=>el.textContent=chakra);
    document.querySelectorAll('[data-combat-hp-bar]').forEach(el=>el.style.width=Math.max(0,Math.min(100,100*current/Math.max(1,max)))+'%');
    document.querySelectorAll('[data-combat-cp-bar]').forEach(el=>el.style.width=Math.max(0,Math.min(100,100*chakra/Math.max(1,chakraMaxVal)))+'%');
    document.querySelectorAll('[data-combat-condition]').forEach(el=>el.textContent=combatCondition(p));
    document.querySelectorAll('[data-action="combat-chakra-step"]').forEach(btn=>{
      btn.disabled=!canEditCurrent()||(n(btn.dataset.delta)<0?chakra<=0:chakra>=chakraMaxVal);
    });
  }
  function combatStepChakra(delta){
    if(!canEditCurrent()||!active())return showToast('Esta ficha não está disponível para edição.',true);
    const p=active(),old=combatChakraValue(p),next=Math.max(0,Math.min(chakraMax(p),old+Math.trunc(n(delta))));
    if(next===old)return;
    p.recursos={...(p.recursos||{}),chakra:next};
    combatSyncResources();
    combatFeedback('chakra',(next>old?'+':'')+(next-old)+' Chakra');
    scheduleSave();
  }

  let combatImpactCtx=null;
  let combatImpactDecoded=null;
  function playCombatImpactAt(delayMs=485){
    const fallback=()=>{
      try{
        const sound=new Audio('data:audio/mpeg;base64,'+COMBAT_IMPACT_B64);
        sound.volume=normalizedSoundVolume(.73);
        window.setTimeout(()=>{const playing=sound.play();if(playing?.catch)playing.catch(()=>{});},Math.max(0,delayMs));
      }catch(error){console.warn('Efeito de combate indisponível.',error)}
    };
    try{
      const AudioEngine=window.AudioContext||window.webkitAudioContext;
      if(!AudioEngine)return fallback();
      const ctx=combatImpactCtx||(combatImpactCtx=new AudioEngine());
      if(ctx.state==='suspended')void ctx.resume().catch(()=>{});
      if(!combatImpactDecoded){
        const binary=atob(COMBAT_IMPACT_B64);
        const bytes=new Uint8Array(binary.length);
        for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
        combatImpactDecoded=ctx.decodeAudioData(bytes.buffer).catch(error=>{
          console.warn('Não foi possível decodificar o som das kunais.',error);
          return null;
        });
      }
      const started=performance.now();
      void combatImpactDecoded.then(buffer=>{
        if(!buffer)return fallback();
        if(S.view!=='sheet')return;
        const source=ctx.createBufferSource();
        const gain=ctx.createGain();
        source.buffer=buffer;
        gain.gain.value=normalizedSoundVolume(.74);
        source.connect(gain);
        gain.connect(ctx.destination);
        const remaining=Math.max(0,(delayMs-(performance.now()-started))/1000);
        source.start(ctx.currentTime+remaining);
      });
    }catch(error){
      console.warn('Efeito sonoro de combate não pôde iniciar.',error);
      fallback();
    }
  }

  function combatEnter(){
    if(!active()||S.view!=='sheet'||S.combatMode||S.combatTransitioning)return;
    S.combatTransitioning=true;
    const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;
    if(reduced){playCombatImpactAt(0);S.combatMode=true;S.combatTransitioning=false;render();window.scrollTo(0,0);return}
    const overlay=document.createElement('div');
    overlay.className='cb-entry';
    overlay.setAttribute('role','status');
    overlay.setAttribute('aria-label','Entrando no modo de combate');
    overlay.innerHTML=`<span class="cb-entry-symbol" aria-hidden="true">戦</span>
      <div class="cb-entry-kunai is-left">${COMBAT_KUNAI_SVG}</div>
      <div class="cb-entry-kunai is-right">${COMBAT_KUNAI_SVG}</div>
      <div class="cb-entry-lightning" aria-hidden="true"><svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
        <path d="M157 157L136 135L138 122L109 105L123 132L115 141L147 157"/>
        <path d="M164 157L183 132L198 135L221 104L207 137L216 145L174 159"/>
        <path d="M157 167L133 183L130 201L98 222L121 188L114 177L151 162"/>
        <path d="M166 166L188 181L190 201L225 220L199 191L209 178L173 163"/>
      </svg></div>
      <div class="cb-entry-impact" aria-hidden="true"></div>
      <span class="cb-entry-spark s1"></span><span class="cb-entry-spark s2"></span><span class="cb-entry-spark s3"></span><span class="cb-entry-spark s4"></span>
      <div class="cb-entry-badge">MODO DE COMBATE</div>`;
    document.body.appendChild(overlay);
    playCombatImpactAt(485);
    window.setTimeout(()=>{
      if(S.view==='sheet'&&active()){S.combatMode=true;render();window.scrollTo(0,0)}
    },570);
    window.setTimeout(()=>overlay.classList.add('is-leaving'),900);
    window.setTimeout(()=>{overlay.remove();S.combatTransitioning=false},1270);
  }
  function combatExit(){
    S.combatMode=false;
    S.combatTransitioning=false;
    S.portraitPreview=null;
    render();window.scrollTo(0,0);
  }
  function combatNextPortrait(){
    const p=active();if(!p)return;
    const shown=portraitShowing(p);
    const available=PORTRAIT_VARIANTS.filter(v=>portraitOwn(p,v.key));
    if(!available.length)return uploadPortrait('ninja');
    const at=available.findIndex(v=>v.key===shown);
    const next=available[(at+1+available.length)%available.length];
    S.portraitPreview={sheetId:S.sheetId,key:next.key};
    render();
  }
  function combatToTechniques(){
    S.combatMode=false;
    S.canvaMode='original';
    S.canvaPage=3;
    render();
    window.scrollTo(0,0);
  }

  function evolutionDiff(before,after){
    const old=NC_TABLE[before],next=NC_TABLE[after];
    if(!old||!next)return null;
    return {attrs:next.attrs-old.attrs,skills:next.skills-old.skills,powers:next.powers-old.powers,
      social:next.social-old.social,vit:5*(after-before)};
  }
  function evolutionLog(p,before,after){
    if(!NC_TABLE[before]||!NC_TABLE[after]||after<=before)return null;
    const growth=evolutionDiff(before,after);
    if(!Array.isArray(p.evolucoes))p.evolucoes=[];
    const event={id:randomId(),antes:before,depois:after,data:Date.now(),ganhos:growth};
    p.evolucoes.push(event);
    if(p.evolucoes.length>60)p.evolucoes=p.evolucoes.slice(-60);
    return event;
  }
  function evolutionStatus(p,context='sheet'){
    const info=NC_TABLE[p.nc]||NC_TABLE[4],t=totals(p),entries=(p.evolucoes||[]).slice().reverse();
    const stages=[4,8,12,16,20];
    const categories=[['Atributos',t.attrs,info.attrs],['Perícias',t.skills,info.skills],
      ['Poderes',t.powers,info.powers],['Sociais',t.social,info.social]];
    return `<section class="evo-tracker ${context==='guide'?'guide':''}" aria-label="Evolução e progressão do shinobi">
      <div class="evo-tracker-head"><div><div class="eyebrow">CAMINHO SHINOBI · REGISTRO DE EVOLUÇÃO</div>
       <h3>Seu desenvolvimento</h3><p>Os pontos livres se atualizam quando o mestre aumenta o NC.</p></div>
       <div class="evo-level-seal"><strong>${n(p.nc)}</strong><span><b>NÍVEL DE CAMPANHA</b><small>${E(info.label)}</small></span></div></div>
      <div class="evo-budget-grid">${categories.map(([label,spent,cap])=>`<div class="evo-budget-item">
       <b>${Math.max(0,cap-spent)}</b><span>${label} disponíveis</span><small>${spent} de ${cap} utilizados</small>
      </div>`).join('')}</div>
      <div class="evo-path" aria-label="Marcos de evolução">
       ${stages.map(level=>`<span class="evo-path-node ${n(p.nc)>=level?'is-reached':''} ${n(p.nc)===level?'is-current':''}">NC ${level}</span>`).join('')}
      </div>
      <details class="evo-history"><summary>Histórico de evolução (${entries.length})</summary>
       <div class="evo-history-list">${entries.length?entries.map(ev=>{
         const old=n(ev.antes),now=n(ev.depois),delta=evolutionDiff(old,now);
         const stamp=Number.isFinite(Number(ev.data))?new Date(ev.data).toLocaleDateString('pt-BR'):'';
         return `<div class="evo-history-entry"><div><b>NC ${old} → ${now}</b>
          <small>${delta?'+'+delta.attrs+' atributos · +'+delta.skills+' perícias · +'+delta.powers+' poderes · +'+delta.social+' sociais':'Evolução registrada'}</small></div>
          <time>${E(stamp)}</time></div>`;
       }).join(''):'<p class="evo-history-entry"><small>Seu histórico começará quando o personagem subir de NC.</small></p>'}</div>
      </details>
    </section>`;
  }
  function evolutionDismiss(){
    const layer=document.querySelector('.evo-rise-layer');
    if(!layer)return;
    layer.classList.add('is-dismissing');
    window.setTimeout(()=>layer.remove(),260);
  }
  function evolutionSound(){
    if(!EVOLUTION_SOUND_URL)return;
    try{
      const clip=new Audio(EVOLUTION_SOUND_URL);
      clip.volume=normalizedSoundVolume(.40); // volume de evolução alinhado aos demais efeitos
      const started=clip.play();
      if(started?.catch)started.catch(error=>console.warn('Som de evolução indisponível:',error));
    }catch(error){console.warn('Falha ao reproduzir a evolução:',error)}
  }

  function evolutionCelebrate(p,before,after){
    const delta=evolutionDiff(before,after);
    if(!delta)return;
    const old=NC_TABLE[before],current=NC_TABLE[after],clan=clanOf(p.clanId);
    document.querySelectorAll('.evo-rise-layer').forEach(el=>el.remove());
    const panel=document.createElement('div');
    panel.className='evo-rise-layer';
    panel.setAttribute('role','dialog');
    panel.setAttribute('aria-modal','true');
    panel.setAttribute('aria-label','Pergaminho de evolução para NC '+after);
    panel.innerHTML=`<div class="evo-scroll-stage" style="--evo-color:${E(clan.color)};--evo-wash:${E(clan.wash)}">
      <div class="evo-scroll-rod top" aria-hidden="true"></div>
      <div class="evo-scroll-paper"><div class="evo-ink-body">
        <svg aria-hidden="true" width="0" height="0" style="position:absolute;pointer-events:none"><filter id="evo-ink-edge"><feTurbulence type="fractalNoise" baseFrequency=".018 .052" numOctaves="2" seed="7" result="grain"/><feDisplacementMap in="SourceGraphic" in2="grain" scale="1.4" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
        <div class="evo-ink-header">REGISTRO SHINOBI · EVOLUÇÃO</div>
        <div class="evo-ink-crest" aria-hidden="true">${E(clan.kanji)}</div>
        <h2 class="evo-calligraphy">Evolução Shinobi</h2>
        <div class="evo-ink-subtitle">Registro de progressão</div>
        <svg class="evo-ink-divider" viewBox="0 0 450 22" role="presentation" aria-hidden="true">
          <path d="M13 13 Q64 9 105 12 C165 18 190 7 225 11 S333 16 384 10 Q410 8 435 12"/><path d="M39 17 Q90 18 152 16 M278 17 Q325 15 378 16" stroke-width="1.2" opacity=".4"/>
        </svg>
        <div class="evo-new-level">
          <small>NC ${before}</small><span class="evo-level-arrow" aria-hidden="true">→</span><strong>NC ${after}</strong>
        </div>
        <div class="evo-ink-rank">${E(old.label)} → ${E(current.label)}</div>
        <div class="evo-ink-name">${E(p.nome||'Seu shinobi')} · ${E(clan.name)}</div>
        <div class="evo-ink-rewards">
          ${[['Atributos',delta.attrs],['Perícias',delta.skills],['Poderes',delta.powers],['Sociais',delta.social]]
             .map(([label,gain])=>`<div class="evo-ink-reward"><span>${label}</span><strong>${gain>=0?'+':''}${gain}</strong></div>`).join('')}
        </div>
        <div class="evo-ink-vitality">Vitalidade máxima: +${delta.vit}</div>
        <div class="evo-ink-stamp" aria-hidden="true">${E(clan.kanji)}</div>
        <p class="evo-ink-note">Os pontos de evolução ficam disponíveis na ficha, conforme as regras do mestre.</p>
        <div class="evo-ink-footer"><button type="button" data-action="evolution-close">Continuar</button></div>
       </div></div>
       <div class="evo-scroll-rod bottom" aria-hidden="true"></div>
       <button type="button" class="evo-rise-close" data-action="evolution-close" aria-label="Fechar pergaminho">×</button>
      </div>`;
    document.body.appendChild(panel);
    evolutionSound();
    panel.querySelector('[data-action="evolution-close"]')?.focus({preventScroll:true});
  }

      const old=document.querySelector('#pub-viewport');
      const left=old?.scrollLeft||0,top=old?.scrollTop||0;
      render();

    function setZoom(next,clientX=null,clientY=null){
      const vp=document.querySelector('#pub-viewport'),frame=document.querySelector('.pub-zoomframe'),scene=document.querySelector('.pub-scene');
      const old=zoom;
      const desired=limitNumber(next,0.38,1.85,old);
      if(Math.abs(desired-old)<.00005)return;
      let atX=0,atY=0;
      if(vp){
        const rect=vp.getBoundingClientRect();
        const ox=clientX===null?vp.clientWidth/2:clientX-rect.left;
        const oy=clientY===null?vp.clientHeight/2:clientY-rect.top;
        atX=(vp.scrollLeft+ox)/old;
        atY=(vp.scrollTop+oy)/old;
        zoom=desired;
        if(scene)scene.style.transform='scale('+zoom+')';
        if(frame){frame.style.width=W*zoom+'px';frame.style.height=H*zoom+'px'}
        vp.scrollLeft=Math.max(0,atX*zoom-ox);
        vp.scrollTop=Math.max(0,atY*zoom-oy);
      }else zoom=desired;
      const level=document.querySelector('[data-board-zoom-level]');
      if(level)level.textContent=Math.round(zoom*100)+'%';
    }
    async function uploadPortrait(file){
      if(!file||!permitted())return;
      if(!/^image\/(jpeg|jpg|png|webp)$/.test(file.type)||file.size>12*1024*1024){
        showToast('Escolha uma imagem JPG, PNG ou WEBP de até 12 MB.',true);return;
      }
      const url=URL.createObjectURL(file);
      try{
        const image=new Image();
        await new Promise((resolve,reject)=>{
          image.onload=resolve;image.onerror=()=>reject(Error('Imagem inválida'));image.src=url;
        });
        if(!permitted())return;
        let scale=Math.min(1,900/Math.max(image.naturalWidth,image.naturalHeight));
        let output='';
        for(let attempt=0;attempt<9;attempt++){
          const canvas=document.createElement('canvas');
          canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
          canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
          const ctx=canvas.getContext('2d');
          if(!ctx)throw Error('Canvas indisponível');
          ctx.fillStyle='#f4e8d6';ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.drawImage(image,0,0,canvas.width,canvas.height);
          output=canvas.toDataURL('image/jpeg',Math.max(.5,.83-attempt*.055));
          if(output.length<=112000)break;
          scale*=.8;
        }
        if(output.length>112000)throw Error('Retrato ficou grande demais');
        draft.portrait=output;
        queueSave();repaint();showToast('Retrato adicionado ao quadro.');
      }catch(error){console.error('Upload do retrato:',error);showToast('Não foi possível processar este retrato.',true)}
      finally{URL.revokeObjectURL(url)}
    }

    async function persist(){
      if(!permitted()||!fb)return;
      clearTimeout(saveTimer);saveTimer=0;const v=version,snapshot=structuredClone(draft);
      snapshot.updatedAt=Date.now();delete snapshot.id;
      busy=true;status('Salvando quadro…');
      try{
        let savedAs='public';
        const key=id;
        saveChain=saveChain.catch(()=>{}).then(async()=>{
          try{
            await fb.setDoc(fb.doc(fb.db,'perfisPublicos',key),snapshot);
            sharedIds.add(key);
          }catch(error){
            if(!isPermissionError(error))throw error;
            const sheet=backupSheet(key);
            if(!sheet)throw error;
            await fb.setDoc(fb.doc(fb.db,'fichas',key),{quadroCompartilhavel:snapshot},{merge:true});
            sheet.data.quadroCompartilhavel=structuredClone(snapshot);
            savedAs='draft';
          }
        });
        await saveChain;
        const pos=all.findIndex(x=>x.id===key);
        if(pos>=0)all[pos]=normalizeProfile(snapshot,key);else all.push(normalizeProfile(snapshot,key));
        if(version===v){busy=false;status(savedAs==='public'?(publicReadDenied?'Perfil salvo ✓ · confirme a permissão de leitura para compartilhar':'Publicado e salvo na nuvem ✓'):'Salvo na sua ficha ✓ · Visível só para você até liberar os perfis públicos')}else {busy=false;queueSave()}
      }catch(error){busy=false;console.error('Salvamento do quadro:',error);status('Erro ao salvar');showToast('Não foi possível salvar o quadro. Confira as regras do Firestore.',true)}
    }

    async function uploadMemory(file){
      if(!file||!permitted())return;
      const owner=id;
      if(!/^image\/(jpeg|jpg|png|webp)$/.test(file.type)||file.size>12*1024*1024){
        showToast('Use uma imagem JPG, PNG ou WEBP de até 12 MB.',true);return;
      }
      if(countKind('photo')>=MAX_MEMORIES)return showToast('O álbum aceita até seis fotografias por personagem.',true);
      if(!freeSlot())return;
      const objectUrl=URL.createObjectURL(file);
      try{
        const image=new Image();
        await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error('Imagem inválida'));image.src=objectUrl});
        if(!permitted()||id!==owner)return;
        let scale=Math.min(1,760/Math.max(image.naturalWidth,image.naturalHeight));
        let result='';
        for(let attempt=0;attempt<10;attempt++){
          const canvas=document.createElement('canvas');
          canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
          canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
          const ctx=canvas.getContext('2d');
          if(!ctx)throw Error('Canvas indisponível');
          ctx.fillStyle='#f4eadb';ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.drawImage(image,0,0,canvas.width,canvas.height);
          result=canvas.toDataURL('image/jpeg',Math.max(.46,.78-attempt*.035));
          if(result.length<=100000)break;
          scale*=.81;
        }
        if(result.length>100000)throw Error('Não foi possível comprimir a foto');
        const name=clip(file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),55)||'Minha memória';
        // A primeira memória abre espaço nas laterais para não cobrir os bilhetes de origem.
        if(!draft.notes.some(n=>n.kind==='extent')&&draft.notes.length<=MAX_ELEMENTS-2){
          draft.notes.push(sanitizeNote({id:'board-size',kind:'extent',w:2050,h:1510}));
          boardSize();
        }
        const pos=placement(315,320);
        const memory=sanitizeNote({id:randomId(),kind:'photo',title:name,image:result,...pos,w:315,h:320,rotation:2*(countKind('photo')%3-1)});
        const projected=JSON.stringify({...draft,notes:[...draft.notes,memory]});
        if(projected.length>750000)return showToast('Este quadro está cheio de imagens. Remova alguma foto antes de adicionar outra.',true);
        if(id!==owner||!permitted()||!freeSlot())return;
        draft.notes.push(memory);
        queueSave();repaint();showToast('Fotografia colada no álbum de memórias.');
      }catch(error){console.error('Foto do mural:',error);showToast('Não foi possível preparar a fotografia.',true)}
      finally{URL.revokeObjectURL(objectUrl)}
    }
