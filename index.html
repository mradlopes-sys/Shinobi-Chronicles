  /* ===== FICHAS CANVA ORIGINAIS: PÁGINAS A4 COM CAMPOS EDITÁVEIS ===== */
  .cv-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0 16px}
  .cv-toolbar h2{font:600 22px var(--serif);margin:0}.cv-toolbar p{font-size:12px;color:var(--muted);margin:4px 0 0}
  .cv-pages{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}
  .cv-pages button{padding:9px 14px;border:1px solid var(--line);background:#fffdfa;color:#4b4b4b;cursor:pointer;font-weight:700;font-size:12px}
  .cv-pages button.active{background:#202723;color:white;border-color:#202723}
  .cv-wrap{width:100%;display:flex;justify-content:center;overflow:auto;padding:8px 0 26px}
  .cv-page{width:min(100%,828px);flex:0 0 auto;aspect-ratio:8.27/11.69;position:relative;background:linear-gradient(120deg,#f0e7df,#fff9f5 45%,#e6ddd3);box-shadow:0 10px 30px #1b242025;border:1px solid #eee2d7;overflow:hidden}
  .cv-page img.cv-bg{width:100%;height:100%;display:block;position:absolute;inset:0;z-index:0;object-fit:fill}
  .cv-page .cv-missing{position:absolute;top:20%;left:10%;right:10%;text-align:center;pointer-events:none;color:#80645f;opacity:.6;font:600 25px var(--serif)}
  .cv-spot{position:absolute;z-index:2;overflow:hidden}
  .cv-in{width:100%;height:100%;margin:0!important;display:block;min-width:0;padding:0 3px!important;background:rgba(255,255,255,.95)!important;border:1px solid rgba(100,79,76,.18)!important;border-radius:0!important;color:#2b2929!important;font-family:"DM Sans",sans-serif!important;font-size:clamp(7px,1vw,12px)!important;line-height:1.18!important;box-shadow:none!important}
  .cv-in:focus{outline:1.5px solid #834b46!important;background:#fff!important;z-index:4}
  .cv-spot textarea.cv-in{resize:none;overflow:auto;line-height:1.4!important;padding:3px!important}
  .cv-readonly{height:100%;width:100%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.88);color:#6d333d;font-weight:700;font-size:clamp(7px,.95vw,12px)}
  .cv-stepper{width:100%;height:100%;display:flex;align-items:center;justify-content:space-evenly;background:rgba(255,255,255,.95);gap:1px;color:#803c48}
  .cv-stepper button{height:100%;flex:1;border:0;background:transparent;color:#803c48;font-weight:800;cursor:pointer;font-size:clamp(8px,1.2vw,15px)}
  .cv-stepper button:hover{background:#e5c2c5}.cv-stepper b{flex:1;text-align:center;font-size:clamp(8px,1.25vw,15px)}
  .cv-image{position:absolute;z-index:2;left:62.7%;top:17.2%;width:30.7%;height:22%;object-fit:cover;object-position:center}
  .cv-status{font-size:12px;line-height:1.6;color:#65605c;text-align:center;margin:8px auto 28px;max-width:800px}
  @media(max-width:700px){.cv-page{min-width:620px}.cv-wrap{justify-content:flex-start}.cv-in{font-size:10px!important}}
  @media print{@page{size:A4;margin:0}.sidebar,.topbar,.cv-toolbar,.cv-pages,.cv-status,.statusbar,.cv-extra{display:none!important}.main-area,.content,.app-main{padding:0!important;margin:0!important}.cv-wrap{overflow:visible;padding:0}.cv-page{width:210mm!important;height:297mm!important;max-width:none;box-shadow:none;border:0}.cv-in{print-color-adjust:exact!important}}


  /* Fichas múltiplas e feedback de artes ausentes */
  .my-sheet-list{display:grid;gap:14px}
  .my-sheet-card{display:flex;align-items:center;gap:16px;padding:14px;background:#fffdfa;border:1px solid var(--line);border-radius:4px}
  .my-sheet-mini{flex:0 0 140px;width:140px;aspect-ratio:16/9;background:linear-gradient(135deg,#f4f1ed,var(--wash));position:relative;overflow:hidden}
  .my-sheet-mini img{width:100%;height:100%;object-fit:cover}
  .my-sheet-mini span{position:absolute;right:10px;bottom:3px;opacity:.24;font-size:32px}
  .my-sheet-info{flex:1;min-width:0}
  .my-sheet-info h3{font:600 21px var(--serif);margin:5px 0}
  .my-sheet-info p{font-size:12px;color:var(--muted);margin:3px 0}
  .my-sheet-buttons,.my-sheet-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .my-sheet-buttons{justify-content:flex-end}.my-sheet-strip{margin:14px 0}
  .danger-quiet{color:#a5423d!important;border-color:#d2b4b2!important}
  .button-danger{background:#a5423d!important;color:#fff!important;border-color:#a5423d!important}

/* Abertura da ficha: pincelada curta, papel japonês e selo, sem bloquear a navegação */
.shinobi-entrance{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;isolation:isolate;opacity:0;pointer-events:auto;transition:opacity .26s ease-out}
.shinobi-entrance:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 48% 48% at 50% 50%,rgba(224,212,188,.96),rgba(213,206,187,.95) 66%,rgba(39,57,46,.87));clip-path:circle(0% at 50% 50%);transition:clip-path .42s cubic-bezier(.16,.7,.31,1);box-shadow:0 0 70px #3548374d inset}
.shinobi-entrance:after{content:"";position:absolute;inset:0;opacity:.2;pointer-events:none;background:repeating-linear-gradient(110deg,transparent 0 6px,rgba(53,70,56,.1) 7px,transparent 8px 16px)}
.shinobi-entrance.is-opening{opacity:1}
.shinobi-entrance.is-opening:before{clip-path:circle(85% at 50% 50%)}
.shinobi-entrance-ink{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:11px;opacity:0;transform:translateY(15px) scale(.94);transition:opacity .28s ease .10s,transform .32s ease .10s;text-align:center;color:#27392f}
.shinobi-entrance.is-opening .shinobi-entrance-ink{opacity:1;transform:translateY(0) scale(1)}
.shinobi-entrance-symbol{display:grid;place-items:center;border:2px solid #ad6d64;border-radius:50%;width:75px;height:75px;font:700 39px var(--serif);color:#864e4b;background:rgba(254,248,235,.3)}
.shinobi-entrance-title{font-size:11px;font-weight:800;letter-spacing:.21em}
.shinobi-entrance-ink small{font-size:12px;letter-spacing:.03em;color:#606b60}
.shinobi-entrance.is-closing{opacity:0;pointer-events:none;transition:opacity .36s ease}
.shinobi-entrance.is-closing .shinobi-entrance-ink{opacity:0;transform:translateY(-9px)}
@media(prefers-reduced-motion:reduce){
 .shinobi-entrance,.shinobi-entrance:before,.shinobi-entrance-ink{transition-duration:.01s!important}
}


/* Retratos por upload: integra o espaço original das fichas do Canva */
.cv-portrait{position:absolute;left:62.7%;top:17.2%;width:30.7%;height:22%;z-index:4;overflow:hidden;border-radius:2px}
.cv-portrait-image{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.cv-portrait-pick{position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;padding:12px 6px;border:0;background:transparent;color:#894644;font-size:11px;font-weight:800;cursor:pointer;transition:background .18s ease;white-space:normal}
.cv-portrait-pick span{display:inline-block;border:1px solid #af8b84;background:#eee7d9ee;padding:5px 9px;border-radius:4px;box-shadow:0 2px 9px #29181724}
.cv-portrait-pick:hover,.cv-portrait-pick:focus-visible{background:rgba(177,132,123,.16);outline:2px solid #9a5550;outline-offset:-3px}
.cv-portrait.has-image .cv-portrait-pick{opacity:0;background:linear-gradient(0deg,#201a1a9c,transparent 40%);color:#fff}
.cv-portrait.has-image:hover .cv-portrait-pick,.cv-portrait.has-image .cv-portrait-pick:focus-visible{opacity:1}
.cv-portrait-remove{position:absolute;top:5px;right:6px;width:28px;height:28px;border:1px solid #eee0d0;border-radius:50%;background:#693b3bdd;color:white;font-size:20px;line-height:1;cursor:pointer}
.cv-portrait:not(:hover):not(:focus-within) .cv-portrait-remove{opacity:0}
.portrait-editor{grid-column:1/-1;display:flex;align-items:center;gap:16px;border:1px solid #b8afa0;background:linear-gradient(110deg,#eee5d6,#dcd9cb);padding:12px;border-radius:5px}
.portrait-editor-preview{width:108px;height:138px;flex:0 0 108px;overflow:hidden;display:grid;place-items:center;background:#d8d2c2;color:#777367;font:700 43px var(--serif);border:1px solid #aca79a}
.portrait-editor-preview img{width:100%;height:100%;object-fit:cover}
.portrait-editor-info{flex:1;min-width:0}
.portrait-editor-info strong{font-family:var(--serif);font-size:17px}
.portrait-editor-info p{font-size:12px;line-height:1.65;color:#646357;margin:6px 0 12px}
@media(max-width:700px){.cv-portrait-pick{font-size:10px}.portrait-editor{align-items:flex-start}.portrait-editor-preview{width:80px;height:108px;flex-basis:80px}}
@media print{.cv-portrait{z-index:5}.cv-portrait-pick,.cv-portrait-remove{display:none!important}.cv-portrait-image{print-color-adjust:exact}}


/* ============================================================
   CANVA — CORREÇÃO DE SOBREPOSIÇÃO DOS CAMPOS DIGITAIS
   As caixas já estão desenhadas nas 48 páginas originais.
   Os controles HTML devem exibir somente os valores, sem
   criar um segundo retângulo sobre cada caixa da ilustração.
   ============================================================ */
.shell .cv-page .cv-spot{
  box-sizing:border-box;
  z-index:3;
  overflow:visible;
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
}
.shell .cv-page .cv-spot .cv-in,
.shell .cv-page .cv-spot input.cv-in,
.shell .cv-page .cv-spot select.cv-in,
.shell .cv-page .cv-spot textarea.cv-in{
  box-sizing:border-box!important;
  width:100%!important;
  height:100%!important;
  min-width:0!important;
  max-width:100%!important;
  margin:0!important;
  padding:1px 2px!important;
  display:block!important;
  border:1px solid transparent!important;
  border-radius:2px!important;
  background:transparent!important;
  background-image:none!important;
  box-shadow:none!important;
  color:#322c2a!important;
  font-family:"DM Sans",Arial,sans-serif!important;
  font-size:clamp(9px,1vw,12px)!important;
  font-weight:600!important;
  line-height:1.12!important;
  letter-spacing:0!important;
  text-align:center!important;
  text-overflow:clip;
  outline:0!important;
  transition:background-color .14s ease,box-shadow .14s ease;
  -webkit-appearance:none;
  appearance:none;
}
.shell .cv-page .cv-spot textarea.cv-in{
  padding:2px 4px!important;
  text-align:left!important;
  line-height:1.25!important;
  overflow:auto;
  resize:none;
  white-space:pre-wrap;
}
.shell .cv-page .cv-spot select.cv-in{
  cursor:pointer;
  text-align-last:center;
  padding-right:1px!important;
}
.shell .cv-page .cv-spot input[type="number"]{
  -moz-appearance:textfield!important;
  appearance:textfield!important;
}
.shell .cv-page .cv-spot input[type="number"]::-webkit-outer-spin-button,
.shell .cv-page .cv-spot input[type="number"]::-webkit-inner-spin-button{
  -webkit-appearance:none!important;
  appearance:none!important;
  margin:0!important;
  display:none!important;
}
/* Indicação delicada apenas ao interagir: as molduras originais
   continuam visíveis por baixo, sem blocos brancos duplicados. */
.shell .cv-page .cv-spot:hover .cv-in{
  border-color:rgba(83,75,63,.22)!important;
  background:rgba(245,239,226,.26)!important;
  box-shadow:inset 0 0 0 1px rgba(109,102,81,.06)!important;
}
.shell .cv-page .cv-spot .cv-in:focus,
.shell .cv-page .cv-spot .cv-in:focus-visible{
  border-color:var(--theme-deep,#526354)!important;
  outline:0!important;
  background:rgba(248,242,229,.94)!important;
  box-shadow:0 0 0 2px rgba(47,63,51,.18)!important;
  position:relative;
  z-index:6;
}
.shell .cv-page .cv-spot:focus-within{z-index:8}
/* Valores calculados: só números e texto, sem um quadrado extra. */
.shell .cv-page .cv-readonly{
  box-sizing:border-box!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  width:100%!important;
  height:100%!important;
  padding:0 2px!important;
  margin:0!important;
  background:transparent!important;
  border:none!important;
  box-shadow:none!important;
  color:#3c3631!important;
  font-weight:800!important;
  font-size:clamp(9px,1.05vw,12px)!important;
  line-height:1.1!important;
  text-align:center!important;
  white-space:nowrap;
}
/* Ajuste de atributo: não esconder o número com três caixas. */
.shell .cv-page .cv-stepper{
  display:grid!important;
  grid-template-columns:minmax(0,1fr) minmax(0,1.45fr) minmax(0,1fr);
  align-items:center!important;
  justify-items:stretch!important;
  width:100%!important;
  height:100%!important;
  margin:0!important;
  padding:0!important;
  gap:0!important;
  border:0!important;
  background:transparent!important;
  box-shadow:none!important;
  color:#4e3537!important;
}
.shell .cv-page .cv-stepper b{
  grid-column:2;
  grid-row:1;
  display:block!important;
  min-width:0;
  width:100%;
  text-align:center!important;
  font-size:clamp(10px,1.1vw,13px)!important;
  font-weight:800!important;
  line-height:1!important;
}
.shell .cv-page .cv-stepper button{
  display:flex!important;
  justify-content:center!important;
  align-items:center!important;
  min-width:0!important;
  width:100%!important;
  height:100%!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  border-radius:2px!important;
  box-shadow:none!important;
  background:transparent!important;
  color:var(--theme-deep,#69464c)!important;
  opacity:.42;
  font-size:clamp(10px,1vw,13px)!important;
  font-weight:800!important;
  line-height:1!important;
  cursor:pointer;
  transition:opacity .12s ease,background .12s ease;
}
.shell .cv-page .cv-stepper button:first-child{grid-column:1;grid-row:1}
.shell .cv-page .cv-stepper button:last-child{grid-column:3;grid-row:1}
.shell .cv-page .cv-stepper:hover button,
.shell .cv-page .cv-stepper button:focus-visible{opacity:1}
.shell .cv-page .cv-stepper button:hover{
  background:rgba(var(--theme-rgb,93,123,105),.13)!important;
}
.shell .cv-page .cv-stepper button:focus-visible{
  outline:1px solid var(--theme-deep,#526354)!important;
  opacity:1;
}
/* Impressão: sem realce de formulário, somente os dados sobre a arte. */
@media print{
  .shell .cv-page .cv-spot .cv-in,
  .shell .cv-page .cv-spot .cv-in:focus,
  .shell .cv-page .cv-spot .cv-in:hover,
  .shell .cv-page .cv-readonly,
  .shell .cv-page .cv-stepper{
    background:transparent!important;
    border:0!important;
    outline:0!important;
    box-shadow:none!important;
  }
  .shell .cv-page .cv-stepper button{visibility:hidden!important}
}


/* GUIA DE CRIAÇÃO · livro de campo em aquarela sumi-ê */
.guide-head{position:relative;display:grid;grid-template-columns:1.25fr .75fr;min-height:215px;overflow:hidden;border:1px solid #aaa99a;background:linear-gradient(118deg,#e9e2d3,#dddcd0);box-shadow:0 14px 28px #292f291b}
.guide-head-copy{position:relative;z-index:2;padding:30px clamp(20px,3vw,42px)}
.guide-head h1{font:600 clamp(28px,3vw,42px)/1.16 var(--serif);color:#2b332c;letter-spacing:-.026em;margin:10px 0 12px}
.guide-head p{font-size:13px;color:#596359;max-width:560px;line-height:1.8;margin:0}
.guide-head-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:19px}
.guide-mark,.guide-count{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid #bab4a2;font-size:11px;font-weight:700;color:#47564b;background:#e9e5d8}
.guide-count{background:#dedfcf}
.guide-head-illustration{position:relative;overflow:hidden;min-height:200px;background:linear-gradient(130deg,rgba(229,222,211,.5),var(--wash,#9caa9a))}
.guide-head-illustration img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.guide-head-illustration>span{position:absolute;right:16px;bottom:2px;color:#2e3e3542;font-size:95px;font-family:var(--serif)}
.guide-meter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}
.guide-meter-item{padding:13px 14px;background:linear-gradient(130deg,#e9e2d3,#dfddd1);border:1px solid #b5b3a5;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px}
.guide-meter-item>span{font-size:11px;color:#596357;font-weight:700}
.guide-meter-item>strong{font-size:19px;color:#303c32}
.guide-meter-item>strong small{font-size:12px;color:#778075}
.guide-meter-bar{height:4px;background:#c9c9b8;width:100%;border-radius:6px;overflow:hidden}
.guide-meter-bar i{display:block;background:var(--theme-deep,#4d6a55);height:100%;transition:width .18s ease}

.guide-layout{display:grid;grid-template-columns:minmax(225px,285px) minmax(0,1fr);align-items:start;gap:18px}
.guide-nav{display:flex;flex-direction:column;gap:2px;border:1px solid #adaf9f;background:#e3dfd2;padding:10px}
.guide-nav-title{font-size:10px;color:#7c635b;letter-spacing:.17em;font-weight:800;padding:12px 10px}

.guide-nav button:hover{background:#d5d6c8}

.guide-nav .guide-index{display:grid;place-items:center;flex:0 0 28px;width:28px;height:28px;border:1px solid #a2a99b;border-radius:50%;font-size:11px;font-weight:800}

.guide-nav .active .guide-index{border-color:#d1dccc;color:#e4ecde}
.guide-nav button>span:last-child{display:flex;flex-direction:column;gap:4px;min-width:0}

.guide-nav small{color:#737c70;font-size:10px;line-height:1.4}
.guide-nav button.active small{color:#d0d9cd}

.guide-article-kicker{font-size:11px;font-weight:800;letter-spacing:.18em;color:#8a655c}
.guide-article h2{font:600 clamp(23px,2.7vw,32px)/1.25 var(--serif);margin:11px 0 5px;color:#2d382e}
.guide-subtitle{font-size:12px;color:#7b8173;margin-bottom:24px}
.guide-rule{font-size:13px;line-height:1.9;color:#465047}
.guide-rule p{margin:0 0 17px}
.guide-rule b,.guide-rule strong{color:#2b392d}

.guide-attr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:20px 0}
.guide-attr-grid span{background:#e0dfd3;padding:10px 12px;border:1px solid #c4c4b6;font-size:11px}

.guide-where{display:flex;flex-direction:column;gap:4px}
.guide-where span{font-size:10px;font-weight:800;letter-spacing:.14em;color:#798074}
.guide-where b{font-size:12px;color:#3c4d3f}
.guide-pager{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:19px}
.guide-pager span{color:#7b8277;font-size:11px}
.guide-checklist{border:1px solid #b9bfb0;margin:16px 0}
.guide-checklist>div{display:flex;align-items:center;gap:13px;padding:11px 15px;background:#e8e4d8;border-bottom:1px solid #c8c9ba}
.guide-checklist>div:last-child{border:0}
.guide-checklist>div>span{border-radius:50%;width:26px;height:26px;flex-shrink:0;display:grid;place-items:center;border:1px solid #aeb0a1;color:#8b7663;font-weight:800}

/* REFINAMENTO DA FICHA 1/4 — substitui somente o desenho digital */
.shell .cv-page .cv-portrait{

/* O texto "Adicione sua imagem no Canva" pertence ao JPG original.

   do PNG do jogador, sem criar outro retângulo sobre a moldura. */
.shell .cv-page .cv-portrait::before{
  content:"";position:absolute;z-index:0;pointer-events:none;
  left:4%;right:4%;top:59%;height:25%;
  background:radial-gradient(ellipse 78% 82% at 50% 50%,
    #faf8f1 0%,#faf8f1 62%,rgba(250,248,241,.96) 75%,rgba(250,248,241,0) 100%);

}
.shell .cv-page .cv-portrait .cv-portrait-pick{
  inset:auto auto -28px 50%!important;
  transform:translateX(-50%)!important;
  min-width:0!important;max-width:90%!important;width:auto!important;
  min-height:0!important;height:22px!important;
  padding:2px 10px!important;
  background:rgba(250,246,237,.95)!important;

/* O retrato, e não a moldura nem os ícones, reage aos ferimentos. */
.shell .cv-page .cv-portrait.portrait-hit-wounded .cv-portrait-image,
.shell .portrait-editor-preview.portrait-hit-wounded img{
  animation:shinobi-portrait-wounded .52s cubic-bezier(.24,.72,.31,1) both!important;
  transform-origin:50% 75%;
}
.shell .cv-page .cv-portrait.portrait-hit-grave .cv-portrait-image,
.shell .portrait-editor-preview.portrait-hit-grave img{
  animation:shinobi-portrait-critical .75s cubic-bezier(.27,.12,.3,1) both!important;
  transform-origin:50% 70%;
}
.shell .cv-page .cv-portrait.portrait-hit-grave::after{
  content:"";pointer-events:none;position:absolute;
  z-index:4;inset:4% 0 7% 0;
  background:linear-gradient(121deg,transparent 43%,rgba(255,255,255,.95) 47%,rgba(164,65,68,.7) 48%,transparent 52%);
  animation:shinobi-portrait-slash .69s ease-out both;
}
@keyframes shinobi-portrait-wounded{
  0%{opacity:.55;transform:translateX(0) scale(.99);filter:brightness(1.18)}
  16%{transform:translateX(-3px) rotate(-.7deg)}
  38%{transform:translateX(3px) rotate(.6deg)}
  60%{transform:translateX(-1px);opacity:1}
  100%{opacity:1;transform:none;filter:none}
}
@keyframes shinobi-portrait-critical{
  0%{opacity:.48;transform:translateX(0);filter:contrast(1.3) brightness(1.5)}
  10%{transform:translateX(-9px) rotate(-2deg)}
  20%{transform:translateX(8px) rotate(1.7deg)}
  32%{transform:translateX(-7px) rotate(-1.3deg)}
  44%{transform:translateX(6px) rotate(1.1deg);opacity:1}
  56%{transform:translateX(-4px) rotate(-.7deg)}
  73%{transform:translateX(2px)}
  100%{transform:none;filter:none;opacity:1}
}
@keyframes shinobi-portrait-slash{
  0%{opacity:0;clip-path:inset(0 100% 0 0)}
  15%{opacity:1;clip-path:inset(0 63% 0 0)}
  46%{opacity:.9;clip-path:inset(0 0 0 0)}
  100%{opacity:0;clip-path:inset(0 0 0 0)}
}
@media(prefers-reduced-motion:reduce){

.cb-jutsu-scroll{max-height:365px;overflow:auto;overscroll-behavior:contain;padding-right:5px}
.cb-jutsu-empty{font-size:11px;line-height:1.75;color:#787d73}
.cb-actions-help{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;align-items:stretch;margin-top:16px}
.cb-help-card{border:1px solid #d5cbbd;background:#f7f4ec;padding:13px 16px}
.cb-help-card strong{font:600 14px var(--serif);color:#394839}
.cb-help-card p{font-size:10px;color:#72766c;margin:5px 0 0;line-height:1.6}
.cb-dice-icon{font-size:16px;margin-right:4px}
.cb-entry{position:fixed;inset:0;z-index:200;background:#17231eea;display:grid;place-items:center;overflow:hidden;pointer-events:auto;animation:cb-entry-fade-in .18s ease-out both}
.cb-entry::before{content:"";position:absolute;inset:0;opacity:.2;background:radial-gradient(circle at 50% 50%,#e9d9b856,transparent 60%)}
.cb-entry-badge{font:700 11px var(--sans);color:#d0c7b4;letter-spacing:.25em;position:absolute;left:0;right:0;text-align:center;top:calc(50% + 135px)}
.cb-entry-symbol{position:absolute;top:calc(50% - 165px);font:600 60px var(--serif);color:#e9d9c66e}
.cb-entry-kunai{position:absolute;width:182px;height:182px;left:calc(50% - 91px);top:calc(50% - 91px);filter:drop-shadow(0 6px 5px #07100ecc);transform-origin:50% 50%}
.cb-entry-kunai svg{display:block;width:100%;height:100%}
.cb-entry-kunai.is-left{animation:cb-kunai-left 1.03s cubic-bezier(.19,.85,.22,1) both}
.cb-entry-kunai.is-right{animation:cb-kunai-right 1.03s cubic-bezier(.19,.85,.22,1) both}
.cb-entry-impact{position:absolute;width:18px;height:18px;border:2px solid #fff4ce;border-radius:50%;box-shadow:0 0 45px 13px #eac9a088;top:50%;left:50%;transform:translate(-50%,-50%) scale(.2);animation:cb-hit-pulse 1.08s ease-out both}
.cb-entry-spark{position:absolute;left:50%;top:50%;height:3px;width:125px;transform-origin:left center;background:linear-gradient(90deg,#fff8e9,transparent);animation:cb-spark 1.08s ease-out both}
.cb-entry-spark:nth-of-type(5){transform:rotate(45deg)}
.cb-entry-spark:nth-of-type(6){transform:rotate(135deg)}
.cb-entry-spark:nth-of-type(7){transform:rotate(225deg)}
.cb-entry-spark:nth-of-type(8){transform:rotate(315deg)}
.cb-entry.is-leaving{animation:cb-entry-fade-out .28s ease-in both}
@keyframes cb-entry-fade-in{from{opacity:0}to{opacity:1}}
@keyframes cb-entry-fade-out{from{opacity:1}to{opacity:0}}
@keyframes cb-kunai-left{
  0%{transform:translate(-345px,185px) rotate(-35deg) scale(.82);opacity:0}
  16%{opacity:1}
  47%{transform:translate(-21px,11px) rotate(45deg) scale(1);opacity:1}
  57%{transform:translate(-13px,7px) rotate(46deg) scale(1.02)}
  77%{transform:translate(-130px,75px) rotate(27deg) scale(.86);opacity:1}
  100%{transform:translate(-260px,140px) rotate(15deg) scale(.67);opacity:0}
}
@keyframes cb-kunai-right{
  0%{transform:translate(345px,185px) rotate(215deg) scale(.82);opacity:0}
  16%{opacity:1}
  47%{transform:translate(21px,11px) rotate(135deg) scale(1);opacity:1}
  57%{transform:translate(13px,7px) rotate(134deg) scale(1.02)}
  77%{transform:translate(130px,75px) rotate(153deg) scale(.86);opacity:1}
  100%{transform:translate(260px,140px) rotate(165deg) scale(.67);opacity:0}
}
@keyframes cb-hit-pulse{
  0%,41%{opacity:0;transform:translate(-50%,-50%) scale(.1)}
  47%{opacity:1;transform:translate(-50%,-50%) scale(3)}
  62%{opacity:.3;transform:translate(-50%,-50%) scale(8)}
  85%,100%{opacity:0;transform:translate(-50%,-50%) scale(13)}
}
@keyframes cb-spark{
  0%,42%{opacity:0;scale:.1}
  48%{opacity:1;scale:1}
  66%{opacity:.35;scale:1.4}
  85%,100%{opacity:0;scale:1.6}
}
@media(max-width:1220px){.cb-grid{grid-template-columns:minmax(205px,1fr) minmax(270px,1.25fr)}.cb-side.right{grid-column:1/-1;grid-row:2;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.cb-center{grid-column:2;grid-row:1}.cb-side.left{grid-column:1;grid-row:1}.cb-portrait-inner,.cb-portrait-image,.cb-portrait-empty{min-height:440px;height:440px}}
@media(max-width:760px){.cb-grid{display:flex;flex-direction:column}.cb-center{order:0;width:100%}.cb-side.left{order:1;width:100%}.cb-side.right{order:2;width:100%;display:grid;grid-template-columns:1fr}.cb-portrait-inner,.cb-portrait-image,.cb-portrait-empty{height:380px;min-height:380px}.cb-top{flex-wrap:wrap}.cb-top-actions{width:100%}.cb-actions-help{grid-template-columns:1fr}.cb-portrait-overlay{padding-top:42px}}
@media(max-width:420px){.cb-portrait-inner,.cb-portrait-image,.cb-portrait-empty{height:330px;min-height:330px}.cb-entry-kunai{width:132px;height:132px;left:calc(50% - 66px);top:calc(50% - 66px)}}
@media(prefers-reduced-motion:reduce){.cb-entry,.cb-entry *{animation:none!important;transition:none!important}.cb-meter span{transition:none!important}}
@media print{.cb-entry,.cb-back,.cb-launch,.cb-roll,.cb-chakra-buttons,.cb-portrait-actions,.cb-jutsu-panel button{display:none!important}.cb-grid{display:grid;grid-template-columns:1fr 1.2fr 1fr}.cb-portrait-inner,.cb-portrait-image{height:350px;min-height:350px}.cb-top,.cb-panel,.cb-portrait-shell{box-shadow:none!important}}

  async function compressPortrait(file){
    const accepted=['image/jpeg','image/png','image/webp'];
    if(!file||!accepted.includes(file.type))throw Error('Escolha uma imagem JPG, PNG ou WebP.');
    if(!file.size||file.size>PORTRAIT_SOURCE_MAX)throw Error('Arquivo muito grande. Envie uma imagem de até 12 MB.');
    const url=URL.createObjectURL(file);
    let bitmap=null;
    try{
      bitmap=await new Promise((resolve,reject)=>{
        const img=new Image();
        img.onload=()=>resolve(img);
        img.onerror=()=>reject(new Error('Não foi possível ler essa imagem.'));
        img.src=url;
      });
      if(!bitmap.naturalWidth||!bitmap.naturalHeight)throw Error('A imagem selecionada não é válida.');
      const canvas=document.createElement('canvas');
      const ctx=canvas.getContext('2d',{alpha:true});
      if(!ctx)throw Error('Seu navegador não conseguiu preparar a imagem.');
      for(const maxSide of [900,720,560,440,320]){
        const ratio=Math.min(1,maxSide/Math.max(bitmap.naturalWidth,bitmap.naturalHeight));
        canvas.width=Math.max(1,Math.round(bitmap.naturalWidth*ratio));
        canvas.height=Math.max(1,Math.round(bitmap.naturalHeight*ratio));
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.imageSmoothingEnabled=true;
        ctx.imageSmoothingQuality='high';
        ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
        for(const quality of [.82,.7,.58,.45]){
          let data=canvas.toDataURL('image/webp',quality);
          if(!data.startsWith('data:image/webp;'))data=canvas.toDataURL('image/jpeg',quality);
          if(isImageDataUrl(data)&&data.length<=PORTRAIT_DATA_MAX)return data;
        }
      }
      throw Error('Não foi possível comprimir essa imagem. Tente outra foto.');
    }finally{URL.revokeObjectURL(url)}
  }
  async function handlePortraitSelected(file,key){
 if(!file)return;
 if(!canEditCurrent())return showToast('Você não pode editar esta ficha.',true);
 if(S.portraitBusy)return;
 const slot=portraitVariant(key||S.portraitUploadSlot).key;
 const sheet=active(),sheetId=S.sheetId;if(!sheet||!sheetId)return;
 S.portraitBusy=true;showToast('Preparando retrato '+portraitVariant(slot).label.toLowerCase()+'...');
 try{
  const data=await compressPortrait(file);
  if(S.sheetId!==sheetId||active()!==sheet||!canEditCurrent())return showToast('Abra novamente a ficha para enviar o retrato.',true);
  const prev={foto:sheet.foto,retratos:{...sheet.retratos},base:sheet.retratoBase};
  const gallery={casual:'',ninja:'',ferido:'',grave:'',...sheet.retratos};
  if(sheet.foto&&!gallery.casual)gallery.casual=sheet.foto;
  gallery[slot]=data;sheet.retratos=gallery;sheet.foto='';
  if(slot==='casual'||slot==='ninja')sheet.retratoBase=slot;
  if(new TextEncoder().encode(JSON.stringify(sheet)).length>PORTRAIT_DOCUMENT_MAX){
   sheet.foto=prev.foto;sheet.retratos=prev.retratos;sheet.retratoBase=prev.base;
   return showToast('A ficha ficou grande demais para salvar no Firebase. Tente uma foto menor ou remova outro retrato.',true);
  }
  if(S.saveTimer){clearTimeout(S.saveTimer);S.saveTimer=null}
  S.portraitPreview={sheetId,key:slot};
  render();
  const saved=await persist();
  if(saved)showToast('Retrato '+portraitVariant(slot).label.toLowerCase()+' salvo!');
  else{
   sheet.foto=prev.foto;sheet.retratos=prev.retratos;sheet.retratoBase=prev.base;
   S.portraitPreview=null;render();showToast('Não foi possível salvar o retrato.',true);
  }
 }catch(error){console.error('Upload retrato:',error);showToast(error.message||'Falha ao enviar retrato.',true)}
 finally{S.portraitBusy=false}
}

async function removePortrait(key){
 if(!canEditCurrent()||S.portraitBusy)return;
 const slot=portraitVariant(key||portraitShowing(active())).key,sheet=active(),id=S.sheetId;
 if(!sheet||!portraitOwn(sheet,slot))return;
 if(S.saveTimer){clearTimeout(S.saveTimer);S.saveTimer=null}
 const previous={foto:sheet.foto,retratos:{...sheet.retratos}};
 sheet.retratos={casual:'',ninja:'',ferido:'',grave:'',...sheet.retratos,[slot]:''};
 if(slot==='casual')sheet.foto='';
 if(S.portraitPreview?.sheetId===id&&S.portraitPreview.key===slot)S.portraitPreview=null;
 render();
 if(S.sheetId!==id||active()!==sheet)return;
 const success=await persist();
 if(success)showToast('Retrato '+portraitVariant(slot).label.toLowerCase()+' removido.');
 else{sheet.foto=previous.foto;sheet.retratos=previous.retratos;render();showToast('Não foi possível remover o retrato.',true)}
}

function themeClan(){
 const mine=(S.sheets||[]).filter(x=>x?.data?.clanId);
 if(!mine.length)return null;
 mine.sort((a,b)=>{
  const dateA=n(a.data?.criadoEm)||0,dateB=n(b.data?.criadoEm)||0;
  if(dateB!==dateA)return dateB-dateA;
  return String(b.id||'').localeCompare(String(a.id||''));
 });
 return CLANS.find(c=>c.id===mine[0].data.clanId)||null;
}
function themeStyle(){
 const clan=themeClan();
 if(!clan)return '';
 const hex=clan.color.replace('#','');
 const rgb=[0,2,4].map(i=>parseInt(hex.slice(i,i+2),16));
 const deep=rgb.map(x=>Math.round(x*.67+38*.33));
 const deepHex='#'+deep.map(x=>x.toString(16).padStart(2,'0')).join('');
 return `style="--theme-accent:${clan.color};--theme-rgb:${rgb.join(',')};--theme-deep:${deepHex};--theme-wash:${clan.wash}" data-theme="${clan.id}"`;
}

  function skills(p){const t=totals(p);return `<section class="paper-panel"><div class="flex between wrap"><div><h3 style="margin-bottom:3px">Perícias</h3><div class="panel-caption">Nível = ⌈atributo/2⌉ + pontos investidos</div></div>${budget(t.skills,currentNC().skills)}</div><div style="overflow:auto"><table class="skill-table"><thead><tr><th>Perícia</th><th>Atributo</th><th class="narrow">Base</th><th class="narrow">Pontos</th><th class="narrow">Total</th><th>Teste</th></tr></thead><tbody>${SKILLS.map(([name,attr,x])=>`<tr><td><strong>${E(name)}</strong>${x?'<br><span class="trained">TREINADA [x]</span>':''}</td><td>${attr}</td><td class="narrow">${Math.ceil(n(p.atributos[attr])/2)}</td><td class="narrow"><button data-action="skill" data-key="${E(name)}" data-delta="-1" aria-label="Diminuir ${E(name)}">−</button> &nbsp;${n(p.pericias[name])}&nbsp; <button data-action="skill" data-key="${E(name)}" data-delta="1" aria-label="Aumentar ${E(name)}">+</button></td><td class="narrow"><strong>${skillTotal(p,name)}</strong></td><td><button data-action="roll-skill" data-key="${E(name)}" ${!trained(p,name)||name==='Venefício'&&p.nc<8?'disabled title="Indisponível neste NC"':''}>2d8 + ${skillTotal(p,name)}</button></td></tr>`).join('')}</tbody></table></div><p class="panel-caption mt16">Perícias treinadas exigem ao menos 1 ponto investido. Venefício não está disponível no NC 4. O limite é de ${limit()} pontos gastos por perícia.</p></section>`}
  function combatView(p){const cs=['CC','CD','ESQ','LM'], names={CC:'Combate Corporal',CD:'Combate à Distância',ESQ:'Esquiva',LM:'Ler Movimento'};let totalShift=cs.reduce((s,k)=>s+Math.max(0,n(p.combateAjustes[k])),0);return `<div class="two-col"><div class="stack"><section class="paper-panel"><h3>Habilidades de combate</h3>${cs.map(k=>`<div class="stat-row"><span>${names[k]} <small class="muted">(base ${3+n(p.combateAjustes[k])})</small></span><strong>${combat(p,k)}</strong></div>`).join('')}<p class="panel-caption mt16">CC = base + FOR · CD = base + DES · ESQ = base + AGI · LM = base + PER</p></section><section class="paper-panel"><h3>Redistribuição de bases</h3><p class="panel-caption">Pode transferir até 2 pontos de base entre as quatro habilidades. Cada base começa em 3.</p><div class="form-grid mt16"><div class="field"><label>Retirar 1 ponto de</label><select id="shift-from">${cs.map(k=>`<option value="${k}">${names[k]}</option>`).join('')}</select></div><div class="field"><label>Adicionar 1 ponto em</label><select id="shift-to">${cs.map(k=>`<option value="${k}">${names[k]}</option>`).join('')}</select></div></div><div class="flex wrap mt16"><button class="button small" data-action="shift">Transferir 1 ponto</button><button class="button secondary small" data-action="reset-shift">Restaurar bases</button><span class="pill">${totalShift} / 2 transferências</span></div></section></div><div class="stack"><section class="paper-panel"><h3>Energias de combate</h3>${pool(p,'vit','Vitalidade',vitMax(p))}<div style="height:12px"></div>${pool(p,'chakra','Chakra',chakraMax(p))}</section><section class="paper-panel"><h3>Valores automáticos</h3><div class="stat-row"><span>Dificuldade para Esquiva</span><strong>${9+combat(p,'ESQ')}</strong></div><div class="stat-row"><span>Deslocamento / movimento</span><strong>${10+Math.ceil(n(p.atributos.AGI)/2)} m</strong></div><div class="stat-row"><span>Iniciativa</span><strong>1d8 + ${n(p.atributos.AGI)+skillTotal(p,'Prontidão')}</strong></div><div class="stat-row"><span>Precisão corpo a corpo</span><strong>${combat(p,'CC')}</strong></div><div class="stat-row"><span>Precisão à distância</span><strong>${combat(p,'CD')}</strong></div><div class="flex wrap mt16"><button class="button small" data-action="roll-combat" data-key="CC">Rolar ataque CC</button><button class="button secondary small" data-action="roll-initiative">Rolar iniciativa</button></div></section></div></div>`}
  function pool(p,key,label,max){const raw=p.recursos?.[key];const val=raw===null||raw===undefined?max:n(raw);return `<div class="pool ${key==='chakra'?'chakra':''}"><div><div class="pool-title">${label}</div><div class="pool-max">Máximo ${max}</div><div class="progress"><span style="width:${Math.max(0,Math.min(100,val/Math.max(1,max)*100))}%"></span></div></div><input type="number" data-bind="recursos.${key}" min="-99" max="9999" value="${val}" aria-label="${label} atual"></div>`}
  function itemFields(arr,i,fields){return fields.map(([label,key,type])=>type==='area'?area(label,`@${arr}.${i}.${key}`,active()[arr][i][key],2):field(label,`@${arr}.${i}.${key}`,active()[arr][i][key],type||'text')).join('')}
  function collectionEditor(arr,title,fields,note){const p=active();return `<section class="paper-panel"><div class="flex between wrap"><div><h3 style="margin-bottom:2px">${title}</h3>${note?`<div class="panel-caption">${note}</div>`:''}</div><button class="button secondary small" data-action="add-item" data-array="${arr}">+ Adicionar</button></div><div class="collection">${p[arr].length?p[arr].map((item,i)=>`<div class="collection-item"><div class="flex between"><span class="pill">REGISTRO ${String(i+1).padStart(2,'0')}</span><button class="icon-btn" data-action="remove-item" data-array="${arr}" data-index="${i}">Remover</button></div><div class="form-grid">${itemFields(arr,i,fields)}</div></div>`).join(''):`<p class="panel-caption">Nenhum registro cadastrado ainda.</p>`}</div></section>`}

  function catalogKey(value){return String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ')}
  function catalogItem(id){return LIBRARY_ENTRIES.find(x=>x.id===id)}
  function catalogPower(p,id){
    const item=catalogItem(id);if(!item)return null;
    return (p.poderes||[]).find(x=>x.catalogId===id||catalogKey(x.nome)===catalogKey(item.name))||null;
  }
  function catalogApt(p,name){return (p.aptidoes||[]).some(x=>catalogKey(x.nome)===catalogKey(name))}
  function catalogTech(p,item){return (p.jutsus||[]).find(x=>x.catalogId===item.id||catalogKey(x.nome)===catalogKey(item.name))}
  function catalogHasEffect(p,powerId,name){
    const power=catalogPower(p,powerId);
    return !!power&&(power.efeitos||[]).some(x=>catalogKey(x.nome||x)===catalogKey(name));
  }
  function catalogRequirements(p,item){
    if(item.clan&&item.clan!=='comum'&&item.clan!==p.clanId)
      return 'Restrito ao clã '+clanOf(item.clan).name+'.';
    for(const [attr,min] of Object.entries(item.attr||{}))
      if(n(p.atributos?.[attr])<min)return 'Requer '+attr+' '+min+'.';
    for(const [skill,min] of Object.entries(item.skill||{}))
      if(n(p.pericias?.[skill])<1||skillTotal(p,skill)<min)return 'Requer '+skill+' '+min+' (treinada).';
    for(const apt of item.apt||[])
      if(!catalogApt(p,apt))return 'Requer a aptidão '+apt+'.';
    return '';
  }
  function catalogGate(p,item){
    if(!p||!item)return {ok:false,reason:'Abra uma ficha primeiro.',text:'Indisponível'};
    const reason=catalogRequirements(p,item);
    if(reason)return {ok:false,reason,text:'Bloqueado'};
    const spent=totals(p).powers,budget=currentNC().powers;
    if(item.kind==='power'){
      const elemental=['doton','fuuton','katon','raiton','suiton'];
      if(elemental.includes(item.id)&&!catalogPower(p,item.id)&&n(p.atributos?.ESP)<10&&elemental.some(id=>id!==item.id&&catalogPower(p,id)))
        return {ok:false,reason:'Uma segunda afinidade básica exige Espírito 10, salvo exceções do manual.',text:'Afinidade bloqueada'};
      const owned=catalogPower(p,item.id),level=n(owned?.nivel);
      if(level>=limit())return {ok:false,reason:'Limite no NC atual: '+limit()+'.',text:'Nível máximo'};
      if(spent+1>budget)return {ok:false,reason:'Falta 1 ponto de poder.',text:'Pontos insuficientes'};
      if(!owned&&p.poderes.length>=MAX_ITEMS)return {ok:false,reason:'Limite de poderes atingido.',text:'Lista cheia'};
      return {ok:true,text:level?'Evoluir para nível '+(level+1):'Comprar nível 1'};
    }
    if(item.kind==='aptitude'){
      if(catalogApt(p,item.name))return {ok:false,reason:'Aptidão já registrada.',text:'Já aprendida'};
      if(p.aptidoes.length>=MAX_ITEMS)return {ok:false,reason:'Limite de aptidões atingido.',text:'Lista cheia'};
      const qty=p.aptidoes.filter(x=>x?.nome?.trim()).length;
      if(qty>=3&&spent+2>budget)return {ok:false,reason:'Aptidão extra custa 2 pontos de poder.',text:'Pontos insuficientes'};
      return {ok:true,text:qty<3?'Adicionar gratuitamente':'Comprar por 2 pontos'};
    }
    if(item.kind==='effect'){
      const selected=S.libraryPowerId||'ninpou',power=catalogPower(p,selected),def=catalogItem(selected);
      if(!def?.effectPower)return {ok:false,reason:'Selecione um poder de efeitos.',text:'Escolha o poder'};
      if(['katon','raiton'].includes(selected)&&item.id==='barreira')return {ok:false,reason:'Barreira não está na lista de efeitos permitidos deste elemento (manual pp. 108-109).',text:'Efeito incompatível'};
      if(!power||n(power.nivel)<1)return {ok:false,reason:'Compre o poder '+def.name+' antes.',text:'Sem poder'};
      const chosen=(power.efeitos||[]).length;
      if(chosen>=n(power.nivel))return {ok:false,reason:'Todos os níveis já têm um efeito escolhido.',text:'Sem espaço'};
      if(item.min>chosen+1)return {ok:false,reason:'Escolha primeiro o efeito do nível '+(chosen+1)+'.',text:'Nível insuficiente'};
      if(catalogHasEffect(p,selected,item.name))return {ok:false,reason:'Efeito já selecionado. Evoluções seguem regras específicas.',text:'Já escolhido'};
      return {ok:true,text:'Escolher para nível '+(chosen+1)};
    }
    if(item.kind==='jutsu'){
      if(catalogTech(p,item))return {ok:false,reason:'Já está na ficha.',text:'Já registrado'};
      if(p.jutsus.length>=MAX_ITEMS)return {ok:false,reason:'Limite de técnicas atingido.',text:'Lista cheia'};
      if(!item.free){
        const special=item.id==='goukakyuu'&&p.clanId==='uchiha'&&catalogApt(p,'Elemento Natural: Katon');
        const power=catalogPower(p,item.power);
        if(!special&&(!power||n(power.nivel)<n(item.min)))
          return {ok:false,reason:'Requer '+(catalogItem(item.power)?.name||item.power)+' nível '+item.min+'.',text:'Poder insuficiente'};
        if(item.effectNeed&&!special&&!catalogHasEffect(p,item.power,item.effectNeed))
          return {ok:false,reason:'Selecione o efeito '+item.effectNeed+' neste poder.',text:'Falta efeito'};
        if(item.id==='shikakyu-jutsu'&&!catalogApt(p,'Hakken no Jutsu'))
          return {ok:false,reason:'Requer Hakken no Jutsu.',text:'Falta aptidão'};
        if(item.id==='juujin'&&!catalogApt(p,'Companheiro Animal'))
          return {ok:false,reason:'Requer Companheiro Animal.',text:'Falta aptidão'};
        const parent=catalogItem(item.power);
        if(parent){const pr=catalogRequirements(p,parent);if(pr)return {ok:false,reason:pr,text:'Pré-requisito'};}
      }
      return {ok:true,text:item.free?'Registrar (gratuito)':'Adicionar à ficha · gratuito'};
    }
    return {ok:false,reason:'Tipo desconhecido.',text:'Indisponível'};
  }

  function syncCatalogEffectDescription(power){
    const base=String(power.descricao||'').replace(/\s*【Efeitos da biblioteca:[^】]*】/g,'').trim();
    const names=(power.efeitos||[]).map(x=>x.nome||x).filter(Boolean);
    power.descricao=base+(names.length?(base?'\n':'')+'【Efeitos da biblioteca: '+names.join(', ')+'】':'');
  }
  function forgetCatalogEffect(powerIndex,effectIndex){
    if(!canEditCurrent())return showToast('Esta ficha não está disponível para edição.',true);
    const power=active()?.poderes?.[powerIndex];
    if(!power||!Array.isArray(power.efeitos))return;
    if(effectIndex!==power.efeitos.length-1)return showToast('Remova os efeitos do mais recente para o mais antigo.',true);
    power.efeitos.splice(effectIndex,1);
    syncCatalogEffectDescription(power);
    render();scheduleSave();showToast('Último efeito removido.');
  }
  function libraryEffectsSummary(p){
    const groups=(p.poderes||[]).map((power,i)=>({power,i})).filter(({power})=>Array.isArray(power.efeitos)&&power.efeitos.length);
    if(!groups.length)return '<div class="lib-mini-notice">Os efeitos escolhidos na biblioteca aparecerão aqui e na descrição dos poderes, inclusive no modelo Canva.</div>';
    return '<section class="lib-chosen-effects"><h3>Efeitos selecionados na biblioteca</h3>'+groups.map(({power,i})=>
     '<div class="lib-chosen-group"><strong>'+E(power.nome)+' · Nv '+n(power.nivel)+'</strong><div class="lib-chosen-items">'+power.efeitos.map((effect,idx)=>
      '<div class="lib-chosen-chip"><span>'+E(effect.nome||effect)+'</span>'+
      (idx===power.efeitos.length-1?'<button type="button" data-action="library-forget-effect" data-index="'+idx+'" data-power-index="'+i+'" aria-label="Remover efeito '+E(effect.nome||effect)+'">×</button>':'')+'</div>').join('')+'</div></div>'
    ).join('')+'</section>';
  }

  function catalogLearn(id){
    const p=active(),item=catalogItem(id);
    if(!p||!canEditCurrent())return showToast('Abra uma ficha com permissão de edição.',true);
    const gate=catalogGate(p,item);if(!gate.ok)return showToast(gate.reason,true);
    if(item.kind==='power'){
      const owned=catalogPower(p,item.id);
      if(owned)owned.nivel=n(owned.nivel)+1;
      else p.poderes.push({id:randomId(),nome:item.name,nivel:1,descricao:item.desc,catalogId:item.id,efeitos:[]});
      if(item.effectPower){S.libraryPowerId=item.id;S.libraryKind='effect';S.inlineKind='effect';S.inlineSearch='';}
    }else if(item.kind==='aptitude'){
      p.aptidoes.push({id:randomId(),nome:item.name,tipo:item.clan==='comum'?'Geral':'Clã: '+clanOf(item.clan).name,catalogId:item.id});
    }else if(item.kind==='effect'){
      const power=catalogPower(p,S.libraryPowerId);
      if(!power)return showToast('Escolha um poder.',true);
      if(!Array.isArray(power.efeitos))power.efeitos=[];
      power.efeitos.push({nome:item.name,nivelEscolha:power.efeitos.length+1,catalogId:item.id});
      syncCatalogEffectDescription(power);
    }else if(item.kind==='jutsu'){
      const special=item.id==='goukakyuu'&&p.clanId==='uchiha'&&catalogApt(p,'Elemento Natural: Katon');
      p.jutsus.push({id:randomId(),nome:item.name,nivel:item.free?0:(special?4:n(item.min)||1),
        acao:item.action||'',duracao:'',alvo:'',alcance:item.range||'',efeito:item.desc,
        origemPoder:item.power||'',catalogId:item.id,rank:item.rank||'',custoChakra:item.cost||'Ver descrição do poder',custo:/^\d+$/.test(String(item.cost??''))?Number(item.cost):''});
    }
    scheduleSave();render();
    showToast((item.kind==='power'?'Poder atualizado: ':item.kind==='effect'?'Efeito selecionado: ':'Registrado: ')+item.name);
  }


  /* Biblioteca integrada: dados salvos na ficha, sem novas coleções Firebase. */
  function integratedCost(record,item){
    const official=String(item?.cost??'').trim();
    if(official)return /^\d+$/.test(official)?Number(official):null;
    // Campo numérico da ficha Canva e da continuação.
    const typed=String(record?.custo??'').trim();
    if(/^\d+$/.test(typed))return Number(typed);
    const note=String(record?.custoChakra??'').trim();
    if(note)return /^\d+$/.test(note)?Number(note):null;
    return n(record?.nivel)>0?n(record.nivel):null;
  }
  function integratedBlock(p,record){
    const item=catalogItem(record.catalogId);
    if(!item||item.kind!=='jutsu')return '';
    const shadow={...p,jutsus:(p.jutsus||[]).filter(j=>j!==record)};
    const state=catalogGate(shadow,item);
    return state.ok?'':state.reason;
  }
  function integratedUse(index){
    const p=active();
    if(!p||!canEditCurrent())return showToast('Ficha sem permissão de edição.',true);
    const j=p.jutsus?.[index];
    if(!j)return showToast('Jutsu não encontrado.',true);
    const error=integratedBlock(p,j);
    if(error)return showToast('Pré-requisito não atendido: '+error,true);
    const item=catalogItem(j.catalogId);
    let cost=integratedCost(j,item);
    if(cost===null){
      const input=document.querySelector('[data-integrated-cost="'+index+'"]');
      if(!input||input.value.trim()==='')return showToast('Informe o custo variável de Chakra.',true);
      cost=Number(input.value);
    }
    if(!Number.isInteger(cost)||cost<0||cost>999)return showToast('Custo de Chakra inválido.',true);
    const chakra=p.recursos?.chakra===null||p.recursos?.chakra===undefined||p.recursos?.chakra===''?chakraMax(p):n(p.recursos.chakra);
    if(chakra<cost)return showToast('Chakra insuficiente: '+chakra+' disponível.',true);
    p.recursos={...p.recursos,chakra:chakra-cost};
    scheduleSave();render();showToast(j.nome+': −'+cost+' Chakra.');
  }
  function integratedKnown(p){
    const list=(p.jutsus||[]).filter(x=>String(x.nome||'').trim());
    const chakra=p.recursos?.chakra===null||p.recursos?.chakra===undefined||p.recursos?.chakra===''?chakraMax(p):n(p.recursos.chakra);
    return `<section class="int-known"><header><div><b>Técnicas do meu personagem</b><small>Use as técnicas durante a sessão e consulte os efeitos.</small></div><strong>Chakra: ${chakra} / ${chakraMax(p)}</strong></header>
      ${list.length?list.map(j=>{
        const i=p.jutsus.indexOf(j),item=catalogItem(j.catalogId),cost=integratedCost(j,item),error=integratedBlock(p,j);
        return `<article class="int-known-row"><div><b>${E(j.nome)}</b><small>${E(j.acao||item?.action||'Ação conforme manual')} · ${E(j.alcance||item?.range||'Alcance conforme manual')} · ${cost===null?'custo variável':cost+' Chakra'}</small>
        ${error?`<small class="int-alert">⚠ ${E(error)}</small>`:''}
        <details><summary>Descrição e regras</summary><p>${E(j.efeito||item?.desc||'Consulte a descrição oficial.')}</p>${item?.page?`<small>Referência: Shinobi no Sho 4.1b, página ${item.page}</small>`:''}</details></div>
        <aside>${cost===null?`<input type="number" min="0" max="999" step="1" placeholder="Chakra" aria-label="Custo em Chakra" data-integrated-cost="${i}">`:''}
        <button type="button" class="button small" data-action="integrated-use" data-index="${i}" ${error?'disabled':''}>${cost===null?'Usar jutsu':'Usar · −'+cost}</button></aside></article>`;
      }).join(''):'<p class="int-hint">Nenhum jutsu registrado. Escolha a aba Jutsus para adicioná-los.</p>'}</section>`;
  }
  function integratedFilter(){
    const query=catalogKey(S.inlineSearch||'');let count=0;
    document.querySelectorAll('[data-int-card]').forEach(el=>{
      const yes=!query||String(el.dataset.intCard||'').includes(query);
      el.hidden=!yes;if(yes)count++;
    });
    document.querySelectorAll('[data-int-count]').forEach(el=>el.textContent=count+' resultado(s)');

async function unlockAdmin(form){
 if(S.adminAuthBusy||!canAdmin()||!fb?.auth?.currentUser)return showToast('Acesso administrativo indisponível.',true);
 const password=String(new FormData(form).get('password')||'');
 if(!password)return;
 const currentUser=fb.auth.currentUser;
 S.adminAuthBusy=true;
 const button=form.querySelector('button[type="submit"]');
 if(button){button.disabled=true;button.textContent='Verificando…'}
 try{
   if(!currentUser.email)throw Error('Identificador de login indisponível.');
   const credential=fb.EmailAuthProvider.credential(currentUser.email,password);
   await fb.reauthenticateWithCredential(currentUser,credential);
   const admin=await fb.getDoc(fb.doc(fb.db,'admins',currentUser.uid));
   if(!admin.exists()&&currentUser.email!==MASTER_EMAIL){S.isAdmin=false;throw Error('A conta não possui permissão administrativa.')}
   S.adminUnlocked=true;
   await refreshAdmin();
 }catch(err){
   S.adminUnlocked=false;
   const msg=err.code==='auth/wrong-password'||err.code==='auth/invalid-credential'?'Senha incorreta.':err.code==='auth/too-many-requests'?'Muitas tentativas. Tente novamente mais tarde.':err.code==='auth/network-request-failed'?'Não foi possível conectar ao Firebase.':err.message==='A conta não possui permissão administrativa.'?err.message:'Falha ao validar a senha do administrador.';
   console.error('Erro de autenticação administrativa:',err.code||'verificação');
   showToast(msg,true);
 }finally{S.adminAuthBusy=false;if(button?.isConnected){button.disabled=false;button.textContent='Desbloquear painel'}}
}

 for(const [path,label] of [['nome','Nome'],['nc','NC'],['graduacao','Graduação'],['recursos.vit','Vitalidade'],['recursos.chakra','Chakra']]){
  const a=getAt(before,path),b=getAt(after,path);
  if(String(a??'')!==String(b??''))return label+': '+String(a??'—').slice(0,30)+' → '+String(b??'—').slice(0,30);
 }
 for(const [key,name] of ATTRS)if(n(before.atributos?.[key])!==n(after.atributos?.[key]))return name+': '+n(before.atributos?.[key])+' → '+n(after.atributos?.[key]);

 return 'Dados da ficha atualizados';
}

function startAdminLive(){
 if(!fb||!canAdmin()||!S.adminUnlocked||S.adminUnsubscribe)return;
 S.adminLive=false;S.adminLiveError=false;S.adminLiveReady=false;
 S.adminUnsubscribe=fb.onSnapshot(fb.collection(fb.db,'fichas'),snapshot=>{
   if(!canAdmin()||!S.adminUnlocked)return;
   const previous=new Map(S.adminSheets.map(x=>[x.__id,x]));
   const next=snapshot.docs.map(d=>({...d.data(),__id:d.id}));
   if(S.adminLiveReady){
     for(const change of snapshot.docChanges()){
       const after=change.doc.data(),before=previous.get(change.doc.id);
       if(S.lastSavedWrite?.id===change.doc.id&&n(S.lastSavedWrite?.stamp)===n(after?.atualizadoEm))continue;
       S.adminEvents.unshift({nome:after.nome||before?.nome||'Personagem',resumo:describeSheetChange(before,after,change.type),hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})});
     }
     S.adminEvents=S.adminEvents.slice(0,20);
   }
   S.adminLiveReady=true;S.adminLive=true;S.adminLiveError=false;S.adminSheets=next;
   if(S.adminViewing&&S.sheetId){
     const remote=next.find(x=>x.__id===S.sheetId);
     if(remote&&n(remote.atualizadoEm)!==n(S.sheet?.atualizadoEm)){
       const own=S.lastSavedWrite?.id===S.sheetId&&n(S.lastSavedWrite?.stamp)===n(remote.atualizadoEm);
       if(!own){
         const focus=!!document.activeElement?.matches?.('[data-bind],[data-cv-array],[data-cv-skill],input,textarea,select');
         if(focus||S.locallyDirty||S.saveTimer||S.isSaving){
           S.pendingRemote=remote;const label=$('#admin-sheet-sync');
           if(label){label.textContent='Alteração externa recebida · clique para atualizar';label.classList.add('has-update')}
         }else{S.sheet=normalize(remote);S.pendingRemote=null;render()}
       }else S.sheet.atualizadoEm=remote.atualizadoEm;
     }
   }
   showAdminLiveUI();
 },error=>{
   console.error('Firestore ao vivo:',error.code||error);
   S.adminLive=false;S.adminLiveError=true;
   if(S.adminUnsubscribe){try{S.adminUnsubscribe()}catch(_){}S.adminUnsubscribe=null}
   showAdminLiveUI();showToast('A sincronização do mestre foi interrompida. Confira as regras do Firestore.',true);
 });
 showAdminLiveUI();
}

function guideStepDone(i,p,t,r){
 const c=p.aptidoes.filter(a=>a?.nome?.trim()).length;
 if(i===0)return !!String(p.nome||'').trim();
 if(i===1)return !!NC_TABLE[p.nc];
 if(i===2)return t.attrs===r.attrs&&ATTRS.every(([k])=>n(p.atributos[k])>=r.min);
 if(i===3)return true;
 if(i===4)return t.skills===r.skills;
 if(i===5)return t.social===r.social;
 if(i===6)return c>=3;
 if(i===7)return t.powers===r.powers;
 if(i===8)return true;
 if(i===9)return !!String(p.historia||'').trim();
 if(i===10)return [0,2,4,5,6,7].every(k=>guideStepDone(k,p,t,r));
 return false;
}

  function cvWrap(inner,x,y,w,h,extraClass=''){

function cvInput(path,value,x,y,w,h,opts={}){
  const num=opts.num?'type="number" step="1"':'type="text"';
  const val=E(value??'');
  const label=E(opts.label||path);
  let element=opts.multiline?
    `<textarea class="cv-in" data-bind="${E(path)}" aria-label="${label}">${val}</textarea>`:
    `<input class="cv-in" data-bind="${E(path)}" ${num} value="${val}" aria-label="${label}" autocomplete="off">`;
  return cvWrap(element,x,y,w,h,opts.social?'cv-social-spot':'');
}
function cvArray(p,array,i,key,x,y,w,h,opts={}){
  const v=p[array]?.[i]?.[key]??'';
  const extra=`data-cv-array="${E(array)}" data-cv-index="${i}" data-cv-key="${E(key)}"`;
  const field=opts.multiline?`<textarea class="cv-in" ${extra} aria-label="${E(array+' '+key)}">${E(v)}</textarea>`:
    `<input class="cv-in" ${extra} ${opts.num?'type="number" step="1"':'type="text"'} value="${E(v)}" aria-label="${E(array+' '+key)}">`;
  return cvWrap(field,x,y,w,h);
}

function adjustSocial(key,delta){
 if(!canEditCurrent()||!['Carisma','Manipulacao'].includes(key))return;
 const p=active(),old=n(p.sociais?.[key]);
 if(delta===0)return;
 const next=old+delta;
 if(next<0||next>limit())return showToast('O limite de cada atributo social é metade do NC.',true);
 if(delta>0&&totals(p).social>=currentNC().social)return showToast('Você já distribuiu todos os pontos sociais.',true);
 p.sociais[key]=next;
 render();scheduleSave();
}

  const SHINOBI_SFX={
    menu:{url:'assets/audio/menu-transition.ogg',volume:.66},
    wounded:{url:'assets/audio/injury-wounded.ogg',volume:.74},
    critical:{url:'assets/audio/injury-critical.ogg',volume:.8},

  const soundTracks=new Map();
  function playSfx(kind){
    const spec=SHINOBI_SFX[kind];if(!spec)return;
    if(kind==='healing'){
      // Retratos de cura são eventos raros: abrir uma instância nova mantém a
      // reprodução ligada ao clique de Vitalidade, mesmo após cache de erro.
      const attempt=(url,allowFallback)=>{
        try{
          const sound=new Audio(url);
          sound.preload='auto';
          sound.muted=false;
          sound.volume=spec.volume;
          const started=sound.play();
          if(started?.catch)started.catch(error=>{
            console.warn('Áudio de cura não iniciou:',url,error);
            if(allowFallback&&spec.fallback)attempt(spec.fallback,false);
          });
        }catch(error){
          console.warn('Erro no áudio de cura:',url,error);
          if(allowFallback&&spec.fallback)attempt(spec.fallback,false);
        }
      };
      return attempt(spec.url,true);
    }
    try{
      let sound=soundTracks.get(kind);
      if(!sound){sound=new Audio(spec.url);sound.preload='auto';sound.volume=spec.volume;soundTracks.set(kind,sound)}
      sound.pause();sound.currentTime=0;
      const started=sound.play();
      if(started?.catch)started.catch(error=>console.warn('Áudio não iniciou:',kind,error));
    }catch(err){console.warn('Som indisponível:',kind,err)}
  }

  document.addEventListener('input',ev=>{const el=ev.target;if(el.matches('[data-int-search]')){S.inlineSearch=el.value;integratedFilter();return}if(el.matches('[data-library-search]')){S.librarySearch=el.value;librarySearchFilter();return}if(el.id==='admin-filter'){const q=el.value.toLocaleLowerCase('pt-BR');$('#admin-rows').innerHTML=adminRows(S.adminSheets.filter(x=>[x.nome,x.usuario,clanOf(x.clanId).name].some(z=>String(z||'').toLocaleLowerCase('pt-BR').includes(q))));return}if(el.dataset.cvArray){canvaUpdateArray(el,true);return}if(el.dataset.cvSkill){updateCanvaSkill(el,true);return}if(!el.dataset.bind||el.tagName==='SELECT')return;const current=active(),path=el.dataset.bind,old=getAt(current,path.startsWith('@')?path.slice(1):path);if(!updateValue(path,el.value)){el.value=old??''}else refreshGuideFeedback()});
  document.addEventListener('change',ev=>{const el=ev.target;if(el.matches('[data-library-power]')){S.libraryPowerId=el.value;render();return}if(el.matches('[data-library-scope]')){S.libraryScope=el.value;render();return}if(el.matches('[data-portrait-file]')){const file=el.files?.[0];el.value='';void handlePortraitSelected(file,S.portraitUploadSlot);return}if(el.dataset.cvArray){canvaUpdateArray(el);return}if(el.dataset.cvSkill){updateCanvaSkill(el);return}if(!el.dataset.bind||el.tagName!=='SELECT')return;updateValue(el.dataset.bind,el.value)});
  async function startFirebase(){try{const base=`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;const [{initializeApp},{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,reauthenticateWithCredential,EmailAuthProvider},{getFirestore,doc,getDoc,setDoc,deleteDoc,collection,getDocs,query,where,onSnapshot}]=await Promise.all([import(base+'/firebase-app.js'),import(base+'/firebase-auth.js'),import(base+'/firebase-firestore.js')]);const app=initializeApp(FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);fb={auth,db,doc,getDoc,setDoc,deleteDoc,collection,getDocs,query,where,onSnapshot,reauthenticateWithCredential,EmailAuthProvider,signOut,createUserWithEmailAndPassword,signInWithEmailAndPassword};onAuthStateChanged(auth,async(user)=>{clearTimeout(S.saveTimer);if(!user){stopAdminLive();S.adminUnlocked=false;S.adminAuthBusy=false;S.adminLoginBusy=false;S.adminSheets=[];S.user=null;S.isAdmin=false;S.sheet=null;S.sheetId=null;S.sheets=[];S.adminViewing=false;S.loading=false;S.view='login';render();return}const fallback=user.email?.split('@')[0]||'Shinobi';S.user={uid:user.uid,displayName:fallback};try{const [profile,admin,found]=await Promise.all([getDoc(doc(db,'users',user.uid)),getDoc(doc(db,'admins',user.uid)),getDocs(query(collection(db,'fichas'),where('ownerUid','==',user.uid)))]);if(profile.exists())S.user.displayName=profile.data().username||fallback;S.isAdmin=admin.exists()||user.email===MASTER_EMAIL;if(user.email===MASTER_EMAIL)S.adminUnlocked=true;S.sheets=found.docs.map(d=>({id:d.id,data:normalize(d.data())}));const first=ownSheets()[0];S.sheet=first?.data||null;S.sheetId=first?.id||null;S.adminViewing=false;S.loading=false;if(S.adminUnlocked&&S.isAdmin)startAdminLive();S.view=S.adminUnlocked&&S.isAdmin?'admin':S.authPane==='admin'?'login':'home';render()}catch(e){console.error(e);S.loading=false;S.view='home';render();showToast('Conta conectada, mas houve um erro ao carregar os dados. Confira as regras do Firestore.',true)}})}catch(e){console.error(e);S.loading=false;S.view='login';render();showToast('Falha ao inicializar Firebase. Confira as chaves e o domínio autorizado.',true)}}
  if(CONFIGURED)startFirebase();else{S.loading=false;render()}
</script>
