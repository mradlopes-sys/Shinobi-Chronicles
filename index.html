  .cv-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0 16px}

/* Abertura da ficha: pincelada curta, papel japonês e selo, sem bloquear a navegação */
.shinobi-entrance{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;isolation:isolate;opacity:0;pointer-events:auto;transition:opacity .26s ease-out}
.shinobi-entrance:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 48% 48% at 50% 50%,rgba(224,212,188,.96),rgba(213,206,187,.95) 66%,rgba(39,57,46,.87));clip-path:circle(0% at 50% 50%);transition:clip-path .42s cubic-bezier(.16,.7,.31,1);box-shadow:0 0 70px #3548374d inset}
.shinobi-entrance:after{content:"";position:absolute;inset:0;opacity:.2;pointer-events:none;background:repeating-linear-gradient(110deg,transparent 0 6px,rgba(53,70,56,.1) 7px,transparent 8px 16px)}
.shinobi-entrance.is-opening{opacity:1}
.shinobi-entrance.is-opening:before{clip-path:circle(85% at 50% 50%)}
.shinobi-entrance-ink{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:11px;opacity:0;transform:translateY(15px) scale(.94);transition:opacity .28s ease .10s,transform .32s ease .10s;text-align:center;color:#27392f}
.shinobi-entrance.is-opening .shinobi-entrance-ink{opacity:1;transform:translateY(0) scale(1)}
.shinobi-entrance-symbol{display:grid;place-items:center;border:2px solid #ad6d64;border-radius:50%;width:75px;height:75px;font:700 39px var(--serif);color:#864e4b;background:rgba(254,248,235,.3)}
.shinobi-entrance-title{font-size:11px;font-weight:800;letter-spacing:.21em}
.shinobi-entrance-ink small{font-size:12px;letter-spacing:.03em;color:#606b60}
.shinobi-entrance.is-closing{opacity:0;pointer-events:none;transition:opacity .36s ease}
.shinobi-entrance.is-closing .shinobi-entrance-ink{opacity:0;transform:translateY(-9px)}
@media(prefers-reduced-motion:reduce){
 .shinobi-entrance,.shinobi-entrance:before,.shinobi-entrance-ink{transition-duration:.01s!important}
}

.cv-portrait.has-image:hover .cv-portrait-pick,.cv-portrait.has-image .cv-portrait-pick:focus-visible{opacity:1}
.cv-portrait-remove{position:absolute;top:5px;right:6px;width:28px;height:28px;border:1px solid #eee0d0;border-radius:50%;background:#693b3bdd;color:white;font-size:20px;line-height:1;cursor:pointer}

@media(max-width:700px){.cv-portrait-pick{font-size:10px}.portrait-editor{align-items:flex-start}.portrait-editor-preview{width:80px;height:108px;flex-basis:80px}}

/* ============================================================
   CANVA — CORREÇÃO DE SOBREPOSIÇÃO DOS CAMPOS DIGITAIS
   As caixas já estão desenhadas nas 48 páginas originais.
   Os controles HTML devem exibir somente os valores, sem
   criar um segundo retângulo sobre cada caixa da ilustração.
   ============================================================ */
.shell .cv-page .cv-spot{
  box-sizing:border-box;
  z-index:3;
  overflow:visible;
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
}
.shell .cv-page .cv-spot .cv-in,
.shell .cv-page .cv-spot input.cv-in,
.shell .cv-page .cv-spot select.cv-in,
.shell .cv-page .cv-spot textarea.cv-in{
  box-sizing:border-box!important;
  width:100%!important;
  height:100%!important;
  min-width:0!important;
  max-width:100%!important;
  margin:0!important;
  padding:1px 2px!important;
  display:block!important;
  border:1px solid transparent!important;
  border-radius:2px!important;
  background:transparent!important;
  background-image:none!important;
  box-shadow:none!important;
  color:#322c2a!important;
  font-family:"DM Sans",Arial,sans-serif!important;
  font-size:clamp(9px,1vw,12px)!important;
  font-weight:600!important;
  line-height:1.12!important;
  letter-spacing:0!important;
  text-align:center!important;
  text-overflow:clip;
  outline:0!important;
  transition:background-color .14s ease,box-shadow .14s ease;
  -webkit-appearance:none;
  appearance:none;
}
.shell .cv-page .cv-spot textarea.cv-in{
  padding:2px 4px!important;
  text-align:left!important;
  line-height:1.25!important;
  overflow:auto;
  resize:none;
  white-space:pre-wrap;
}
.shell .cv-page .cv-spot select.cv-in{
  cursor:pointer;
  text-align-last:center;
  padding-right:1px!important;
}
.shell .cv-page .cv-spot input[type="number"]{
  -moz-appearance:textfield!important;
  appearance:textfield!important;
}
.shell .cv-page .cv-spot input[type="number"]::-webkit-outer-spin-button,
.shell .cv-page .cv-spot input[type="number"]::-webkit-inner-spin-button{
  -webkit-appearance:none!important;
  appearance:none!important;
  margin:0!important;
  display:none!important;
}
/* Indicação delicada apenas ao interagir: as molduras originais
   continuam visíveis por baixo, sem blocos brancos duplicados. */
.shell .cv-page .cv-spot:hover .cv-in{
  border-color:rgba(83,75,63,.22)!important;
  background:rgba(245,239,226,.26)!important;
  box-shadow:inset 0 0 0 1px rgba(109,102,81,.06)!important;
}
.shell .cv-page .cv-spot .cv-in:focus,
.shell .cv-page .cv-spot .cv-in:focus-visible{
  border-color:var(--theme-deep,#526354)!important;
  outline:0!important;
  background:rgba(248,242,229,.94)!important;
  box-shadow:0 0 0 2px rgba(47,63,51,.18)!important;
  position:relative;
  z-index:6;
}
.shell .cv-page .cv-spot:focus-within{z-index:8}
/* Valores calculados: só números e texto, sem um quadrado extra. */
.shell .cv-page .cv-readonly{
  box-sizing:border-box!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  width:100%!important;
  height:100%!important;
  padding:0 2px!important;
  margin:0!important;
  background:transparent!important;
  border:none!important;
  box-shadow:none!important;
  color:#3c3631!important;
  font-weight:800!important;
  font-size:clamp(9px,1.05vw,12px)!important;
  line-height:1.1!important;
  text-align:center!important;
  white-space:nowrap;
}
/* Ajuste de atributo: não esconder o número com três caixas. */
.shell .cv-page .cv-stepper{
  display:grid!important;
  grid-template-columns:minmax(0,1fr) minmax(0,1.45fr) minmax(0,1fr);
  align-items:center!important;
  justify-items:stretch!important;
  width:100%!important;
  height:100%!important;
  margin:0!important;
  padding:0!important;
  gap:0!important;
  border:0!important;
  background:transparent!important;
  box-shadow:none!important;
  color:#4e3537!important;
}
.shell .cv-page .cv-stepper b{
  grid-column:2;
  grid-row:1;
  display:block!important;
  min-width:0;
  width:100%;
  text-align:center!important;
  font-size:clamp(10px,1.1vw,13px)!important;
  font-weight:800!important;
  line-height:1!important;
}
.shell .cv-page .cv-stepper button{
  display:flex!important;
  justify-content:center!important;
  align-items:center!important;
  min-width:0!important;
  width:100%!important;
  height:100%!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  border-radius:2px!important;
  box-shadow:none!important;
  background:transparent!important;
  color:var(--theme-deep,#69464c)!important;
  opacity:.42;
  font-size:clamp(10px,1vw,13px)!important;
  font-weight:800!important;
  line-height:1!important;
  cursor:pointer;
  transition:opacity .12s ease,background .12s ease;
}
.shell .cv-page .cv-stepper button:first-child{grid-column:1;grid-row:1}
.shell .cv-page .cv-stepper button:last-child{grid-column:3;grid-row:1}
.shell .cv-page .cv-stepper:hover button,
.shell .cv-page .cv-stepper button:focus-visible{opacity:1}
.shell .cv-page .cv-stepper button:hover{
  background:rgba(var(--theme-rgb,93,123,105),.13)!important;
}
.shell .cv-page .cv-stepper button:focus-visible{
  outline:1px solid var(--theme-deep,#526354)!important;
  opacity:1;
}
/* Impressão: sem realce de formulário, somente os dados sobre a arte. */
@media print{
  .shell .cv-page .cv-spot .cv-in,
  .shell .cv-page .cv-spot .cv-in:focus,
  .shell .cv-page .cv-spot .cv-in:hover,
  .shell .cv-page .cv-readonly,
  .shell .cv-page .cv-stepper{
    background:transparent!important;
    border:0!important;
    outline:0!important;
    box-shadow:none!important;
  }
  .shell .cv-page .cv-stepper button{visibility:hidden!important}
}

.shell .cv-page .cv-portrait{

/* O texto "Adicione sua imagem no Canva" pertence ao JPG original.

   do PNG do jogador, sem criar outro retângulo sobre a moldura. */
.shell .cv-page .cv-portrait::before{
  content:"";position:absolute;z-index:0;pointer-events:none;
  left:4%;right:4%;top:59%;height:25%;
  background:radial-gradient(ellipse 78% 82% at 50% 50%,

}
.shell .cv-page .cv-portrait .cv-portrait-pick{
  inset:auto auto -28px 50%!important;
  transform:translateX(-50%)!important;
  min-width:0!important;max-width:90%!important;width:auto!important;
  min-height:0!important;height:22px!important;
  padding:2px 10px!important;
  background:rgba(250,246,237,.95)!important;

/* O retrato, e não a moldura nem os ícones, reage aos ferimentos. */
.shell .cv-page .cv-portrait.portrait-hit-wounded .cv-portrait-image,
.shell .portrait-editor-preview.portrait-hit-wounded img{
  animation:shinobi-portrait-wounded .52s cubic-bezier(.24,.72,.31,1) both!important;
  transform-origin:50% 75%;
}
.shell .cv-page .cv-portrait.portrait-hit-grave .cv-portrait-image,
.shell .portrait-editor-preview.portrait-hit-grave img{
  animation:shinobi-portrait-critical .75s cubic-bezier(.27,.12,.3,1) both!important;
  transform-origin:50% 70%;
}
.shell .cv-page .cv-portrait.portrait-hit-grave::after{
  content:"";pointer-events:none;position:absolute;
  z-index:4;inset:4% 0 7% 0;
  background:linear-gradient(121deg,transparent 43%,rgba(255,255,255,.95) 47%,rgba(164,65,68,.7) 48%,transparent 52%);
  animation:shinobi-portrait-slash .69s ease-out both;
}
@keyframes shinobi-portrait-wounded{
  0%{opacity:.55;transform:translateX(0) scale(.99);filter:brightness(1.18)}
  16%{transform:translateX(-3px) rotate(-.7deg)}
  38%{transform:translateX(3px) rotate(.6deg)}
  60%{transform:translateX(-1px);opacity:1}
  100%{opacity:1;transform:none;filter:none}
}
@keyframes shinobi-portrait-critical{
  0%{opacity:.48;transform:translateX(0);filter:contrast(1.3) brightness(1.5)}
  10%{transform:translateX(-9px) rotate(-2deg)}
  20%{transform:translateX(8px) rotate(1.7deg)}
  32%{transform:translateX(-7px) rotate(-1.3deg)}
  44%{transform:translateX(6px) rotate(1.1deg);opacity:1}
  56%{transform:translateX(-4px) rotate(-.7deg)}
  73%{transform:translateX(2px)}
  100%{transform:none;filter:none;opacity:1}
}
@keyframes shinobi-portrait-slash{
  0%{opacity:0;clip-path:inset(0 100% 0 0)}
  15%{opacity:1;clip-path:inset(0 63% 0 0)}
  46%{opacity:.9;clip-path:inset(0 0 0 0)}
  100%{opacity:0;clip-path:inset(0 0 0 0)}
}
@media(prefers-reduced-motion:reduce){

/* Fichas Canva: continuação responsiva e impressa para todos os clãs */
.cv-appendix-container{max-width:828px;margin:28px auto 24px;color:#30362f}
.cv-appendix-intro{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:0 0 15px}

.cv-appendix-intro p{font-size:12px;line-height:1.7;color:#687065;margin:0}
.cv-appendix-counter{border:1px solid #d5cab9;padding:11px 14px;white-space:nowrap;background:#f3eee5;display:grid;gap:3px;text-align:center}
.cv-appendix-counter span{font-weight:700;font-size:13px}.cv-appendix-counter small{font-size:10px;color:#777}
.cv-appendix-paper{position:relative;isolation:isolate;width:100%;min-height:880px;margin:0 0 21px;padding:34px clamp(18px,4.1vw,39px) 23px;border:1px solid #d7cabc;box-shadow:0 10px 29px #1d272019;background:radial-gradient(ellipse 60% 33% at 96% 0%,var(--cv-wash),transparent 77%),radial-gradient(ellipse 55% 40% at 0 96%,#bfc6b530,transparent 76%),linear-gradient(120deg,#f3eee7,#fffaf4 48%,#eee6dc)}
.cv-appendix-paper:before{content:"";position:absolute;inset:10px;border:1px solid #d0c4b5;pointer-events:none;opacity:.68;z-index:-1}

.cv-appendix-paper-head p{color:#73736b;font-size:11px;margin:0;line-height:1.6}
.cv-appendix-folio{border:1px solid #bcb6a7;color:#6e695d;font:600 13px var(--serif);padding:10px 14px;white-space:nowrap}
.cv-appendix-ledgers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}
.cv-appendix-ledger{min-width:0;background:#fffdf8c9;border:1px solid #d9d0c3;padding:13px}
.cv-appendix-ledger>header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e3ddd2;padding-bottom:9px;margin-bottom:8px}
.cv-appendix-ledger>header span{font-size:8px;letter-spacing:.15em;color:var(--cv-accent)}
.cv-appendix-ledger>header h4{font:600 16px var(--serif);margin:3px 0}.cv-appendix-ledger>header b{font:600 16px var(--serif);color:var(--cv-accent)}
.cv-ledger-entry{display:flex;align-items:start;gap:5px;border-bottom:1px solid #e6e1d8;padding:8px 0}
.cv-ledger-entry>small{padding-top:19px;font-size:9px;color:#9b968b}
.cv-ledger-fields{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 61px;gap:6px;min-width:0}
.cv-ledger-fields .cv-appendix-field.wide{grid-column:1/-1}
.cv-appendix-field{display:grid;align-content:start;gap:4px;min-width:0;font-size:9px;color:#767469}
.cv-appendix-field span{text-transform:uppercase;letter-spacing:.055em;font-weight:700}
.cv-appendix-field input,.cv-appendix-field textarea{display:block;box-sizing:border-box;width:100%;min-width:0;background:#fffefa;border:1px solid #d6d0c7;border-radius:2px;color:#313630;padding:7px 8px;font-size:12px;font-family:var(--sans);line-height:1.4}
.cv-appendix-field input:focus,.cv-appendix-field textarea:focus{outline:1px solid var(--cv-accent);border-color:var(--cv-accent)}
.cv-appendix-field textarea{min-height:80px;resize:vertical}
.cv-appendix-remove{border:0;background:transparent;color:#9c645d;font-size:10px;white-space:nowrap;padding:5px;cursor:pointer}
.cv-appendix-remove:hover{color:#782f2c;background:#eedfda}
.cv-appendix-muted{font-size:11px;color:#858078;padding:8px 0}
.cv-appendix-add{border:1px solid #c2bbae;color:#4a5d4c;background:#f6f2ea;padding:8px 10px;font-size:10px;font-weight:700;cursor:pointer}
.cv-appendix-add:hover{background:#e9e6dc}
.cv-appendix-ledger>.cv-appendix-add{margin-top:10px;width:100%}
.cv-appendix-section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;border-bottom:1px solid #d8d1c6;padding-bottom:11px;margin:20px 0 14px}
.cv-appendix-section-head span{font-size:9px;letter-spacing:.14em;color:var(--cv-accent);font-weight:800}
.cv-appendix-section-head h4{font:600 18px var(--serif);margin:5px 0}
.cv-appendix-section-head p{font-size:10px;color:#72756c;margin:0;line-height:1.6}
.cv-appendix-jutsu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:13px}
.cv-appendix-jutsu{min-width:0;background:#fffefaee;border:1px solid #d9d1c5;padding:13px;break-inside:avoid}
.cv-appendix-jutsu-title{display:flex;align-items:start;justify-content:space-between;gap:6px;margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid #e5dfd4}

.cv-appendix-jutsu-title strong{display:block;font:600 15px var(--serif);margin-top:4px;overflow-wrap:anywhere}
.cv-appendix-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cv-appendix-fields .cv-appendix-field.wide{grid-column:1/-1}
.cv-appendix-fields .cv-appendix-field:nth-child(5),.cv-appendix-fields .cv-appendix-field:nth-child(6),.cv-appendix-fields .cv-appendix-field:nth-child(7){grid-column:auto}
.cv-appendix-meta,.cv-appendix-alert{display:block;font-size:9px;line-height:1.6;margin-top:10px;color:#73746b}
.cv-appendix-alert{color:#a34e3f;font-weight:700}
.cv-appendix-placeholder{grid-column:1/-1;padding:45px 22px;border:1px dashed #c8c1b2;background:#f7f3ec;min-height:180px;display:grid;place-items:center;color:#888178;text-align:center;font:12px/1.7 var(--sans)}
.cv-appendix-paper-footer{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;border-top:1px solid #d2cabe;padding-top:12px;margin-top:23px;font-size:9px;color:#807c71;letter-spacing:.035em}

.cv-appendix-actions span{color:#72786e;font-size:11px;line-height:1.6}
.cv-known-after{max-width:828px;margin:22px auto;padding:16px 21px;background:#fbf8f0;border:1px solid #dcd2c3}
.cv-known-after .int-known{margin-top:0;border-top:0;padding-top:0}

@media(max-width:720px){.cv-appendix-paper{padding:22px 15px;min-height:0}.cv-appendix-ledgers,.cv-appendix-jutsu-grid{grid-template-columns:1fr}.cv-appendix-intro,.cv-appendix-paper-head{flex-wrap:wrap}.cv-appendix-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.cv-appendix-fields .cv-appendix-field.wide{grid-column:1/-1}.cv-known-after{padding:14px}.cv-appendix-stamp{font-size:70px}}
@media print{
 .cv-appendix-intro,.cv-appendix-actions,.cv-appendix-add,.cv-appendix-remove,.cv-learning-after,.cv-known-after{display:none!important}
 .cv-appendix-container{margin:0 auto;width:210mm;max-width:none}
 .cv-appendix-paper{width:210mm;min-height:297mm;max-width:none;margin:0;box-shadow:none;border:0;padding:14mm 13mm 12mm;break-before:page;page-break-before:always;break-inside:auto;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .cv-appendix-field input,.cv-appendix-field textarea{background:transparent!important;border-color:transparent!important;padding:2px 0!important;resize:none!important;overflow:visible!important}
 .cv-appendix-paper:before{inset:6mm}
 .cv-appendix-jutsu{break-inside:avoid;page-break-inside:avoid}
 .cv-appendix-ledger{break-inside:avoid}
}

/* Pergaminho em nanquim — estética de ilustração japonesa com tinta e caligrafia */
.evo-scroll-stage{
  --evo-brush:'Caveat Brush','Yuji Boku','Segoe Print',cursive;
  --evo-shodo:'Yuji Boku','Noto Serif JP',serif;
  width:min(100%,570px);
  filter:drop-shadow(0 19px 22px #050d0bc0);
}
.evo-rise-layer{
  background:radial-gradient(ellipse 65% 65% at 50% 48%,#1f2b22e8,#0b1310f8 85%);
}
.evo-scroll-paper{
  border-left:5px solid #a3977d;
  border-right:5px solid #a3977d;
  background:
    radial-gradient(ellipse 74% 50% at 10% 8%,#bcb49a1f,transparent 73%),
    radial-gradient(ellipse 45% 50% at 93% 87%,#9a947e14,transparent 80%),
    repeating-linear-gradient(8deg,transparent 0px,transparent 7px,#7d77600a 8px,transparent 12px),
    linear-gradient(90deg,#d8d1be 0%,#f9f4e8 5%,#fffaf0 50%,#f7f0e0 95%,#d8d0bd);
  box-shadow:inset 14px 0 18px -14px #62574565,inset -14px 0 18px -14px #62574565,0 12px 28px #0007;
}
.evo-scroll-paper:before{
  inset:13px 21px;
  border-color:#2a3d3030;
  box-shadow:0 0 0 4px #273c2710;
}
.evo-scroll-rod{
  height:24px;
  border-radius:4px;
  background:linear-gradient(#473b30,#928167 22%,#c3b397 49%,#857359 80%,#4d4030);
  box-shadow:0 4px 9px #0d151195;
}
.evo-scroll-rod:before,.evo-scroll-rod:after{
  width:15px;height:31px;
  background:linear-gradient(90deg,#2d3028,#928b6e 52%,#4e493b);
  border:1px solid #776e55;
  border-radius:3px;
}
.evo-scroll-stage{grid-template-rows:24px minmax(0,1fr) 24px}
.evo-scroll-paper{height:min(610px,calc(100dvh - 72px))}
.evo-ink-body{
  padding:clamp(24px,5vh,39px) clamp(21px,5vw,48px) 21px;
  color:#1b2821;
}
.evo-ink-body:before{
  content:"";
  position:absolute;
  pointer-events:none;
  z-index:-1;
  top:13%;left:9%;width:82%;height:28%;
  background:radial-gradient(ellipse at 50% 50%,#17271b15,transparent 66%);
  filter:blur(14px);
}
.evo-ink-header{
  font:500 10px/1.5 var(--evo-shodo);
  letter-spacing:.16em;
  color:#766f5f;
}
.evo-ink-crest{
  display:block;
  width:60px;
  height:61px;
  margin:9px auto -9px;
  color:var(--evo-color,#a24645);
  font:400 48px/1.2 var(--evo-shodo);
  opacity:.7;
  transform:rotate(-8deg);
  animation:evo-ink-reveal .6s 1.03s both;
}
.evo-calligraphy{
  font:400 clamp(42px,7vw,55px)/1.03 var(--evo-brush);
  letter-spacing:-.025em;
  color:#182a21;
  margin:0 auto 4px;
  text-shadow:0 1px 0 #20312826,1px 0 0 #20312826;
  filter:url(#evo-ink-edge);
  -webkit-font-smoothing:auto;
}
.evo-ink-subtitle{
  font:400 14px/1.55 var(--evo-shodo);
  color:#646658;
  letter-spacing:.035em;
}
.evo-ink-divider{margin:7px auto 4px;height:20px}
.evo-ink-divider path{
  stroke:#1f3328;
  stroke-width:4;
  stroke-linecap:round;
}
.evo-new-level{
  font:400 clamp(39px,7vw,50px)/1.15 var(--evo-brush);
  color:#1d3325;
  gap:18px;
  margin:7px 0 4px;
}
.evo-new-level small{
  font:400 26px/1 var(--evo-brush);
  color:#858377;
}
.evo-new-level strong{font-weight:400}
.evo-level-arrow{font:400 28px var(--evo-brush);color:#817f6e}
.evo-ink-rank{
  color:#3c4b3f;
  font:500 14px/1.45 var(--evo-shodo);
  letter-spacing:.04em;
}
.evo-ink-name{
  font:400 12px/1.5 var(--evo-shodo);
  color:#5e625a;
}
.evo-ink-rewards{
  max-width:390px;
  column-gap:18px;
  margin:14px auto 0;
}
.evo-ink-reward{
  min-width:0;
  border-bottom:1px solid #30463248;
  padding:5px 4px 6px;
  background:linear-gradient(180deg,transparent 88%,#28352e12);
}
.evo-ink-reward span{
  font:500 12px/1.4 var(--evo-shodo);
  color:#454c42;
}
.evo-ink-reward strong{
  font:400 27px/1 var(--evo-brush);
  color:#1e3327;
}
.evo-ink-vitality{
  font:400 14px/1.5 var(--evo-shodo);
  color:#4b574a;
  margin:13px auto 3px;
}
.evo-ink-stamp{
  font:400 31px/1 var(--evo-shodo);
  color:var(--evo-color,#ab4542);
  border:3px solid var(--evo-color,#ab4542);
  border-radius:3px;
  width:48px;height:48px;
  margin:9px auto 5px;
}
.evo-ink-note{
  font:400 11px/1.55 var(--evo-shodo);
  color:#777768;
  max-width:380px;
}
.evo-ink-footer button{
  background:#26382c;
  border-color:#26382c;
  border-radius:2px;
  font:600 11px var(--sans);
  letter-spacing:.045em;
}
.evo-ink-footer button:hover{background:#405843}
.evo-scroll-stage .evo-rise-close{
  background:#e6e1d2;border-color:#a49b84;color:#3a4638;
}
@media(max-width:580px){
 .evo-scroll-stage{grid-template-rows:23px minmax(0,1fr) 23px}
 .evo-scroll-rod{height:23px}
 .evo-scroll-rod:before,.evo-scroll-rod:after{height:30px}
 .evo-scroll-paper{height:min(660px,calc(100dvh - 66px))}
 .evo-ink-body{padding:24px 17px}
 .evo-calligraphy{font-size:clamp(34px,9vw,45px)}
 .evo-ink-crest{font-size:42px;height:51px;width:51px}
 .evo-new-level{font-size:39px}
 .evo-ink-rewards{gap:6px 9px}
}

/* Diário: pergaminho horizontal se desenrola do centro sem deformar o texto */
.journal-scroll-frame.is-unrolling .journal-scroll-paper{
  transform:none!important;transform-origin:center center;
  animation:journal-reveal-paper 1.28s cubic-bezier(.2,.72,.21,1) both!important;
  will-change:clip-path,opacity;
}
.journal-scroll-frame.is-unrolling .journal-scroll-rod.left{
  animation:journal-move-left 1.28s cubic-bezier(.2,.72,.21,1) both!important;
  will-change:left;
}
.journal-scroll-frame.is-unrolling .journal-scroll-rod.right{
  animation:journal-move-right 1.28s cubic-bezier(.2,.72,.21,1) both!important;
  will-change:right;
}
.journal-scroll-frame.is-unrolling .journal-ink-body{
  animation:journal-ink-unroll 0.48s 0.79s ease-out both!important;
}
@keyframes journal-reveal-paper{
  0%{clip-path:inset(0 49.7% 0 49.7%);opacity:.55;filter:brightness(.89)}
  12%{opacity:1}
  60%{clip-path:inset(0 17% 0 17%);filter:brightness(.98)}
  85%{clip-path:inset(0 0 0 0)}
  100%{clip-path:inset(0 0 0 0);opacity:1;filter:none}
}
@keyframes journal-move-left{
  0%{left:calc(50% - 18px)}
  83%{left:9px}
  100%{left:14px}
}
@keyframes journal-move-right{
  0%{right:calc(50% - 18px)}
  83%{right:9px}
  100%{right:14px}
}
@keyframes journal-ink-unroll{
  from{opacity:0;filter:blur(2px);transform:translateY(5px)}
  to{opacity:1;filter:none;transform:none}
}
.journal-stamp-overlay{position:fixed;inset:0;z-index:420;pointer-events:none;display:grid;place-items:center;
  background:radial-gradient(ellipse 45% 42% at center,#d9c9a43a,transparent 80%);
  animation:journal-stamp-dissolve 2.35s ease-out both}
.journal-stamp-approval{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;width:clamp(186px,39vw,285px);min-height:clamp(158px,31vw,218px);padding:18px 10px 14px;
  border:8px double #9a3231;border-radius:4px;color:#922e2c;background:#f7eee4c0;
  box-shadow:0 7px 0 #82333118,inset 0 0 0 2px #aa4b4125;
  transform-origin:55% 70%;animation:journal-stamp-strike 2.25s cubic-bezier(.2,.8,.26,1) both}
.journal-stamp-approval:before{content:"";position:absolute;inset:9px;border:1px dashed #963c35c0;pointer-events:none}
.journal-stamp-approval .kanji{font:500 clamp(53px,8vw,80px)/1 'Yuji Boku',var(--serif);letter-spacing:.08em}
.journal-stamp-approval strong{font:700 clamp(13px,2.5vw,21px)/1.35 var(--sans);letter-spacing:.08em}

.journal-stamp-approval .serial{font:600 9px/1.6 var(--sans);margin-top:8px;opacity:.8}
.journal-stamp-puff{position:absolute;inset:0;pointer-events:none;border:2px dashed #ae5d4a7a;border-radius:50%;
  transform:scale(.1);opacity:0;animation:journal-stamp-cloud 1.2s .31s ease-out both}
@keyframes journal-stamp-strike{
  0%{opacity:0;transform:translateY(-180px) rotate(-20deg) scale(1.75);filter:blur(5px)}
  14%{opacity:1}
  23%{transform:translateY(0) rotate(-9deg) scale(.94);filter:none}
  32%{transform:translateY(-10px) rotate(-10deg) scale(1.07)}
  44%{transform:translateY(0) rotate(-9deg) scale(1)}
  73%{opacity:.98}
  100%{opacity:0;transform:translateY(0) rotate(-9deg) scale(1)}
}
@keyframes journal-stamp-cloud{
  0%,20%{opacity:0;transform:scale(.3)}
  35%{opacity:.4}
  100%{opacity:0;transform:scale(3)}
}
@keyframes journal-stamp-dissolve{0%,75%{opacity:1}100%{opacity:0}}
@media(max-width:800px){
  @keyframes journal-move-left{0%{left:calc(50% - 13px)}83%{left:3px}100%{left:6px}}
  @keyframes journal-move-right{0%{right:calc(50% - 13px)}83%{right:3px}100%{right:6px}}
}
@media(prefers-reduced-motion:reduce){
  .journal-scroll-frame.is-unrolling .journal-scroll-paper,
  .journal-scroll-frame.is-unrolling .journal-scroll-rod,
  .journal-scroll-frame.is-unrolling .journal-ink-body,

.pub-scene .pub-note textarea[data-board-note-field="text"],
.pub-scene .pub-note .pub-note-body,
.pub-scene .pub-note.obs textarea{

  font-weight:400!important;
  line-height:1.43!important;
  letter-spacing:.005em;
  color:#493629!important;
}
.pub-scene .pub-note textarea::placeholder{
  font-family:var(--note-hand);
  color:#876d55;

/* MEMÓRIAS SHINOBI: fotos, selos, fios e espaço extra no mural. */
.pub-scene .pub-note.pub-memory{
  padding:10px 12px 12px;
  min-width:190px;
  min-height:210px;
  background:#f8f1e3;
  background-image:none;
  border:1px solid #dfc9a8;
  box-shadow:3px 8px 16px #3a22164d,0 0 0 3px #fff7e8 inset;
}
.pub-memory-tape{
  position:absolute;
  width:68px;height:20px;
  top:-2px;left:50%;z-index:3;
  background:#d9ba8bc9;
  border:1px solid #ae9067a5;
  transform:translateX(-50%) rotate(-5deg);
  box-shadow:0 1px 3px #2f211a26;
}
.pub-memory-frame{
  width:100%;height:calc(100% - 69px);
  min-height:98px;
  background:#e7ddcb;
  border:1px solid #d4bea1;
  display:grid;place-items:center;
  overflow:hidden;
}
.pub-memory-frame img{
  display:block;width:100%;height:100%;
  object-fit:contain;object-position:center;
}
.pub-memory-caption{
  display:block;width:100%;height:37px;
  margin:4px auto 0;
  text-align:center;
  white-space:nowrap;
  text-overflow:ellipsis;
  overflow:hidden;
  font:400 22px/1.45 'Caveat Brush','Segoe Print',cursive;
  color:#594433;
}
.pub-memory-caption input{
  text-align:center;
  width:100%;height:34px;
  padding:0 6px;
  font:400 22px/1.4 'Caveat Brush','Segoe Print',cursive!important;
  color:#594433!important;
  background:transparent;border:0;
}
.pub-memory-tools{
  display:flex;justify-content:flex-end;gap:5px;
  align-items:center;
  height:27px;
}
.pub-memory-tools .pub-drag{margin-right:auto}
.pub-memory-tools .pub-tool{font-size:12px}
.pub-note.pub-stamp{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:155px;min-height:98px;
  padding:17px 11px 10px;
  background:transparent;
  background-image:none;
  border:0;box-shadow:none;
  overflow:auto;
  scrollbar-width:none;
  --stamp-ink:#9a4037;
  resize:both;
}
.pub-note.pub-stamp[data-color="blue"]{--stamp-ink:#41627a}
.pub-note.pub-stamp[data-color="sage"]{--stamp-ink:#4f6855}
.pub-note.pub-stamp[data-color="lavender"]{--stamp-ink:#725574}
.pub-note.pub-stamp .pub-stamp-mark{
  box-sizing:border-box;
  display:flex;align-items:center;justify-content:center;
  max-width:100%;width:100%;min-height:45px;
  padding:10px 8px 7px;
  border:4px double var(--stamp-ink);
  border-radius:5px;
  box-shadow:inset 0 0 0 1px var(--stamp-ink);
  font:700 clamp(12px,1.4vw,22px)/1.1 'Yuji Boku',Georgia,serif;
  text-align:center;letter-spacing:.045em;
  overflow-wrap:anywhere;
  text-shadow:0 0 1px currentColor;
  color:var(--stamp-ink);
  opacity:.88;
}
.pub-stamp-controls{
  display:flex;gap:4px;align-items:center;justify-content:center;
  background:#f5eadbbd;
  border-radius:5px;
  padding:1px 3px;
  margin-bottom:3px;
}
.pub-stamp-controls button{border:0;background:transparent;color:#6c4a3a;cursor:pointer}
.pub-stamp[data-readonly="true"] .pub-stamp-controls{display:none}
.pub-threads{
  position:absolute;inset:0;width:100%;height:100%;
  z-index:4;pointer-events:none;
  overflow:visible;
}
.pub-threads .pub-thread-shadow{
  fill:none;stroke:#30221f86;stroke-width:6;
  stroke-linecap:round;filter:blur(2px);
}
.pub-threads .pub-thread-line{
  fill:none;stroke:#93352f;stroke-width:3.3;stroke-linecap:round;
  stroke-dasharray:1 0;
}
.pub-threads .pub-thread-pin{
  fill:#bc4940;stroke:#702c23;stroke-width:1.8;
}
.pub-threads .pub-thread-label-bg{
  fill:#f1dfbeeb;stroke:#b9926f;stroke-width:1;
}
.pub-threads .pub-thread-label{
  fill:#643b32;text-anchor:middle;
  font:600 15px 'Caveat Brush',cursive;
}
.pub-toolpanel{
  margin:-2px 0 10px;
  padding:12px 14px;
  border:1px solid #c9ac88;
  border-radius:10px;
  background:linear-gradient(135deg,#f8eedb,#e9d8bc);
  color:#533f32;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  box-shadow:inset 0 1px 0 #fff8ef;
}
.pub-toolpanel label{font:600 11px 'DM Sans',sans-serif;color:#765c47}
.pub-toolpanel select,.pub-toolpanel input{
  max-width:min(260px,100%);
  border:1px solid #c3a986;border-radius:6px;
  color:#45372f;background:#fffaf0;
  padding:8px 9px;font:500 12px 'DM Sans',sans-serif;
}
.pub-toolpanel select{min-width:145px}
.pub-toolpanel .button{white-space:nowrap}
.pub-toolpanel small{color:#856f58;font:500 11px/1.5 'DM Sans',sans-serif}
.pub-thread-existing{
  display:flex;gap:7px;align-items:center;flex-wrap:wrap;width:100%;
  padding-top:8px;border-top:1px solid #c9b3978a;
}
.pub-thread-existing button{
  border:1px solid #c19d81;background:#f5e4d3;
  border-radius:5px;padding:5px 8px;
  color:#784638;font:600 11px 'DM Sans',sans-serif;
}
.pub-board-toolbar .pub-tools-divider{
  width:1px;height:24px;background:#cbb595;flex:0 0 auto;
}
.pub-board-toolbar [data-action^="board-"]{white-space:nowrap}
.pub-note-help{line-height:1.65}
@media(max-width:850px){
  .pub-toolpanel{align-items:flex-start}
  .pub-toolpanel select,.pub-toolpanel input{max-width:100%}
}

/* Ajustes pessoais do mural: mover/virar observações sem modificar o quadro alheio. */
.pub-scene .pub-note.obs h3{display:flex;align-items:center;gap:5px;font-size:22px!important}
.pub-note.obs .pub-personal-label{flex:1 1 auto;min-width:0;line-height:1.1}
.pub-note.obs .pub-personal-tools{flex:0 0 auto;display:flex;align-items:center;gap:2px}
.pub-note.obs .pub-personal-tools .pub-tool{font:700 11px 'DM Sans',sans-serif;padding:4px 5px}
.pub-note.obs .pub-personal-tools .pub-drag{cursor:grab}
.pub-note.obs .pub-personal-tools .pub-drag:active{cursor:grabbing}
.pub-scene .pub-note .pub-rotate-exact{font:700 10px 'DM Sans',sans-serif;padding:4px 5px}
/* Mantém o campo de título legível mesmo com os novos controles de giro. */
.pub-scene .pub-note h3:has(input[data-board-note-field="title"]){flex-wrap:wrap;gap:3px 5px}
.pub-scene .pub-note h3 input[data-board-note-field="title"]{min-width:0;flex:1 1 75px;width:0}
.pub-scene .pub-note h3 .pub-note-tools{flex:0 0 auto;gap:2px;margin-left:auto}
.pub-scene .pub-note h3 .pub-note-tools button.pub-tool{padding:3px 4px;font-size:12px}
.pub-scene .pub-note:has(textarea[data-board-note-field="text"]) > textarea{height:calc(100% - 94px)}


/* Excluir apenas notas, fotografias e carimbos adicionados pelo jogador. */
.pub-scene .pub-note button.pub-delete{
  color:#98463a;
  background:#f9e9deee;
  border:1px solid #c68d78;
  border-radius:5px;
  font:700 10px/1.15 'DM Sans',sans-serif;
  padding:5px 6px;
  white-space:nowrap;
}
.pub-scene .pub-note button.pub-delete:hover{
  color:#fff7ef;
  background:#9f4b41;
  border-color:#833d36;
}
.pub-scene .pub-note button.pub-delete:focus-visible{
  outline:2px solid #a34c40;
  outline-offset:2px;
}

/* ══════════════════════════════════════════════════════════════════
   SHINOBI CHRONICLES · MODO NOTURNO
   Alternância manual no cabeçalho, guardada apenas no dispositivo.
   A arte das fichas Canva, o quadro de cortiça e o pergaminho do
   diário conservam suas cores originais e não recebem filtros.
   ══════════════════════════════════════════════════════════════════ */
.appearance-toggle{
  display:inline-flex;align-items:center;justify-content:center;
  gap:9px;min-height:36px;padding:8px 11px;
  background:#f2ece1;color:#35473c;border:1px solid #bcb8ab;
  border-radius:8px;font:700 11px 'DM Sans',sans-serif;
  letter-spacing:.015em;white-space:nowrap;
  transition:background .18s,color .18s,border-color .18s,transform .18s;
}
.appearance-toggle:hover{background:#e9decf;transform:translateY(-1px)}
.appearance-toggle:focus-visible{outline:2px solid var(--theme-accent,#bfa275);outline-offset:3px}
.appearance-toggle .appearance-icon{font-size:17px;line-height:1}

/* ================================================================
   SHINOBI CHRONICLES — SEGUNDA SKIN NOTURNA / 1.0
   Regra de cor: fundo carvão esverdeado, superfícies foscas, tipografia
   marfim suave, acentos do clã. Sem filtros globais e sem branco forte.
   As !important locais corrigem regras claras legadas de alta prioridade.
   ================================================================ */
html[data-appearance="dark"]{
  --paper:#111916;
  --paper-2:#19241e;
  --paper-3:#27372e;
  --ink:#e1e8db;
  --muted:#a9b8a8;
  --line:#3d4e43;
  --red:#d9a397;
  --gold:#d1b586;
  background:#111916;
  scrollbar-color:#455c4b #142019;

html[data-appearance="dark"] body,

  background:#111916!important;color:#e2e7dc;
}
html[data-appearance="dark"] #app .shell{
  --skin-bg:#111b16;
  --skin-surface:#202d25;
  --skin-raised:#29382d;
  --skin-subtle:#1b2820;
  --skin-input:#17231c;
  --skin-line:#425647;
  --skin-text:#e4e9de;
  --skin-muted:#adbcad;
  --skin-accent:color-mix(in srgb,var(--theme-accent,#7e9a82) 53%,#e4cfae);
  color:var(--skin-text);
}
html[data-appearance="dark"] #app .shell .main,
html[data-appearance="dark"] #app .shell.home-ambient .main,

    linear-gradient(140deg,#111a16,#18241d 50%,#101814)!important;
  color:var(--skin-text)!important;
}

html[data-appearance="dark"] #app .shell .main::after{opacity:.17!important}

function isImageDataUrl(value){
    return typeof value==='string'&&/^data:image\/(jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(value);
  }
  async function compressPortrait(file){
    const accepted=['image/jpeg','image/png','image/webp'];
    if(!file||!accepted.includes(file.type))throw Error('Escolha uma imagem JPG, PNG ou WebP.');
    if(!file.size||file.size>PORTRAIT_SOURCE_MAX)throw Error('Arquivo muito grande. Envie uma imagem de até 12 MB.');
    const url=URL.createObjectURL(file);
    let bitmap=null;
    try{
      bitmap=await new Promise((resolve,reject)=>{
        const img=new Image();
        img.onload=()=>resolve(img);
        img.onerror=()=>reject(new Error('Não foi possível ler essa imagem.'));
        img.src=url;
      });
      if(!bitmap.naturalWidth||!bitmap.naturalHeight)throw Error('A imagem selecionada não é válida.');
      const canvas=document.createElement('canvas');
      const ctx=canvas.getContext('2d',{alpha:true});
      if(!ctx)throw Error('Seu navegador não conseguiu preparar a imagem.');
      for(const maxSide of [900,720,560,440,320]){
        const ratio=Math.min(1,maxSide/Math.max(bitmap.naturalWidth,bitmap.naturalHeight));
        canvas.width=Math.max(1,Math.round(bitmap.naturalWidth*ratio));
        canvas.height=Math.max(1,Math.round(bitmap.naturalHeight*ratio));
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.imageSmoothingEnabled=true;
        ctx.imageSmoothingQuality='high';
        ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
        for(const quality of [.82,.7,.58,.45]){
          let data=canvas.toDataURL('image/webp',quality);
          if(!data.startsWith('data:image/webp;'))data=canvas.toDataURL('image/jpeg',quality);
          if(isImageDataUrl(data)&&data.length<=PORTRAIT_DATA_MAX)return data;
        }
      }
      throw Error('Não foi possível comprimir essa imagem. Tente outra foto.');
    }finally{URL.revokeObjectURL(url)}
  }
  async function handlePortraitSelected(file,key){
 if(!file)return;
 if(!canEditCurrent())return showToast('Você não pode editar esta ficha.',true);
 if(S.portraitBusy)return;
 const slot=portraitVariant(key||S.portraitUploadSlot).key;
 const sheet=active(),sheetId=S.sheetId;if(!sheet||!sheetId)return;
 S.portraitBusy=true;showToast('Preparando retrato '+portraitVariant(slot).label.toLowerCase()+'...');
 try{
  const data=await compressPortrait(file);
  if(S.sheetId!==sheetId||active()!==sheet||!canEditCurrent())return showToast('Abra novamente a ficha para enviar o retrato.',true);
  const prev={foto:sheet.foto,retratos:{...sheet.retratos},base:sheet.retratoBase};
  const gallery={casual:'',ninja:'',ferido:'',grave:'',...sheet.retratos};
  if(sheet.foto&&!gallery.casual)gallery.casual=sheet.foto;
  gallery[slot]=data;sheet.retratos=gallery;sheet.foto='';
  if(slot==='casual'||slot==='ninja')sheet.retratoBase=slot;
  if(new TextEncoder().encode(JSON.stringify(sheet)).length>PORTRAIT_DOCUMENT_MAX){
   sheet.foto=prev.foto;sheet.retratos=prev.retratos;sheet.retratoBase=prev.base;
   return showToast('A ficha ficou grande demais para salvar no Firebase. Tente uma foto menor ou remova outro retrato.',true);
  }
  if(S.saveTimer){clearTimeout(S.saveTimer);S.saveTimer=null}
  S.portraitPreview={sheetId,key:slot};
  render();
  const saved=await persist();
  if(saved)showToast('Retrato '+portraitVariant(slot).label.toLowerCase()+' salvo!');
  else{
   sheet.foto=prev.foto;sheet.retratos=prev.retratos;sheet.retratoBase=prev.base;
   S.portraitPreview=null;render();showToast('Não foi possível salvar o retrato.',true);
  }
 }catch(error){console.error('Upload retrato:',error);showToast(error.message||'Falha ao enviar retrato.',true)}

 return `<div class="modalshade" data-action="close-modal"><div class="modalbox" role="alertdialog" aria-modal="true" aria-label="Confirmar exclusão"><div class="eyebrow">EXCLUSÃO PERMANENTE</div><h2>Excluir esta ficha?</h2><p>O personagem <strong>${E(item.data.nome||'Sem nome')}</strong> será removido do Firebase. Esta ação não pode ser desfeita pelo site.${item.data.diarioPessoal&&S.sheets.length===1?' Para preservar seu diário, crie outro personagem antes de excluir esta última ficha.':''}</p><div class="flex wrap mt24"><button class="button button-danger" data-action="confirm-delete">Excluir definitivamente</button><button class="button secondary" data-action="close-modal">Cancelar</button></div></div></div>`;

async function deleteSheet(){
 const id=S.pendingDeleteId;
 if(!id||S.adminViewing||!S.sheets.some(x=>x.id===id))return showToast('Exclusão não permitida.',true);
 S.modal=null;if(S.sheetId===id){clearTimeout(S.saveTimer);S.saveTimer=null}
 try{
   if(S.pendingWrite)await S.pendingWrite.catch(()=>{});
   // Transferir o diário antes da exclusão da ficha que o hospeda.
   const victim=S.sheets.find(x=>x.id===id);
   if(S.diaryDirty&&S.diaryStorage==='sheet'&&S.diaryHostId===id){
     if(!await persistDiary())throw Error('Falha ao salvar o diário antes da exclusão');
   }
   const payload=victim?.data?.diarioPessoal;
   if(payload){
     const replacement=S.sheets.filter(x=>x.id!==id&&x.data?.ownerUid===uid()).sort((a,b)=>
       (n(a.data.criadoEm)||0)-(n(b.data.criadoEm)||0))[0];
     if(!replacement){
       S.pendingDeleteId=null;render();
       return showToast('Para não perder seu diário, crie outra ficha antes de excluir a última.',true);
     }
     if(CONFIGURED&&fb){
       await fb.setDoc(fb.doc(fb.db,'fichas',replacement.id),{diarioPessoal:payload},{merge:true});
     }
     replacement.data.diarioPessoal=payload;
     if(S.diaryHostId===id)S.diaryHostId=replacement.id;
   }
   if(CONFIGURED&&fb){if(!S.user)throw Error('Sem autenticação');await fb.deleteDoc(fb.doc(fb.db,'fichas',id))}
   S.sheets=S.sheets.filter(x=>x.id!==id);
   if(S.sheetId===id){const next=ownSheets()[0];S.sheet=next?.data||null;S.sheetId=next?.id||null}
   S.pendingDeleteId=null;S.view='fichas';render();showToast('Ficha excluída com sucesso.');
 }catch(error){console.error(error);S.pendingDeleteId=null;render();showToast('Erro ao excluir. Verifique as permissões do Firestore.',true)}
}

function themeClan(){
 const mine=(S.sheets||[]).filter(x=>x?.data?.clanId);
 if(!mine.length)return null;
 mine.sort((a,b)=>{
  const dateA=n(a.data?.criadoEm)||0,dateB=n(b.data?.criadoEm)||0;
  if(dateB!==dateA)return dateB-dateA;
  return String(b.id||'').localeCompare(String(a.id||''));
 });
 return CLANS.find(c=>c.id===mine[0].data.clanId)||null;
}
function themeStyle(){
 const clan=themeClan();
 if(!clan)return '';
 const hex=clan.color.replace('#','');
 const rgb=[0,2,4].map(i=>parseInt(hex.slice(i,i+2),16));
 const deep=rgb.map(x=>Math.round(x*.67+38*.33));
 const deepHex='#'+deep.map(x=>x.toString(16).padStart(2,'0')).join('');
 return `style="--theme-accent:${clan.color};--theme-rgb:${rgb.join(',')};--theme-deep:${deepHex};--theme-wash:${clan.wash}" data-theme="${clan.id}"`;
}
