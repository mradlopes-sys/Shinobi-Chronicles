  function fresh(clanId){const attrs=Object.fromEntries(ATTRS.map(([k])=>[k,0]));const skills=Object.fromEntries(SKILLS.map(([k])=>[k,0]));return{ownerUid:uid(),usuario:S.user?.displayName||'Visitante',clanId,nome:'',idade:'',vila:'Konohagakure',graduacao:'Genin',descricao:'',nc:4,atributos:attrs,sociais:{Carisma:0,Manipulacao:0},pericias:skills,combateAjustes:{CC:0,CD:0,ESQ:0,LM:0},poderes:[],aptidoes:[],jutsus:[],inventario:[],ryos:100,recursos:{vit:null,chakra:null},historico:'',historia:'',foto:'',criadoEm:Date.now(),atualizadoEm:Date.now(),versao:1}}
  function normalize(raw){const p={...fresh(raw.clanId||'semcla'),...raw};p.atributos={...fresh(p.clanId).atributos,...(raw.atributos||{})};p.pericias={...fresh(p.clanId).pericias,...(raw.pericias||{})};p.sociais={Carisma:0,Manipulacao:0,...(raw.sociais||{})};p.combateAjustes={CC:0,CD:0,ESQ:0,LM:0,...(raw.combateAjustes||{})};p.recursos={vit:null,chakra:null,...(raw.recursos||{})};for(const k of ['poderes','aptidoes','jutsus','inventario'])if(!Array.isArray(p[k]))p[k]=[];if(!NC_TABLE[p.nc])p.nc=4;return p}
  function imageTag(c){return `<img src="assets/clas/${c.id}.jpg" alt="Arte do clã ${E(c.name)}" loading="lazy" onerror="this.style.display='none'">`}

  function side(){return `<aside class="sidebar"><div class="brand"><div class="brandmark">忍</div><div><div class="brand-name">Shinobi<br>Chronicles</div><div class="brand-sub">Arquivos Shinobi</div></div></div><nav aria-label="Menu principal"><div class="nav-category">NAVEGAÇÃO</div>${[['home','⌂','Início'],['clans','◈','Os Clãs'],['sheet','▤','Minha Ficha'],...(canAdmin()?[['admin','♜','Administração']]:[])].map(([view,ic,label])=>`<button class="nav-item ${S.view===view?'active':''}" data-action="nav" data-view="${view}"><span class="nav-icon">${ic}</span>${label}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="tiny">SHINOBI NO SHO · SISTEMA D8</div><div class="side-account">${E(S.user?.displayName|| (CONFIGURED?'Conta não conectada':'Modo demonstração'))}</div><div class="tiny">${CONFIGURED?'Dados privados no Firebase.':'Prévia local, sem salvamento na nuvem.'}</div>${S.user?'<button class="nav-item" data-action="logout"><span class="nav-icon">↪</span>Sair da conta</button>':''}</div></aside>`}
  function top(){let titles={home:'Início',clans:'Guia dos clãs',sheet:'Registro do personagem',admin:'Administração',login:'Acesso shinobi'};return `<header class="topbar"><div><div class="eyebrow">SHINOBI CHRONICLES / ARQUIVO</div><div class="top-title">${titles[S.view]||'Arquivo'}</div></div><div class="top-actions">${S.user?`<span class="pill">${E(S.user.displayName)}</span>`:!CONFIGURED?'<span class="pill">Prévia demonstrativa</span>':'<button class="button small" data-action="nav" data-view="login">Entrar</button>'}${S.view==='sheet'?`<span id="save-status" class="pill">${E(S.saveState)}</span>`:''}</div></header>`}
  function layout(inner){return `<div class="shell">${side()}<main class="main">${top()}<div class="content">${inner}<footer class="footer-note">SHINOBI CHRONICLES · Sistema D8 / SNS 4.1b · Plataforma independente de fichas · Ilustrações dos clãs serão adicionadas pelo projeto.</footer></div></main></div>`}
  const heroArt=`<svg viewBox="0 0 600 330" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><path fill="#636d6247" d="M0 310L70 210 126 269 216 132 298 261 363 156 471 280 520 215 600 300 600 330H0z"/><path fill="#7a83735c" d="M0 330L100 268 145 286 229 210 285 263 360 220 430 279 600 245V330z"/><path stroke="#505449" stroke-width="2" fill="none" d="M0 317q160-22 310 2t310-4"/><g stroke="#3f4b42" stroke-width="5" opacity=".62"><path d="M431 236V91M523 242V104M411 110h126M420 126h107"/><path d="M408 92q65-31 131 0"/></g><circle cx="400" cy="108" r="79" fill="#b9605b40"/></svg>`;
  function home(){const c=active()?clanOf(active().clanId):null;return layout(`<section class="hero"><div class="hero-copy"><div class="eyebrow">UM NOVO CICLO · SHINOBI CHRONICLES</div><h1>Seu caminho<br>começa aqui.</h1><p>Explore as famílias shinobi, registre seu personagem e acompanhe sua evolução com uma ficha automatizada pelo sistema D8.</p><div class="flex wrap mt24"><button class="button" data-action="nav" data-view="clans">Explorar os clãs <span>↗</span></button><button class="button secondary" data-action="nav" data-view="sheet">Minha ficha</button></div></div><div class="hero-scene">${heroArt}<div class="hero-stamp">忍</div></div></section>${!CONFIGURED?`<div class="notice warn mt16"><b>Modo de demonstração.</b> A interface e os cálculos já funcionam, mas os dados não serão salvos online até configurar o Firebase no arquivo <code>index.html</code>. É possível testar a ficha agora.</div>`:''}<div class="section-head"><div><div class="eyebrow">ARQUIVOS DE KONOHA</div><h2>Explore os clãs</h2></div><p>11 linhagens e um caminho independente</p></div><div class="clans-grid">${CLANS.slice(0,6).map(clanCard).join('')}</div><div class="section-head"><div><div class="eyebrow">O SEU REGISTRO</div><h2>Ficha de personagem</h2></div></div>${c?`<div class="paper-panel"><div class="flex between wrap"><div><div class="eyebrow">PERSONAGEM ATIVO</div><h3 style="margin:8px 0">${E(active().nome||'Personagem sem nome')} · ${E(c.name)}</h3><div class="panel-caption">Nível de Campanha ${active().nc} · ${E(active().graduacao)}</div></div><button class="button" data-action="nav" data-view="sheet">Continuar edição ↗</button></div></div>`:`<div class="empty"><h3>Sua história ainda não foi registrada</h3><p>Escolha um clã e crie sua ficha; os atributos e as perícias serão calculados automaticamente.</p><button class="button" data-action="nav" data-view="clans">Escolher clã</button></div>`}`)}
  function clans(){return layout(`<div class="section-head" style="margin-top:0"><div><div class="eyebrow">AS FAMÍLIAS SHINOBI</div><h2>Guia de Clãs</h2></div><p>Clique em uma família para conhecer e escolher seu caminho.</p></div><div class="notice">A escolha de um clã não concede pontos automaticamente no Shinobi no Sho. Ela habilita técnicas e aptidões restritas, que dependem da compra e dos requisitos do sistema.</div><div class="clans-grid mt24">${CLANS.map(clanCard).join('')}</div>`)}
  function login(){if(!CONFIGURED)return layout(`<div class="empty"><h3>Conecte o Firebase para ativar contas</h3><p>Os dados públicos da configuração do seu projeto Firebase devem ser colados no início do <code>index.html</code>. O modo demonstração permite testar a ficha sem login.</p><button class="button" data-action="clan" data-clan="uchiha">Testar ficha Uchiha</button></div>`);return `<div class="shell">${side()}<main class="main">${top()}<div class="auth-shell"><div class="auth-art"><div class="auth-mark">忍</div></div><div class="auth-form-wrap"><div class="eyebrow">ÁREA RESTRITA</div><h1>${S.authPane==='login'?'Bem-vindo, shinobi.':'Seu registro começa aqui.'}</h1><p>${S.authPane==='login'?'Entre com seu nome de usuário e sua senha para acessar sua ficha particular.':'Crie uma conta para guardar sua própria ficha. Não é necessário informar e-mail.'}</p><form class="auth-form" id="auth-form"><div class="field"><label for="auth-name">Nome de usuário</label><input id="auth-name" name="username" minlength="3" maxlength="20" pattern="[a-zA-Z0-9._-]{3,20}" autocomplete="username" placeholder="ex.: ninja_konoha" required></div><div class="field"><label for="auth-pass">Senha</label><input id="auth-pass" name="password" type="password" minlength="6" autocomplete="${S.authPane==='login'?'current-password':'new-password'}" placeholder="Mínimo de 6 caracteres" required></div><button class="button" type="submit" ${S.authWorking?'disabled':''}>${S.authWorking?'Aguarde...':S.authPane==='login'?'Entrar nos arquivos':'Criar minha conta'}</button><button class="switch" type="button" data-action="auth-switch">${S.authPane==='login'?'Ainda não tem conta? Criar cadastro':'Já tem conta? Fazer login'}</button></form><p style="font-size:11px;margin-top:26px">As fichas são privadas. Como o acesso utiliza nome e senha sem e-mail real, a recuperação automática de senha não fica disponível nesta versão.</p></div></div></main></div>`}
  const field=(name,path,value,type='text',extra='')=>`<div class="field"><label>${E(name)}</label><input ${type==='number'?'type="number" min="0"':'type="text"'} data-bind="${E(path)}" value="${E(value??'')}" ${extra}></div>`;
  const area=(name,path,value,rows=4)=>`<div class="field"><label>${E(name)}</label><textarea rows="${rows}" data-bind="${E(path)}">${E(value??'')}</textarea></div>`;

  function identity(p){return `<div class="two-col"><section class="paper-panel"><h3>Dados do personagem</h3><div class="form-grid">${field('Nome do personagem','nome',p.nome)}${field('Idade','idade',p.idade)}${field('Vila','vila',p.vila)}${field('Graduação narrativa','graduacao',p.graduacao)}<div class="field"><label>Nível de Campanha (NC)</label><select data-bind="nc">${Object.entries(NC_TABLE).map(([k,t])=>`<option value="${k}" ${Number(k)===p.nc?'selected':''}>NC ${k} — ${E(t.label)}</option>`).join('')}</select></div>${field('Retrato (URL HTTPS, opcional)','foto',p.foto)}<div class="field full">${area('Conceito e aparência','descricao',p.descricao,3)}</div></div></section><section class="paper-panel"><h3>Identificação e recursos</h3><div class="stat-row"><span>Clã escolhido</span><strong>${E(clanOf(p.clanId).name)}</strong></div><div class="stat-row"><span>Nível shinobi</span><strong>${E(currentNC().label)}</strong></div><div class="stat-row"><span>Limite máximo de atributo</span><strong>${p.nc}</strong></div><div class="stat-row"><span>Limite de poder/perícia</span><strong>${limit()}</strong></div><div class="stat-row"><span>Mínimo de cada atributo</span><strong>${currentNC().min}</strong></div><div class="stat-row"><span>Ryos iniciais (referência)</span><strong>${fmt(currentNC().ryos)}</strong></div><p class="panel-caption mt24">A família escolhida serve como referência de acesso a poderes restritos. Este editor não distribui automaticamente Sharingan, Byakugan ou outras técnicas.</p></section></div>`}
  function attributes(p){const t=totals(p);return `<div class="two-col"><section class="paper-panel"><div class="flex between wrap"><h3>Atributos</h3>${budget(t.attrs,currentNC().attrs)}</div><div class="attr-list">${ATTRS.map(([k,label])=>`<div class="attr-item"><div class="attr-name">${label}</div><div class="attr-control"><div class="num-control"><button class="step" data-action="attr" data-key="${k}" data-delta="-1" aria-label="Diminuir ${label}">−</button><span class="num-value">${n(p.atributos[k])}</span><button class="step" data-action="attr" data-key="${k}" data-delta="1" aria-label="Aumentar ${label}">+</button></div><span class="pill">Máx. ${p.nc}</span></div></div>`).join('')}</div><p class="panel-caption mt24">Ao mudar um atributo, Vitalidade, Chakra, perícias, iniciativa e habilidades de combate são atualizados automaticamente.</p></section><section class="stack"><div class="paper-panel"><h3>Atributos sociais ${budget(t.social,currentNC().social)}</h3><div class="form-grid">${field('Carisma','sociais.Carisma',p.sociais.Carisma,'number',`max="${limit()}"`)}${field('Manipulação','sociais.Manipulacao',p.sociais.Manipulacao,'number',`max="${limit()}"`)}</div><p class="panel-caption mt16">Sociais são separados dos sete atributos de combate. O limite individual segue metade do NC.</p></div><div class="paper-panel"><h3>Resumo das energias</h3><div class="four-grid" style="grid-template-columns:repeat(2,1fr)"><div class="mini-stat"><span>Vitalidade máxima</span><strong>${vitMax(p)}</strong></div><div class="mini-stat"><span>Chakra máximo</span><strong>${chakraMax(p)}</strong></div></div><p class="panel-caption mt16">Vit = 10 + 3 × VIG + 5 × NC. Chakra = 10 + 3 × ESP.</p></div><div class="notice ${t.attrs>currentNC().attrs?'warn':''}">A criação exige investir os pontos da faixa escolhida e respeitar o atributo mínimo de cada NC. Valores que excedem o orçamento são bloqueados.</div></section></div>`}
  function skills(p){const t=totals(p);return `<section class="paper-panel"><div class="flex between wrap"><div><h3 style="margin-bottom:3px">Perícias</h3><div class="panel-caption">Nível = ⌈atributo/2⌉ + pontos investidos</div></div>${budget(t.skills,currentNC().skills)}</div><div style="overflow:auto"><table class="skill-table"><thead><tr><th>Perícia</th><th>Atributo</th><th class="narrow">Base</th><th class="narrow">Pontos</th><th class="narrow">Total</th><th>Teste</th></tr></thead><tbody>${SKILLS.map(([name,attr,x])=>`<tr><td><strong>${E(name)}</strong>${x?'<br><span class="trained">TREINADA [x]</span>':''}</td><td>${attr}</td><td class="narrow">${Math.ceil(n(p.atributos[attr])/2)}</td><td class="narrow"><button data-action="skill" data-key="${E(name)}" data-delta="-1" aria-label="Diminuir ${E(name)}">−</button> &nbsp;${n(p.pericias[name])}&nbsp; <button data-action="skill" data-key="${E(name)}" data-delta="1" aria-label="Aumentar ${E(name)}">+</button></td><td class="narrow"><strong>${skillTotal(p,name)}</strong></td><td><button data-action="roll-skill" data-key="${E(name)}" ${!trained(p,name)||name==='Venefício'&&p.nc<8?'disabled title="Indisponível neste NC"':''}>2d8 + ${skillTotal(p,name)}</button></td></tr>`).join('')}</tbody></table></div><p class="panel-caption mt16">Perícias treinadas exigem ao menos 1 ponto investido. Venefício não está disponível no NC 4. O limite é de ${limit()} pontos gastos por perícia.</p></section>`}
  function combatView(p){const cs=['CC','CD','ESQ','LM'], names={CC:'Combate Corporal',CD:'Combate à Distância',ESQ:'Esquiva',LM:'Ler Movimento'};let totalShift=cs.reduce((s,k)=>s+Math.max(0,n(p.combateAjustes[k])),0);return `<div class="two-col"><div class="stack"><section class="paper-panel"><h3>Habilidades de combate</h3>${cs.map(k=>`<div class="stat-row"><span>${names[k]} <small class="muted">(base ${3+n(p.combateAjustes[k])})</small></span><strong>${combat(p,k)}</strong></div>`).join('')}<p class="panel-caption mt16">CC = base + FOR · CD = base + DES · ESQ = base + AGI · LM = base + PER</p></section><section class="paper-panel"><h3>Redistribuição de bases</h3><p class="panel-caption">Pode transferir até 2 pontos de base entre as quatro habilidades. Cada base começa em 3.</p><div class="form-grid mt16"><div class="field"><label>Retirar 1 ponto de</label><select id="shift-from">${cs.map(k=>`<option value="${k}">${names[k]}</option>`).join('')}</select></div><div class="field"><label>Adicionar 1 ponto em</label><select id="shift-to">${cs.map(k=>`<option value="${k}">${names[k]}</option>`).join('')}</select></div></div><div class="flex wrap mt16"><button class="button small" data-action="shift">Transferir 1 ponto</button><button class="button secondary small" data-action="reset-shift">Restaurar bases</button><span class="pill">${totalShift} / 2 transferências</span></div></section></div><div class="stack"><section class="paper-panel"><h3>Energias de combate</h3>${pool(p,'vit','Vitalidade',vitMax(p))}<div style="height:12px"></div>${pool(p,'chakra','Chakra',chakraMax(p))}</section><section class="paper-panel"><h3>Valores automáticos</h3><div class="stat-row"><span>Dificuldade para Esquiva</span><strong>${9+combat(p,'ESQ')}</strong></div><div class="stat-row"><span>Deslocamento / movimento</span><strong>${10+Math.ceil(n(p.atributos.AGI)/2)} m</strong></div><div class="stat-row"><span>Iniciativa</span><strong>1d8 + ${n(p.atributos.AGI)+skillTotal(p,'Prontidão')}</strong></div><div class="stat-row"><span>Precisão corpo a corpo</span><strong>${combat(p,'CC')}</strong></div><div class="stat-row"><span>Precisão à distância</span><strong>${combat(p,'CD')}</strong></div><div class="flex wrap mt16"><button class="button small" data-action="roll-combat" data-key="CC">Rolar ataque CC</button><button class="button secondary small" data-action="roll-initiative">Rolar iniciativa</button></div></section></div></div>`}
  function pool(p,key,label,max){const raw=p.recursos?.[key];const val=raw===null||raw===undefined?max:n(raw);return `<div class="pool ${key==='chakra'?'chakra':''}"><div><div class="pool-title">${label}</div><div class="pool-max">Máximo ${max}</div><div class="progress"><span style="width:${Math.max(0,Math.min(100,val/Math.max(1,max)*100))}%"></span></div></div><input type="number" data-bind="recursos.${key}" min="-99" max="9999" value="${val}" aria-label="${label} atual"></div>`}

  function techniques(p){const t=totals(p);return `<div class="stack"><div class="notice"><b>Como funciona:</b> pontos de poder compram níveis de poderes, não jutsus isolados. Cada personagem tem 3 aptidões gratuitas; cada aptidão extra consome 2 pontos de poder. O custo-padrão em chakra é igual ao nível usado na técnica. Jutsus básicos são gratuitos.</div><div class="flex between wrap"><h3 style="margin:0;font:600 19px var(--serif)">Orçamento de poder</h3>${budget(t.powers,currentNC().powers)}</div>${collectionEditor('poderes','Poderes', [['Nome do poder','nome'],['Nível investido','nivel','number'],['Observações','descricao','area']],`Limite por poder: ${limit()} níveis. Exemplos comuns: ${COMMON_POWERS.join(', ')}.`)}${collectionEditor('aptidoes','Aptidões',[['Nome da aptidão','nome'],['Categoria / requisito','tipo']],`3 gratuitas, as demais custam 2 pontos de poder. Confira os pré-requisitos no livro.`)}${collectionEditor('jutsus','Técnicas registradas',[['Nome da técnica','nome'],['Nível utilizado','nivel','number'],['Ação','acao'],['Duração','duracao'],['Alvo / Área','alvo'],['Alcance','alcance'],['Efeito / descrição','efeito','area']],`Jutsus são registros de técnicas desbloqueadas, e não compras independentes. Custo de chakra padrão = nível usado.`)}<div class="notice">Técnicas e aptidões restritas aos clãs devem ser validadas conforme suas descrições e pré-requisitos no manual completo do SNS. O editor não desbloqueia poderes somente por selecionar um clã.</div></div>`}
  function inventory(p){return `<div class="stack"><div class="two-col"><section class="paper-panel"><h3>Recursos e dinheiro</h3>${field('Ryos atuais','ryos',p.ryos,'number')}<p class="panel-caption mt16">Referência de Ryos iniciais em ${currentNC().label}: ${fmt(currentNC().ryos)}. O equipamento básico costuma ser fornecido pela vila, conforme as regras da campanha.</p></section><section class="paper-panel"><h3>Compartimentos</h3><p class="panel-caption">Registre os equipamentos transportados. Os limites de carga e os preços específicos devem ser consultados no manual do sistema.</p></section></div>${collectionEditor('inventario','Inventário e equipamentos',[['Item','nome'],['Quantidade','quantidade','number'],['Notas / compartimentos','obs']])}</div>`}
  function history(p){return `<div class="two-col"><section class="paper-panel"><h3>História do personagem</h3>${area('Biografia, família, motivações e trajetória','historia',p.historia,15)}</section><section class="paper-panel"><h3>Diário de campanha</h3>${area('Missões, eventos, contatos e progressão','historico',p.historico,15)}<p class="panel-caption mt16">As alterações são salvas automaticamente no Firebase depois da configuração do projeto.</p></section></div>`}
  function sheetView(){if(!active())return layout(`<div class="empty"><h3>Você ainda não tem uma ficha</h3><p>Escolha um clã para abrir o editor automático do Shinobi Chronicles.</p><button class="button" data-action="nav" data-view="clans">Explorar clãs</button></div>`);const p=active(),clan=clanOf(p.clanId);const t=totals(p);let data={identidade:identity,atributos:attributes,pericias:skills,combate:combatView,tecnicas:techniques,inventario:inventory,historia:history};return layout(`<div class="sheet-banner" style="--wash:${clan.wash}">${imageTag(clan)}<span class="watermark">${clan.kanji}</span><div class="banner-inner"><div class="eyebrow">REGISTRO SHINOBI / ${E(clan.name.toUpperCase())}</div><h1>${E(p.nome||'Novo personagem')}</h1><div class="sub">${E(clan.name)} · NC ${p.nc} · ${E(p.graduacao)}</div></div></div>${S.isAdmin&&S.sheetId!==uid()?'<button class="button secondary small mt16" data-action="nav" data-view="admin">← Voltar ao painel do mestre</button>':''}<div class="tabs" role="tablist">${TABS.map(([id,label])=>`<button class="tab ${S.tab===id?'active':''}" role="tab" aria-selected="${S.tab===id}" data-action="tab" data-tab="${id}">${label}</button>`).join('')}</div><div id="sheet-tab">${(data[S.tab]||identity)(p)}</div><div class="statusbar mt24"><div><span class="status-dot"></span><span id="save-footer">${CONFIGURED?E(S.saveState):'Prévia local (não salva na nuvem)'}</span></div><div class="flex wrap"><button class="button secondary small" data-action="export">Exportar JSON</button><button class="button secondary small" data-action="print">Imprimir / PDF</button><button class="button small" data-action="save">Salvar agora</button></div></div><div class="mt24 four-grid"><div class="mini-stat"><span>Atributos</span><strong>${t.attrs}/${currentNC().attrs}</strong></div><div class="mini-stat"><span>Perícias</span><strong>${t.skills}/${currentNC().skills}</strong></div><div class="mini-stat"><span>Poderes</span><strong>${t.powers}/${currentNC().powers}</strong></div><div class="mini-stat"><span>Sociais</span><strong>${t.social}/${currentNC().social}</strong></div></div>${[t.attrs>currentNC().attrs,t.skills>currentNC().skills,t.powers>currentNC().powers,t.social>currentNC().social].some(Boolean)?'<div class="notice warn mt16"><b>Atenção:</b> existe orçamento excedido nesta ficha. Revise os valores antes de finalizar.</div>':''}`)}
  function adminView(){if(!canAdmin())return layout(`<div class="empty"><h3>Acesso restrito</h3><p>Somente administradores autorizados pelo Firebase podem consultar todas as fichas.</p></div>`);const items=S.adminSheets;return layout(`<div class="section-head" style="margin-top:0"><div><div class="eyebrow">PERMISSÕES DO MESTRE</div><h2>Administração</h2></div><button class="button secondary small" data-action="refresh-admin">↻ Atualizar</button></div><div class="four-grid"><div class="mini-stat"><span>Fichas registradas</span><strong>${items.length}</strong></div><div class="mini-stat"><span>Clãs utilizados</span><strong>${new Set(items.map(x=>x.clanId)).size}</strong></div><div class="mini-stat"><span>Maior NC</span><strong>${items.length?Math.max(...items.map(x=>n(x.nc))):'—'}</strong></div><div class="mini-stat"><span>Seus privilégios</span><strong style="font-size:16px;margin-top:14px">Mestre</strong></div></div><section class="paper-panel mt24"><h3>Fichas dos jogadores</h3><div class="field"><label>Pesquisar por personagem, jogador ou clã</label><input id="admin-filter" placeholder="Buscar..." autocomplete="off"></div><div id="admin-rows" class="mt16">${adminRows(items)}</div></section><div class="notice mt16">Este painel é protegido por regras do Firestore. A permissão de administrador é controlada pela coleção <code>admins</code> no Firebase, e não por um campo editável pelo jogador.</div>`)}
  function adminRows(items){return items.length?items.map(x=>`<div class="admin-row"><div><b>${E(x.nome||'Sem nome')}</b><small>${E(x.usuario||'Jogador')} · ${E(clanOf(x.clanId).name)}</small></div><div>NC ${n(x.nc)}</div><div class="admin-date">${x.atualizadoEm?new Date(x.atualizadoEm).toLocaleDateString('pt-BR'):'—'}</div><button class="button secondary small" data-action="open-admin" data-id="${E(x.__id)}">Abrir ficha</button></div>`).join(''):`<div class="empty"><h3>Nenhuma ficha encontrada</h3><p>Os personagens aparecerão aqui após serem criados pelos jogadores.</p></div>`}
  function clanModal(){const c=clanOf(S.activeClan);return `<div class="modalshade" data-action="close-modal"><div class="modalbox" role="dialog" aria-modal="true" aria-label="Clã ${E(c.name)}" ><div class="clan-art" style="--wash:${c.wash};height:164px;margin:-32px -32px 24px">${imageTag(c)}<span class="kanji">${c.kanji}</span></div><div class="eyebrow">CAMINHOS SHINOBI</div><h2>Clã ${E(c.name)}</h2><p class="panel-caption">${E(c.desc)} Esta escolha define a família do personagem e os poderes restritos disponíveis mediante cumprimento de pré-requisitos no SNS 4.1b.</p>${active()?`<div class="notice warn mt16">${S.demo?'Você está em modo demonstração. Criar outra ficha substituirá a ficha temporária.':'Você já possui uma ficha. Esta versão permite um personagem por conta para preservar a privacidade e a organização.'}</div>`:''}<div class="flex wrap mt24"><button class="button" data-action="create-sheet" ${active()&&!S.demo?'disabled':''}>${active()&&!S.demo?'Ficha já criada':'Criar personagem deste clã'}</button><button class="button secondary" data-action="close-modal">Cancelar</button></div></div></div>`}
  function render(){if(S.loading){$('#app').innerHTML='<div class="empty" style="margin:15vh auto;max-width:500px"><h3>Carregando os arquivos shinobi...</h3><p>Conectando ao sistema de autenticação.</p></div>';return}if(CONFIGURED&&!S.user&&!['login'].includes(S.view))S.view='login';let screen={home,clans,sheet:sheetView,admin:adminView,login}[S.view]||home;$('#app').innerHTML=screen();if(S.modal)$('#app').insertAdjacentHTML('beforeend',clanModal())}
  function nav(view){S.modal=null;if(view==='admin'){if(!canAdmin()){showToast('Acesso permitido somente ao mestre.',true);return}refreshAdmin();return}S.view=view;render();window.scrollTo({top:0,behavior:'smooth'})}
  function setStatus(st){S.saveState=st;const x=$('#save-status');if(x)x.textContent=st;const y=$('#save-footer');if(y)y.textContent=st}
  async function persist(){if(!active())return;if(!CONFIGURED||!fb){setStatus('Modo demonstração · sem nuvem');return}if(!S.user){showToast('Entre na sua conta para salvar.',true);return}const target=S.sheetId||uid();const data=JSON.parse(JSON.stringify(active()));data.atualizadoEm=Date.now();try{setStatus('Salvando...');await fb.setDoc(fb.doc(fb.db,'fichas',target),data);setStatus('Salvo na nuvem ✓')}catch(e){console.error(e);setStatus('Falha ao salvar');showToast('Não foi possível salvar. Verifique Firebase e regras de segurança.',true)}}
  function scheduleSave(){if(!active())return;setStatus(CONFIGURED?'Alterações pendentes':'Prévia local');clearTimeout(S.saveTimer);S.saveTimer=setTimeout(persist,950)}
  function updateValue(path,val){const p=active();if(!p)return;const isArray=path.startsWith('@');if(isArray){const bits=path.slice(1).split('.');const [a,index,...rest]=bits;const obj=p[a]?.[Number(index)];if(!obj)return;const key=rest.join('.');let next=val;const numFields=['nivel','quantidade'];if(numFields.includes(key)){next=bound(val,0,key==='nivel'?limit():9999);if(key==='nivel'&&a==='poderes'){const diff=next-n(obj[key]);if(diff>0&&totals(p).powers+diff>currentNC().powers){showToast('Pontos de poder insuficientes.',true);return false}}}obj[key]=next}else{let next=val;if(path==='nc'){const newNC=n(val);if(!NC_TABLE[newNC])return false;p.nc=newNC;render();scheduleSave();return true}if(['ryos','sociais.Carisma','sociais.Manipulacao','recursos.vit','recursos.chakra'].includes(path)){next=bound(val,path.startsWith('recursos')?-99:0,99999);if(path.startsWith('sociais')){next=bound(val,0,limit());const before=n(getAt(p,path));if(totals(p).social-before+next>currentNC().social){showToast('Pontos sociais insuficientes.',true);return false}}}setAt(p,path,next)}scheduleSave();return true}
  function adjustAttr(key,delta){const p=active(),t=totals(p),cur=n(p.atributos[key]),next=cur+delta;if(next<0||next>p.nc)return showToast(`Atributos vão de 0 até NC ${p.nc}.`,true);if(delta>0&&t.attrs>=currentNC().attrs)return showToast('Todos os pontos de atributo disponíveis foram usados.',true);p.atributos[key]=next;render();scheduleSave()}
  function adjustSkill(key,delta){const p=active(),t=totals(p),cur=n(p.pericias[key]),next=cur+delta;if(next<0||next>limit())return showToast(`Máximo de ${limit()} pontos nesta perícia.`,true);if(delta>0&&t.skills>=currentNC().skills)return showToast('Pontos de perícia insuficientes.',true);if(key==='Venefício'&&p.nc<8&&delta>0)return showToast('Venefício não pode ser comprada no NC 4.',true);p.pericias[key]=next;render();scheduleSave()}
  function shiftCombat(){const p=active(),from=$('#shift-from')?.value,to=$('#shift-to')?.value;if(!from||!to||from===to)return showToast('Escolha habilidades diferentes.',true);const m=p.combateAjustes;let positive=Object.values(m).reduce((s,x)=>s+Math.max(0,n(x)),0);if(positive>=2&&n(m[from])<=0&&n(m[to])>=0)return showToast('Limite de duas transferências.',true);const copy={...m,[from]:n(m[from])-1,[to]:n(m[to])+1};if(Object.values(copy).reduce((s,x)=>s+Math.max(0,n(x)),0)>2||Object.values(copy).some(x=>3+n(x)<0))return showToast('As bases não podem transferir mais de 2 pontos.',true);p.combateAjustes=copy;render();scheduleSave()}
  function modifyItem(array,index,remove=false){const p=active();if(!p||!['poderes','aptidoes','jutsus','inventario'].includes(array))return;if(remove){p[array].splice(index,1);render();scheduleSave();return}if(p[array].length>=MAX_ITEMS)return showToast('Limite de registros atingido.',true);if(array==='aptidoes'&&p.aptidoes.length>=3&&totals(p).powers+2>currentNC().powers)return showToast('Faltam 2 pontos de poder para comprar outra aptidão.',true);const patterns={poderes:{nome:'',nivel:1,descricao:''},aptidoes:{nome:'',tipo:''},jutsus:{nome:'',nivel:1,acao:'',duracao:'',alvo:'',alcance:'',efeito:''},inventario:{nome:'',quantidade:1,obs:''}};if(array==='poderes'&&totals(p).powers+1>currentNC().powers)return showToast('Sem pontos de poder disponíveis.',true);p[array].push({id:randomId(),...patterns[array]});render();scheduleSave()}
  function roll(diceCount,bonus,label){const rolls=Array.from({length:diceCount},()=>1+Math.floor(Math.random()*8)),sum=rolls.reduce((a,b)=>a+b,0);let critical=diceCount===2&&(sum>=15?' · SUCESSO CRÍTICO':sum<=3?' · FALHA CRÍTICA':'');showToast(`${label}: ${rolls.join(' + ')} + ${bonus} = ${sum+bonus}${critical}`)}
  function exportSheet(){if(!active())return;const data=JSON.stringify(active(),null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`shinobi-${active().nome.toLowerCase().replace(/[^a-z0-9]/g,'-')||'personagem'}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
  async function createSheet(){const id=S.activeClan;if(!id)return;S.modal=null;if(active()&&!S.demo)return showToast('Você já possui uma ficha. Abra Minha Ficha.',true);S.sheet=fresh(id);S.sheetId=uid();S.view='sheet';S.tab='identidade';render();await persist();showToast(S.demo?'Ficha de teste aberta. Alterações locais não são permanentes.':'Sua ficha foi criada!')}
  async function refreshAdmin(){if(!fb||!canAdmin())return;try{const snap=await fb.getDocs(fb.collection(fb.db,'fichas'));S.adminSheets=snap.docs.map(d=>({...d.data(),__id:d.id}));S.view='admin';render()}catch(e){console.error(e);showToast('Falha ao carregar fichas. Verifique as permissões de administrador.',true)}}
  function pseudoEmail(raw){return raw.toLowerCase().trim()+'@players.shinobi-chronicles.invalid'}
  async function submitAuth(form){if(!fb)return;const fd=new FormData(form),username=String(fd.get('username')||'').toLowerCase().trim(),password=String(fd.get('password')||'');if(!/^[a-z0-9._-]{3,20}$/.test(username))return showToast('Usuário: 3 a 20 caracteres, letras sem acento, números, ponto, _ ou -.',true);if(password.length<6)return showToast('A senha deve ter pelo menos seis caracteres.',true);S.authWorking=true;const btn=form.querySelector('button[type=submit]');if(btn)btn.disabled=true;try{const credential=S.authPane==='login'?await fb.signInWithEmailAndPassword(fb.auth,pseudoEmail(username),password):await fb.createUserWithEmailAndPassword(fb.auth,pseudoEmail(username),password);if(S.authPane==='register')await fb.setDoc(fb.doc(fb.db,'users',credential.user.uid),{username,criadoEm:Date.now()});S.view='home';S.authWorking=false;showToast('Acesso autorizado. Bem-vindo aos arquivos shinobi.')}catch(e){const errors={'auth/email-already-in-use':'Esse nome de usuário já está ocupado.','auth/invalid-credential':'Usuário ou senha incorretos.','auth/wrong-password':'Usuário ou senha incorretos.','auth/weak-password':'A senha é muito fraca.','auth/operation-not-allowed':'Ative E-mail/senha no Firebase Authentication.','auth/invalid-email':'Configuração de login inválida.','permission-denied':'As regras do Firestore precisam ser configuradas.'};showToast(errors[e.code]||`Não foi possível autenticar (${e.code||'erro'}).`,true);console.error(e)}finally{S.authWorking=false;if(btn)btn.disabled=false}}
  function clickAction(el){const action=el.dataset.action;if(!action)return;const p=active();if(action==='nav')return nav(el.dataset.view);if(action==='tab'){S.tab=el.dataset.tab;render();return}if(action==='clan'){S.activeClan=el.dataset.clan;S.modal='clan';render();return}if(action==='close-modal'){S.modal=null;render();return}if(action==='create-sheet')return createSheet();if(action==='auth-switch'){S.authPane=S.authPane==='login'?'register':'login';render();return}if(action==='logout'){if(fb)fb.signOut(fb.auth);else{S.user=null;S.sheet=null;S.view='home';render()}return}if(action==='save')return persist();if(action==='print')return window.print();if(action==='export')return exportSheet();if(action==='attr')return adjustAttr(el.dataset.key,n(el.dataset.delta));if(action==='skill')return adjustSkill(el.dataset.key,n(el.dataset.delta));if(action==='shift')return shiftCombat();if(action==='reset-shift'){p.combateAjustes={CC:0,CD:0,ESQ:0,LM:0};render();scheduleSave();return}if(action==='add-item')return modifyItem(el.dataset.array);if(action==='remove-item')return modifyItem(el.dataset.array,n(el.dataset.index),true);if(action==='roll-skill'){const k=el.dataset.key;if(!trained(p,k))return showToast('Esta perícia exige treinamento.',true);return roll(2,skillTotal(p,k),k)}if(action==='roll-combat')return roll(2,combat(p,el.dataset.key),'Combate corporal');if(action==='roll-initiative')return roll(1,n(p.atributos.AGI)+skillTotal(p,'Prontidão'),'Iniciativa');if(action==='refresh-admin')return refreshAdmin();if(action==='open-admin'){const x=S.adminSheets.find(a=>a.__id===el.dataset.id);if(x){const {__id,...safeData}=x;S.sheet=normalize(safeData);S.sheetId=__id;S.view='sheet';S.tab='identidade';render();}return}}
  document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;if(el.classList.contains('modalshade')&&ev.target!==el)return;clickAction(el)});
  document.addEventListener('submit',ev=>{if(ev.target.id==='auth-form'){ev.preventDefault();submitAuth(ev.target)}});
  document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='admin-filter'){const q=el.value.toLocaleLowerCase('pt-BR');$('#admin-rows').innerHTML=adminRows(S.adminSheets.filter(x=>[x.nome,x.usuario,clanOf(x.clanId).name].some(z=>String(z||'').toLocaleLowerCase('pt-BR').includes(q))));return}if(!el.dataset.bind||el.tagName==='SELECT')return;const old=getAt(active(),el.dataset.bind);if(!updateValue(el.dataset.bind,el.value)){el.value=old??''}});
  document.addEventListener('change',ev=>{const el=ev.target;if(!el.dataset.bind||el.tagName!=='SELECT')return;updateValue(el.dataset.bind,el.value)});
  async function startFirebase(){try{const base=`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;const [{initializeApp},{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut},{getFirestore,doc,getDoc,setDoc,collection,getDocs}]=await Promise.all([import(base+'/firebase-app.js'),import(base+'/firebase-auth.js'),import(base+'/firebase-firestore.js')]);const app=initializeApp(FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);fb={auth,db,doc,getDoc,setDoc,collection,getDocs,signOut,createUserWithEmailAndPassword,signInWithEmailAndPassword};onAuthStateChanged(auth,async(user)=>{clearTimeout(S.saveTimer);if(!user){S.user=null;S.isAdmin=false;S.sheet=null;S.sheetId=null;S.loading=false;S.view='login';render();return}const fallback=user.email?.split('@')[0]||'Shinobi';S.user={uid:user.uid,displayName:fallback};try{const [profile,admin,sheet]=await Promise.all([getDoc(doc(db,'users',user.uid)),getDoc(doc(db,'admins',user.uid)),getDoc(doc(db,'fichas',user.uid))]);if(profile.exists())S.user.displayName=profile.data().username||fallback;S.isAdmin=admin.exists();if(sheet.exists()){S.sheet=normalize(sheet.data());S.sheetId=sheet.id}else{S.sheet=null;S.sheetId=null}S.loading=false;S.view='home';render()}catch(e){console.error(e);S.loading=false;S.view='home';render();showToast('Conta conectada, mas houve um erro ao carregar os dados. Confira as regras do Firestore.',true)}})}catch(e){console.error(e);S.loading=false;S.view='login';render();showToast('Falha ao inicializar Firebase. Confira as chaves e o domínio autorizado.',true)}}
  if(CONFIGURED)startFirebase();else{S.loading=false;render()}
</script>
