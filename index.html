  /* ===== FICHAS CANVA ORIGINAIS: PÁGINAS A4 COM CAMPOS EDITÁVEIS ===== */
  .cv-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0 16px}
  .cv-toolbar h2{font:600 22px var(--serif);margin:0}.cv-toolbar p{font-size:12px;color:var(--muted);margin:4px 0 0}
  .cv-pages{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}
  .cv-pages button{padding:9px 14px;border:1px solid var(--line);background:#fffdfa;color:#4b4b4b;cursor:pointer;font-weight:700;font-size:12px}
  .cv-pages button.active{background:#202723;color:white;border-color:#202723}
  .cv-wrap{width:100%;display:flex;justify-content:center;overflow:auto;padding:8px 0 26px}
  .cv-page{width:min(100%,828px);flex:0 0 auto;aspect-ratio:8.27/11.69;position:relative;background:linear-gradient(120deg,#f0e7df,#fff9f5 45%,#e6ddd3);box-shadow:0 10px 30px #1b242025;border:1px solid #eee2d7;overflow:hidden}
  .cv-page img.cv-bg{width:100%;height:100%;display:block;position:absolute;inset:0;z-index:0;object-fit:fill}
  .cv-page .cv-missing{position:absolute;top:20%;left:10%;right:10%;text-align:center;pointer-events:none;color:#80645f;opacity:.6;font:600 25px var(--serif)}
  .cv-spot{position:absolute;z-index:2;overflow:hidden}
  .cv-in{width:100%;height:100%;margin:0!important;display:block;min-width:0;padding:0 3px!important;background:rgba(255,255,255,.95)!important;border:1px solid rgba(100,79,76,.18)!important;border-radius:0!important;color:#2b2929!important;font-family:"DM Sans",sans-serif!important;font-size:clamp(7px,1vw,12px)!important;line-height:1.18!important;box-shadow:none!important}
  .cv-in:focus{outline:1.5px solid #834b46!important;background:#fff!important;z-index:4}
  .cv-spot textarea.cv-in{resize:none;overflow:auto;line-height:1.4!important;padding:3px!important}
  .cv-readonly{height:100%;width:100%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.88);color:#6d333d;font-weight:700;font-size:clamp(7px,.95vw,12px)}
  .cv-stepper{width:100%;height:100%;display:flex;align-items:center;justify-content:space-evenly;background:rgba(255,255,255,.95);gap:1px;color:#803c48}
  .cv-stepper button{height:100%;flex:1;border:0;background:transparent;color:#803c48;font-weight:800;cursor:pointer;font-size:clamp(8px,1.2vw,15px)}
  .cv-stepper button:hover{background:#e5c2c5}.cv-stepper b{flex:1;text-align:center;font-size:clamp(8px,1.25vw,15px)}
  .cv-image{position:absolute;z-index:2;left:62.7%;top:17.2%;width:30.7%;height:22%;object-fit:cover;object-position:center}
  .cv-status{font-size:12px;line-height:1.6;color:#65605c;text-align:center;margin:8px auto 28px;max-width:800px}
  @media(max-width:700px){.cv-page{min-width:620px}.cv-wrap{justify-content:flex-start}.cv-in{font-size:10px!important}}
  @media print{@page{size:A4;margin:0}.sidebar,.topbar,.cv-toolbar,.cv-pages,.cv-status,.statusbar,.cv-extra{display:none!important}.main-area,.content,.app-main{padding:0!important;margin:0!important}.cv-wrap{overflow:visible;padding:0}.cv-page{width:210mm!important;height:297mm!important;max-width:none;box-shadow:none;border:0}.cv-in{print-color-adjust:exact!important}}


  /* Fichas múltiplas e feedback de artes ausentes */
  .my-sheet-list{display:grid;gap:14px}
  .my-sheet-card{display:flex;align-items:center;gap:16px;padding:14px;background:#fffdfa;border:1px solid var(--line);border-radius:4px}
  .my-sheet-mini{flex:0 0 140px;width:140px;aspect-ratio:16/9;background:linear-gradient(135deg,#f4f1ed,var(--wash));position:relative;overflow:hidden}
  .my-sheet-mini img{width:100%;height:100%;object-fit:cover}
  .my-sheet-mini span{position:absolute;right:10px;bottom:3px;opacity:.24;font-size:32px}
  .my-sheet-info{flex:1;min-width:0}
  .my-sheet-info h3{font:600 21px var(--serif);margin:5px 0}
  .my-sheet-info p{font-size:12px;color:var(--muted);margin:3px 0}
  .my-sheet-buttons,.my-sheet-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .my-sheet-buttons{justify-content:flex-end}.my-sheet-strip{margin:14px 0}
  .danger-quiet{color:#a5423d!important;border-color:#d2b4b2!important}
  .button-danger{background:#a5423d!important;color:#fff!important;border-color:#a5423d!important}

/* Abertura da ficha: pincelada curta, papel japonês e selo, sem bloquear a navegação */
.shinobi-entrance{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;isolation:isolate;opacity:0;pointer-events:auto;transition:opacity .26s ease-out}
.shinobi-entrance:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 48% 48% at 50% 50%,rgba(224,212,188,.96),rgba(213,206,187,.95) 66%,rgba(39,57,46,.87));clip-path:circle(0% at 50% 50%);transition:clip-path .42s cubic-bezier(.16,.7,.31,1);box-shadow:0 0 70px #3548374d inset}
.shinobi-entrance:after{content:"";position:absolute;inset:0;opacity:.2;pointer-events:none;background:repeating-linear-gradient(110deg,transparent 0 6px,rgba(53,70,56,.1) 7px,transparent 8px 16px)}
.shinobi-entrance.is-opening{opacity:1}
.shinobi-entrance.is-opening:before{clip-path:circle(85% at 50% 50%)}
.shinobi-entrance-ink{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:11px;opacity:0;transform:translateY(15px) scale(.94);transition:opacity .28s ease .10s,transform .32s ease .10s;text-align:center;color:#27392f}
.shinobi-entrance.is-opening .shinobi-entrance-ink{opacity:1;transform:translateY(0) scale(1)}
.shinobi-entrance-symbol{display:grid;place-items:center;border:2px solid #ad6d64;border-radius:50%;width:75px;height:75px;font:700 39px var(--serif);color:#864e4b;background:rgba(254,248,235,.3)}
.shinobi-entrance-title{font-size:11px;font-weight:800;letter-spacing:.21em}
.shinobi-entrance-ink small{font-size:12px;letter-spacing:.03em;color:#606b60}
.shinobi-entrance.is-closing{opacity:0;pointer-events:none;transition:opacity .36s ease}
.shinobi-entrance.is-closing .shinobi-entrance-ink{opacity:0;transform:translateY(-9px)}
@media(prefers-reduced-motion:reduce){
 .shinobi-entrance,.shinobi-entrance:before,.shinobi-entrance-ink{transition-duration:.01s!important}
}

 return `<div class="shell">${side()}<main class="main">${top()}<div class="auth-shell"><div class="auth-art"><div class="auth-mark">${master?'将':'忍'}</div></div><div class="auth-form-wrap"><div class="eyebrow">${master?'ACESSO DO MESTRE':reg?'NOVO REGISTRO SHINOBI':'ARQUIVO SHINOBI'}</div><h1>${master?'Entrada do administrador':reg?'Seu registro começa aqui.':'Bem-vindo, shinobi.'}</h1><p>${master?'Digite a senha mestra. Se esta for a primeira entrada, a conta do mestre será criada automaticamente com a senha que você escolher.':reg?'Crie sua conta para guardar suas fichas. Não é necessário informar um e-mail.':'Entre com seu nome de usuário e sua senha para acessar seus personagens.'}</p><div class="auth-role-tabs"><button class="${!master?'active':''}" data-action="auth-pane" data-pane="login" type="button">Jogador</button><button class="${master?'active':''}" data-action="auth-pane" data-pane="admin" type="button">Entrar como ADM</button></div><form class="auth-form" id="auth-form"><div class="field"><label for="auth-name">Nome de usuário</label><input id="auth-name" name="username" minlength="3" maxlength="20" pattern="[a-zA-Z0-9._-]{3,20}" autocomplete="username" placeholder="${master?'mestre_shinobi':'ex.: ninja_konoha'}" ${master?'value="mestre_shinobi" readonly':''} required></div><div class="field"><label for="auth-pass">Senha</label><input id="auth-pass" name="password" type="password" minlength="6" autocomplete="${reg?'new-password':'current-password'}" placeholder="Mínimo de 6 caracteres" required></div><button class="button" type="submit" ${S.authWorking?'disabled':''}>${S.authWorking?'Verificando…':master?'Acessar painel do mestre':reg?'Criar minha conta':'Entrar nos arquivos'}</button>${!master?`<button class="switch" type="button" data-action="auth-switch">${reg?'Já tem conta? Fazer login':'Ainda não tem conta? Criar cadastro'}</button>`:`<button class="switch" type="button" data-action="auth-pane" data-pane="login">Voltar ao login de jogador</button>`}</form><p class="auth-help">${master?'A senha fica na sua conta do Firebase, nunca no código. A primeira entrada cadastra o mestre; faça isso antes de compartilhar o endereço com amigos.':'As fichas são privadas. Sem e-mail real, a recuperação automática de senha não está disponível.'}</p></div></div></main></div>`;

  const field=(name,path,value,type='text',extra='')=>`<div class="field"><label>${E(name)}</label><input ${type==='number'?'type="number" min="0"':'type="text"'} data-bind="${E(path)}" value="${E(value??'')}" ${extra}></div>`;

  function identity(p){return `<div class="two-col"><section class="paper-panel"><h3>Dados do personagem</h3><div class="form-grid">${field('Nome do personagem','nome',p.nome)}${field('Idade','idade',p.idade)}${field('Vila','vila',p.vila)}${field('Graduação narrativa','graduacao',p.graduacao)}<div class="field"><label>Nível de Campanha (NC)</label><select data-bind="nc">${Object.entries(NC_TABLE).map(([k,t])=>`<option value="${k}" ${Number(k)===p.nc?'selected':''}>NC ${k} — ${E(t.label)}</option>`).join('')}</select></div><div class="field full">${portraitEditor(p)}</div><div class="field full">${area('Conceito e aparência','descricao',p.descricao,3)}</div></div></section><section class="paper-panel"><h3>Identificação e recursos</h3><div class="stat-row"><span>Clã escolhido</span><strong>${E(clanOf(p.clanId).name)}</strong></div><div class="stat-row"><span>Nível shinobi</span><strong>${E(currentNC().label)}</strong></div><div class="stat-row"><span>Limite máximo de atributo</span><strong>${p.nc}</strong></div><div class="stat-row"><span>Limite de poder/perícia</span><strong>${limit()}</strong></div><div class="stat-row"><span>Mínimo de cada atributo</span><strong>${currentNC().min}</strong></div><div class="stat-row"><span>Ryos iniciais (referência)</span><strong>${fmt(currentNC().ryos)}</strong></div><p class="panel-caption mt24">A família escolhida serve como referência de acesso a poderes restritos. Este editor não distribui automaticamente Sharingan, Byakugan ou outras técnicas.</p></section></div>`}

  function skills(p){const t=totals(p);return `<section class="paper-panel"><div class="flex between wrap"><div><h3 style="margin-bottom:3px">Perícias</h3><div class="panel-caption">Nível = ⌈atributo/2⌉ + pontos investidos</div></div>${budget(t.skills,currentNC().skills)}</div><div style="overflow:auto"><table class="skill-table"><thead><tr><th>Perícia</th><th>Atributo</th><th class="narrow">Base</th><th class="narrow">Pontos</th><th class="narrow">Total</th><th>Teste</th></tr></thead><tbody>${SKILLS.map(([name,attr,x])=>`<tr><td><strong>${E(name)}</strong>${x?'<br><span class="trained">TREINADA [x]</span>':''}</td><td>${attr}</td><td class="narrow">${Math.ceil(n(p.atributos[attr])/2)}</td><td class="narrow"><button data-action="skill" data-key="${E(name)}" data-delta="-1" aria-label="Diminuir ${E(name)}">−</button> &nbsp;${n(p.pericias[name])}&nbsp; <button data-action="skill" data-key="${E(name)}" data-delta="1" aria-label="Aumentar ${E(name)}">+</button></td><td class="narrow"><strong>${skillTotal(p,name)}</strong></td><td><button data-action="roll-skill" data-key="${E(name)}" ${!trained(p,name)||name==='Venefício'&&p.nc<8?'disabled title="Indisponível neste NC"':''}>2d8 + ${skillTotal(p,name)}</button></td></tr>`).join('')}</tbody></table></div><p class="panel-caption mt16">Perícias treinadas exigem ao menos 1 ponto investido. Venefício não está disponível no NC 4. O limite é de ${limit()} pontos gastos por perícia.</p></section>`}
  function combatView(p){const cs=['CC','CD','ESQ','LM'], names={CC:'Combate Corporal',CD:'Combate à Distância',ESQ:'Esquiva',LM:'Ler Movimento'};let totalShift=cs.reduce((s,k)=>s+Math.max(0,n(p.combateAjustes[k])),0);return `<div class="two-col"><div class="stack"><section class="paper-panel"><h3>Habilidades de combate</h3>${cs.map(k=>`<div class="stat-row"><span>${names[k]} <small class="muted">(base ${3+n(p.combateAjustes[k])})</small></span><strong>${combat(p,k)}</strong></div>`).join('')}<p class="panel-caption mt16">CC = base + FOR · CD = base + DES · ESQ = base + AGI · LM = base + PER</p></section><section class="paper-panel"><h3>Redistribuição de bases</h3><p class="panel-caption">Pode transferir até 2 pontos de base entre as quatro habilidades. Cada base começa em 3.</p><div class="form-grid mt16"><div class="field"><label>Retirar 1 ponto de</label><select id="shift-from">${cs.map(k=>`<option value="${k}">${names[k]}</option>`).join('')}</select></div><div class="field"><label>Adicionar 1 ponto em</label><select id="shift-to">${cs.map(k=>`<option value="${k}">${names[k]}</option>`).join('')}</select></div></div><div class="flex wrap mt16"><button class="button small" data-action="shift">Transferir 1 ponto</button><button class="button secondary small" data-action="reset-shift">Restaurar bases</button><span class="pill">${totalShift} / 2 transferências</span></div></section></div><div class="stack"><section class="paper-panel"><h3>Energias de combate</h3>${pool(p,'vit','Vitalidade',vitMax(p))}<div style="height:12px"></div>${pool(p,'chakra','Chakra',chakraMax(p))}</section><section class="paper-panel"><h3>Valores automáticos</h3><div class="stat-row"><span>Dificuldade para Esquiva</span><strong>${9+combat(p,'ESQ')}</strong></div><div class="stat-row"><span>Deslocamento / movimento</span><strong>${10+Math.ceil(n(p.atributos.AGI)/2)} m</strong></div><div class="stat-row"><span>Iniciativa</span><strong>1d8 + ${n(p.atributos.AGI)+skillTotal(p,'Prontidão')}</strong></div><div class="stat-row"><span>Precisão corpo a corpo</span><strong>${combat(p,'CC')}</strong></div><div class="stat-row"><span>Precisão à distância</span><strong>${combat(p,'CD')}</strong></div><div class="flex wrap mt16"><button class="button small" data-action="roll-combat" data-key="CC">Rolar ataque CC</button><button class="button secondary small" data-action="roll-initiative">Rolar iniciativa</button></div></section></div></div>`}
  function pool(p,key,label,max){const raw=p.recursos?.[key];const val=raw===null||raw===undefined?max:n(raw);return `<div class="pool ${key==='chakra'?'chakra':''}"><div><div class="pool-title">${label}</div><div class="pool-max">Máximo ${max}</div><div class="progress"><span style="width:${Math.max(0,Math.min(100,val/Math.max(1,max)*100))}%"></span></div></div><input type="number" data-bind="recursos.${key}" min="-99" max="9999" value="${val}" aria-label="${label} atual"></div>`}
  function itemFields(arr,i,fields){return fields.map(([label,key,type])=>type==='area'?area(label,`@${arr}.${i}.${key}`,active()[arr][i][key],2):field(label,`@${arr}.${i}.${key}`,active()[arr][i][key],type||'text')).join('')}
  function collectionEditor(arr,title,fields,note){const p=active();return `<section class="paper-panel"><div class="flex between wrap"><div><h3 style="margin-bottom:2px">${title}</h3>${note?`<div class="panel-caption">${note}</div>`:''}</div><button class="button secondary small" data-action="add-item" data-array="${arr}">+ Adicionar</button></div><div class="collection">${p[arr].length?p[arr].map((item,i)=>`<div class="collection-item"><div class="flex between"><span class="pill">REGISTRO ${String(i+1).padStart(2,'0')}</span><button class="icon-btn" data-action="remove-item" data-array="${arr}" data-index="${i}">Remover</button></div><div class="form-grid">${itemFields(arr,i,fields)}</div></div>`).join(''):`<p class="panel-caption">Nenhum registro cadastrado ainda.</p>`}</div></section>`}
  function techniques(p){const t=totals(p);return `<div class="stack"><div class="notice"><b>Como funciona:</b> pontos de poder compram níveis de poderes, não jutsus isolados. Cada personagem tem 3 aptidões gratuitas; cada aptidão extra consome 2 pontos de poder. O custo-padrão em chakra é igual ao nível usado na técnica. Jutsus básicos são gratuitos.</div><div class="flex between wrap"><h3 style="margin:0;font:600 19px var(--serif)">Orçamento de poder</h3>${budget(t.powers,currentNC().powers)}</div>${collectionEditor('poderes','Poderes', [['Nome do poder','nome'],['Nível investido','nivel','number'],['Observações','descricao','area']],`Limite por poder: ${limit()} níveis. Exemplos comuns: ${COMMON_POWERS.join(', ')}.`)}${collectionEditor('aptidoes','Aptidões',[['Nome da aptidão','nome'],['Categoria / requisito','tipo']],`3 gratuitas, as demais custam 2 pontos de poder. Confira os pré-requisitos no livro.`)}${collectionEditor('jutsus','Técnicas registradas',[['Nome da técnica','nome'],['Nível utilizado','nivel','number'],['Ação','acao'],['Duração','duracao'],['Alvo / Área','alvo'],['Alcance','alcance'],['Efeito / descrição','efeito','area']],`Jutsus são registros de técnicas desbloqueadas, e não compras independentes. Custo de chakra padrão = nível usado.`)}<div class="notice">Técnicas e aptidões restritas aos clãs devem ser validadas conforme suas descrições e pré-requisitos no manual completo do SNS. O editor não desbloqueia poderes somente por selecionar um clã.</div></div>`}
  function inventory(p){return `<div class="stack"><div class="two-col"><section class="paper-panel"><h3>Recursos e dinheiro</h3>${field('Ryos atuais','ryos',p.ryos,'number')}<p class="panel-caption mt16">Referência de Ryos iniciais em ${currentNC().label}: ${fmt(currentNC().ryos)}. O equipamento básico costuma ser fornecido pela vila, conforme as regras da campanha.</p></section><section class="paper-panel"><h3>Compartimentos</h3><p class="panel-caption">Registre os equipamentos transportados. Os limites de carga e os preços específicos devem ser consultados no manual do sistema.</p></section></div>${collectionEditor('inventario','Inventário e equipamentos',[['Item','nome'],['Quantidade','quantidade','number'],['Notas / compartimentos','obs']])}</div>`}
  function history(p){return `<div class="two-col"><section class="paper-panel"><h3>História do personagem</h3>${area('Biografia, família, motivações e trajetória','historia',p.historia,15)}</section><section class="paper-panel"><h3>Diário de campanha</h3>${area('Missões, eventos, contatos e progressão','historico',p.historico,15)}<p class="panel-caption mt16">As alterações são salvas automaticamente no Firebase depois da configuração do projeto.</p></section></div>`}
  function sheetView(){if(!active())return layout(`<div class="empty"><h3>Você ainda não tem uma ficha</h3><p>Escolha um clã para abrir o editor automático do Shinobi Chronicles.</p><button class="button" data-action="nav" data-view="clans">Explorar clãs</button></div>`);const p=active(),clan=clanOf(p.clanId);const t=totals(p);let data={identidade:identity,atributos:attributes,pericias:skills,combate:combatView,tecnicas:techniques,inventario:inventory,historia:history};return layout(`${portraitFileInput()}${sheetSwitcher()}<div class="sheet-banner" style="--wash:${clan.wash}">${imageTag(clan)}<span class="watermark">${clan.kanji}</span><div class="banner-inner"><div class="eyebrow">REGISTRO SHINOBI / ${E(clan.name.toUpperCase())}</div><h1>${E(p.nome||'Novo personagem')}</h1><div class="sub">${E(clan.name)} · NC ${p.nc} · ${E(p.graduacao)}</div></div></div>${S.adminViewing?'<button class="button secondary small mt16" data-action="nav" data-view="admin">← Voltar ao painel do mestre</button>':''}<div class="tabs" role="tablist">${TABS.map(([id,label])=>`<button class="tab ${S.tab===id?'active':''}" role="tab" aria-selected="${S.tab===id}" data-action="tab" data-tab="${id}">${label}</button>`).join('')}</div><div id="sheet-tab">${(data[S.tab]||identity)(p)}</div><div class="statusbar mt24"><div><span class="status-dot"></span><span id="save-footer">${CONFIGURED?E(S.saveState):'Prévia local (não salva na nuvem)'}</span></div><div class="flex wrap"><button class="button secondary small" data-action="export">Exportar JSON</button><button class="button secondary small" data-action="print">Imprimir / PDF</button><button class="button small" data-action="save">Salvar agora</button></div></div><div class="mt24 four-grid"><div class="mini-stat"><span>Atributos</span><strong>${t.attrs}/${currentNC().attrs}</strong></div><div class="mini-stat"><span>Perícias</span><strong>${t.skills}/${currentNC().skills}</strong></div><div class="mini-stat"><span>Poderes</span><strong>${t.powers}/${currentNC().powers}</strong></div><div class="mini-stat"><span>Sociais</span><strong>${t.social}/${currentNC().social}</strong></div></div>${[t.attrs>currentNC().attrs,t.skills>currentNC().skills,t.powers>currentNC().powers,t.social>currentNC().social].some(Boolean)?'<div class="notice warn mt16"><b>Atenção:</b> existe orçamento excedido nesta ficha. Revise os valores antes de finalizar.</div>':''}`)}
function adminGate(){
 if(!canAdmin())return layout('<div class="empty"><h3>Acesso restrito</h3><p>Somente a conta mestre ou contas autorizadas no Firebase podem acessar este painel.</p></div>');

async function unlockAdmin(form){
 if(S.adminAuthBusy||!canAdmin()||!fb?.auth?.currentUser)return showToast('Acesso administrativo indisponível.',true);
 const password=String(new FormData(form).get('password')||'');
 if(!password)return;
 const currentUser=fb.auth.currentUser;
 S.adminAuthBusy=true;
 const button=form.querySelector('button[type="submit"]');
 if(button){button.disabled=true;button.textContent='Verificando…'}
 try{
   if(!currentUser.email)throw Error('Identificador de login indisponível.');
   const credential=fb.EmailAuthProvider.credential(currentUser.email,password);
   await fb.reauthenticateWithCredential(currentUser,credential);
   const admin=await fb.getDoc(fb.doc(fb.db,'admins',currentUser.uid));
   if(!admin.exists()&&currentUser.email!==MASTER_EMAIL){S.isAdmin=false;throw Error('A conta não possui permissão administrativa.')}
   S.adminUnlocked=true;
   await refreshAdmin();
 }catch(err){
   S.adminUnlocked=false;
   const msg=err.code==='auth/wrong-password'||err.code==='auth/invalid-credential'?'Senha incorreta.':err.code==='auth/too-many-requests'?'Muitas tentativas. Tente novamente mais tarde.':err.code==='auth/network-request-failed'?'Não foi possível conectar ao Firebase.':err.message==='A conta não possui permissão administrativa.'?err.message:'Falha ao validar a senha do administrador.';
   console.error('Erro de autenticação administrativa:',err.code||'verificação');
   showToast(msg,true);
 }finally{S.adminAuthBusy=false;if(button?.isConnected){button.disabled=false;button.textContent='Desbloquear painel'}}
}
async function lockAdmin(){
 if(S.adminViewing&&S.saveTimer){clearTimeout(S.saveTimer);S.saveTimer=null;await persist()}
 if(S.pendingWrite)await S.pendingWrite.catch(()=>{});
 S.adminUnlocked=false;stopAdminLive();S.adminSheets=[];S.adminEvents=[];S.adminViewing=false;
 const own=ownSheets()[0];S.sheet=own?.data||null;S.sheetId=own?.id||null;S.view='home';S.modal=null;
 render();showToast('Administração bloqueada.');
}

function stopAdminLive(){
 if(S.adminUnsubscribe){try{S.adminUnsubscribe()}catch(_){ }S.adminUnsubscribe=null}
 S.adminLive=false;S.adminLiveReady=false;S.adminLiveError=false;S.pendingRemote=null;
}
function describeSheetChange(before,after,type){
 if(type==='added')return 'Nova ficha criada';
 if(type==='removed')return 'Ficha excluída';
 if(!before)return 'Ficha sincronizada';
 for(const [path,label] of [['nome','Nome'],['nc','NC'],['graduacao','Graduação'],['recursos.vit','Vitalidade'],['recursos.chakra','Chakra']]){
  const a=getAt(before,path),b=getAt(after,path);
  if(String(a??'')!==String(b??''))return label+': '+String(a??'—').slice(0,30)+' → '+String(b??'—').slice(0,30);
 }
 for(const [key,name] of ATTRS)if(n(before.atributos?.[key])!==n(after.atributos?.[key]))return name+': '+n(before.atributos?.[key])+' → '+n(after.atributos?.[key]);
 for(const [name] of SKILLS)if(n(before.pericias?.[name])!==n(after.pericias?.[name]))return 'Perícia '+name+': '+n(before.pericias?.[name])+' → '+n(after.pericias?.[name]);
 for(const [field,label] of [['jutsus','Jutsus'],['poderes','Poderes'],['aptidoes','Aptidões'],['inventario','Inventário'],['historia','História']])
   if(JSON.stringify(before[field]||'')!==JSON.stringify(after[field]||''))return label+' atualizados';
 return 'Dados da ficha atualizados';
}

function applyRemoteSheet(){

function startAdminLive(){
 if(!fb||!canAdmin()||!S.adminUnlocked||S.adminUnsubscribe)return;
 S.adminLive=false;S.adminLiveError=false;S.adminLiveReady=false;
 S.adminUnsubscribe=fb.onSnapshot(fb.collection(fb.db,'fichas'),snapshot=>{
   if(!canAdmin()||!S.adminUnlocked)return;
   const previous=new Map(S.adminSheets.map(x=>[x.__id,x]));
   const next=snapshot.docs.map(d=>({...d.data(),__id:d.id}));
   if(S.adminLiveReady){
     for(const change of snapshot.docChanges()){
       const after=change.doc.data(),before=previous.get(change.doc.id);
       if(S.lastSavedWrite?.id===change.doc.id&&n(S.lastSavedWrite?.stamp)===n(after?.atualizadoEm))continue;
       S.adminEvents.unshift({nome:after.nome||before?.nome||'Personagem',resumo:describeSheetChange(before,after,change.type),hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})});
     }
     S.adminEvents=S.adminEvents.slice(0,20);
   }
   S.adminLiveReady=true;S.adminLive=true;S.adminLiveError=false;S.adminSheets=next;
   if(S.adminViewing&&S.sheetId){
     const remote=next.find(x=>x.__id===S.sheetId);
     if(remote&&n(remote.atualizadoEm)!==n(S.sheet?.atualizadoEm)){
       const own=S.lastSavedWrite?.id===S.sheetId&&n(S.lastSavedWrite?.stamp)===n(remote.atualizadoEm);
       if(!own){
         const focus=!!document.activeElement?.matches?.('[data-bind],[data-cv-array],[data-cv-skill],input,textarea,select');
         if(focus||S.locallyDirty||S.saveTimer||S.isSaving){
           S.pendingRemote=remote;const label=$('#admin-sheet-sync');
           if(label){label.textContent='Alteração externa recebida · clique para atualizar';label.classList.add('has-update')}
         }else{S.sheet=normalize(remote);S.pendingRemote=null;render()}
       }else S.sheet.atualizadoEm=remote.atualizadoEm;
     }
   }
   showAdminLiveUI();
 },error=>{
   console.error('Firestore ao vivo:',error.code||error);
   S.adminLive=false;S.adminLiveError=true;
   if(S.adminUnsubscribe){try{S.adminUnsubscribe()}catch(_){}S.adminUnsubscribe=null}
   showAdminLiveUI();showToast('A sincronização do mestre foi interrompida. Confira as regras do Firestore.',true);
 });
 showAdminLiveUI();
}

  async function persist(){
 if(!active()||!S.sheetId)return false;
 if(!canEditCurrent()){showToast('Você não possui permissão para editar esta ficha.',true);return false}
 if(!CONFIGURED||!fb){setStatus('Modo demonstração · sem nuvem');return false}

 const target=S.sheetId;
 const original=S.adminViewing?S.adminSheets.find(x=>x.__id===target):null;
 const data=JSON.parse(JSON.stringify(active()));S.isSaving=true;
 data.ownerUid=S.adminViewing?original?.ownerUid:uid();
 if(!data.ownerUid){S.isSaving=false;return false}
 data.atualizadoEm=Date.now();S.lastSavedWrite={id:target,stamp:data.atualizadoEm};
 const own=S.sheets.find(x=>x.id===target);
 try{
   setStatus('Salvando...');
   S.pendingWrite=(S.pendingWrite||Promise.resolve()).catch(()=>{}).then(()=>fb.setDoc(fb.doc(fb.db,'fichas',target),data));
   await S.pendingWrite;
   if(own)own.data.atualizadoEm=data.atualizadoEm;
   if(original)Object.assign(original,data);
   S.locallyDirty=false;S.isSaving=false;setStatus('Salvo no Firebase ✓');
   return true;
 }catch(error){
   console.error('Erro ao salvar ficha:',error.code||error);
   S.isSaving=false;setStatus('Falha ao salvar');
   showToast('Não foi possível salvar. Confira a publicação das regras do Firestore.',true);
   return false;
 }
}
  function scheduleSave(){if(!active()||!canEditCurrent())return;S.locallyDirty=true;setStatus(CONFIGURED?'Alterações pendentes':'Prévia local');clearTimeout(S.saveTimer);S.saveTimer=setTimeout(()=>void persist(),280)}
  function updateValue(path,val){const p=active();if(!p||!canEditCurrent())return;const isArray=path.startsWith('@');if(isArray){const bits=path.slice(1).split('.');const [a,index,...rest]=bits;const obj=p[a]?.[Number(index)];if(!obj)return;const key=rest.join('.');let next=val;const numFields=['nivel','quantidade'];if(a==='aptidoes'&&key==='nome'&&String(next).trim()&&!String(obj[key]||'').trim()&&p.aptidoes.filter(x=>x?.nome?.trim()).length>=3&&totals(p).powers+2>currentNC().powers){showToast('Faltam pontos de poder para outra aptidão.',true);return false}if(numFields.includes(key)){next=bound(val,0,key==='nivel'?limit():9999);if(key==='nivel'&&a==='poderes'){const diff=next-n(obj[key]);if(diff>0&&totals(p).powers+diff>currentNC().powers){showToast('Pontos de poder insuficientes.',true);return false}}}obj[key]=next}else{let next=val;if(path==='nc'){const newNC=n(val);if(!NC_TABLE[newNC])return false;p.nc=newNC;render();scheduleSave();return true}if(['ryos','sociais.Carisma','sociais.Manipulacao','recursos.vit','recursos.chakra'].includes(path)){next=bound(val,path.startsWith('recursos')?-99:0,99999);if(path.startsWith('sociais')){next=bound(val,0,limit());const before=n(getAt(p,path));if(totals(p).social-before+next>currentNC().social){showToast('Pontos sociais insuficientes.',true);return false}}}setAt(p,path,next)}scheduleSave();return true}
  function adjustAttr(key,delta){if(!canEditCurrent())return;const p=active(),t=totals(p),cur=n(p.atributos[key]),next=cur+delta;if(next<0||next>p.nc)return showToast(`Atributos vão de 0 até NC ${p.nc}.`,true);if(delta>0&&t.attrs>=currentNC().attrs)return showToast('Todos os pontos de atributo disponíveis foram usados.',true);p.atributos[key]=next;render();scheduleSave()}
  function adjustSkill(key,delta){if(!canEditCurrent())return;const p=active(),t=totals(p),cur=n(p.pericias[key]),next=cur+delta;if(next<0||next>limit())return showToast(`Máximo de ${limit()} pontos nesta perícia.`,true);if(delta>0&&t.skills>=currentNC().skills)return showToast('Pontos de perícia insuficientes.',true);if(key==='Venefício'&&p.nc<8&&delta>0)return showToast('Venefício não pode ser comprada no NC 4.',true);p.pericias[key]=next;render();scheduleSave()}
  function shiftCombat(){if(!canEditCurrent())return;const p=active(),from=$('#shift-from')?.value,to=$('#shift-to')?.value;if(!from||!to||from===to)return showToast('Escolha habilidades diferentes.',true);const m=p.combateAjustes;let positive=Object.values(m).reduce((s,x)=>s+Math.max(0,n(x)),0);if(positive>=2&&n(m[from])<=0&&n(m[to])>=0)return showToast('Limite de duas transferências.',true);const copy={...m,[from]:n(m[from])-1,[to]:n(m[to])+1};if(Object.values(copy).reduce((s,x)=>s+Math.max(0,n(x)),0)>2||Object.values(copy).some(x=>3+n(x)<0))return showToast('As bases não podem transferir mais de 2 pontos.',true);p.combateAjustes=copy;render();scheduleSave()}
  function modifyItem(array,index,remove=false){if(!canEditCurrent())return;const p=active();if(!p||!['poderes','aptidoes','jutsus','inventario'].includes(array))return;if(remove){p[array].splice(index,1);render();scheduleSave();return}if(p[array].length>=MAX_ITEMS)return showToast('Limite de registros atingido.',true);if(array==='aptidoes'&&p.aptidoes.filter(x=>x?.nome?.trim()).length>=3&&totals(p).powers+2>currentNC().powers)return showToast('Faltam 2 pontos de poder para comprar outra aptidão.',true);const patterns={poderes:{nome:'',nivel:1,descricao:''},aptidoes:{nome:'',tipo:''},jutsus:{nome:'',nivel:1,acao:'',duracao:'',alvo:'',alcance:'',efeito:''},inventario:{nome:'',quantidade:1,obs:''}};if(array==='poderes'&&totals(p).powers+1>currentNC().powers)return showToast('Sem pontos de poder disponíveis.',true);p[array].push({id:randomId(),...patterns[array]});render();scheduleSave()}
  function roll(diceCount,bonus,label){const rolls=Array.from({length:diceCount},()=>1+Math.floor(Math.random()*8)),sum=rolls.reduce((a,b)=>a+b,0);let critical=diceCount===2&&(sum>=15?' · SUCESSO CRÍTICO':sum<=3?' · FALHA CRÍTICA':'');showToast(`${label}: ${rolls.join(' + ')} + ${bonus} = ${sum+bonus}${critical}`)}
  function exportSheet(){if(!active())return;const data=JSON.stringify(active(),null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`shinobi-${active().nome.toLowerCase().replace(/[^a-z0-9]/g,'-')||'personagem'}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}

  let createSheetAudio=null;
  function playCreateSheetSound(){
    try{
      if(!createSheetAudio){
        createSheetAudio=new Audio('assets/audio/create-sheet.mp3');
        createSheetAudio.preload='auto';
        createSheetAudio.volume=.68;
      }
      createSheetAudio.pause();
      createSheetAudio.currentTime=0;
      const playing=createSheetAudio.play();
      if(playing?.catch)playing.catch(()=>{});
    }catch(error){console.warn('Áudio não disponível:',error)}
  }
  async function createSheetAnimated(){
    if(S.creating||!S.activeClan)return;
    if(S.sheets.length>=40)return showToast('Máximo de 40 fichas por conta.',true);
    S.creating=true;
    playCreateSheetSound();
    S.modal=null;render();
    const layer=document.createElement('div');
    layer.className='shinobi-entrance';
    layer.setAttribute('role','status');
    layer.setAttribute('aria-label','Abrindo sua nova ficha shinobi');
    layer.innerHTML='<div class="shinobi-entrance-ink"><span class="shinobi-entrance-symbol">忍</span><span class="shinobi-entrance-title">SHINOBI CHRONICLES</span><small>Preparando seu registro...</small></div>';
    document.body.appendChild(layer);
    requestAnimationFrame(()=>layer.classList.add('is-opening'));
    await new Promise(resolve=>setTimeout(resolve,540));
    try{await createSheet();window.scrollTo({top:0,behavior:'instant'})}
    catch(error){console.error('Erro ao abrir ficha:',error);showToast('Não foi possível abrir a ficha. Tente novamente.',true)}
    finally{
      layer.classList.add('is-closing');
      setTimeout(()=>{layer.remove();S.creating=false},370);
    }
  }

  async function createSheet(){
  if(!S.activeClan)return;
  if(ownsCurrent()&&S.saveTimer){clearTimeout(S.saveTimer);S.saveTimer=null;await persist()}
  if(S.sheets.length>=40)return showToast('Máximo de 40 fichas por conta.',true);
  S.modal=null;
  const p=fresh(S.activeClan),id=uid()+'_'+randomId();
  S.sheets.push({id,data:p});S.sheet=p;S.sheetId=id;S.adminViewing=false;S.view='sheet';S.canvaMode='original';S.canvaPage=1;S.tab='identidade';render();
  const saved=await persist();
  if(CONFIGURED&&saved)showToast('Nova ficha criada. Você pode criar outras em Minhas fichas.');
}
  async function refreshAdmin(){
 if(!fb||!canAdmin()||!S.adminUnlocked)return;
 try{
   if(S.adminViewing&&S.saveTimer){clearTimeout(S.saveTimer);S.saveTimer=null;await persist()}
   if(S.pendingWrite)await S.pendingWrite.catch(()=>{});
   if(!S.adminUnsubscribe)startAdminLive();
   const first=ownSheets()[0];S.adminViewing=false;S.pendingRemote=null;S.sheet=first?.data||null;S.sheetId=first?.id||null;
   S.view='admin';render();showAdminLiveUI();
 }catch(err){console.error(err);showToast('Não foi possível sincronizar o painel.',true)}
}
  function pseudoEmail(raw){return raw.toLowerCase().trim()+'@players.shinobi-chronicles.invalid'}
  async function submitAuth(form){
 if(!fb||S.authWorking)return;
 const fd=new FormData(form),username=String(fd.get('username')||'').toLowerCase().trim(),password=String(fd.get('password')||'');
 if(!/^[a-z0-9._-]{3,20}$/.test(username))return showToast('Nome de usuário inválido: use de 3 a 20 caracteres.',true);
 if(password.length<6)return showToast('A senha deve ter pelo menos 6 caracteres.',true);
 const mode=S.authPane,master=mode==='admin',register=mode==='register';
 S.authWorking=true;S.adminLoginBusy=master;
 const button=form.querySelector('button[type="submit"]');
 if(button)button.disabled=true;
 try{
  const email=pseudoEmail(username);
  if(register&&username===MASTER_USERNAME)throw {code:'auth/master-reserved'};
  let credential;
  if(master&&username===MASTER_USERNAME){
    try{credential=await fb.signInWithEmailAndPassword(fb.auth,MASTER_EMAIL,password)}
    catch(error){
      if(!['auth/invalid-credential','auth/user-not-found'].includes(error.code))throw error;
      try{credential=await fb.createUserWithEmailAndPassword(fb.auth,MASTER_EMAIL,password)}
      catch(createError){
        if(createError.code==='auth/email-already-in-use')throw {code:'auth/invalid-credential'};
        throw createError;
      }
    }
  }else{
    credential=register?await fb.createUserWithEmailAndPassword(fb.auth,email,password):await fb.signInWithEmailAndPassword(fb.auth,email,password);
  }
  if(register)await fb.setDoc(fb.doc(fb.db,'users',credential.user.uid),{username,criadoEm:Date.now()});
  if(master){
   const authDoc=await fb.getDoc(fb.doc(fb.db,'admins',credential.user.uid));
   if(!authDoc.exists()&&credential.user.email!==MASTER_EMAIL){
    await fb.signOut(fb.auth);
    S.adminUnlocked=false;S.isAdmin=false;
    showToast('Esta conta não está autorizada como administrador.',true);
    return;
   }
   S.isAdmin=true;S.adminUnlocked=true;
   await refreshAdmin();
   showToast('Bem-vindo ao painel do mestre.');
  }else{
   S.view='home';showToast('Acesso autorizado. Bem-vindo ao Shinobi Chronicles.');
  }
 }catch(e){
  const msg={'auth/email-already-in-use':'Nome de usuário já ocupado.','auth/invalid-credential':'Usuário ou senha incorretos.','auth/wrong-password':'Usuário ou senha incorretos.','auth/weak-password':'Senha muito fraca.','auth/operation-not-allowed':'Ative E-mail/senha no Firebase Authentication.','auth/invalid-email':'Login configurado incorretamente.','permission-denied':'As regras de acesso do Firestore precisam ser publicadas.','auth/master-reserved':'Este nome é reservado para a conta do mestre.'}[e.code]||'Não foi possível autenticar. Verifique Firebase e suas permissões.';
  console.error('Falha de autenticação:',e.code||'erro');showToast(msg,true);
 }finally{
  S.authWorking=false;S.adminLoginBusy=false;
  if(button?.isConnected)button.disabled=false;
 }
}
  function clickAction(el){const action=el.dataset.action;if(!action)return;const p=active();if(action==='cv-page'){S.canvaPage=Number(el.dataset.page)||1;render();return}if(action==='cv-mode'){S.canvaMode=S.canvaMode==='advanced'?'original':'advanced';render();return}if(action==='open-sheet')return openSheet(el.dataset.id);if(action==='ask-delete')return askDelete(el.dataset.id);if(action==='confirm-delete')return deleteSheet();if(action==='lock-admin')return lockAdmin();if(action==='apply-remote')return applyRemoteSheet();if(action==='nav')return nav(el.dataset.view);if(action==='tab'){S.tab=el.dataset.tab;render();return}if(action==='clan'){S.activeClan=el.dataset.clan;S.modal='clan';render();return}if(action==='close-modal'){S.modal=null;render();return}if(action==='create-sheet')return createSheetAnimated();if(action==='auth-pane'){S.authPane=el.dataset.pane==='admin'?'admin':'login';render();return}if(action==='auth-switch'){S.authPane=S.authPane==='register'?'login':'register';render();return}if(action==='logout'){S.adminUnlocked=false;stopAdminLive();S.adminSheets=[];if(fb)fb.signOut(fb.auth);else{S.user=null;S.sheet=null;S.sheetId=null;S.sheets=[];S.view='home';render()}return}if(action==='portrait-upload'){if(!canEditCurrent())return showToast('Sem permissão para editar esta ficha.',true);$('#portrait-file')?.click();return}if(action==='portrait-remove')return removePortrait();if(action==='save')return persist();if(action==='print')return window.print();if(action==='export')return exportSheet();if(action==='attr')return adjustAttr(el.dataset.key,n(el.dataset.delta));if(action==='skill')return adjustSkill(el.dataset.key,n(el.dataset.delta));if(action==='shift')return shiftCombat();if(action==='reset-shift'){if(!canEditCurrent())return;p.combateAjustes={CC:0,CD:0,ESQ:0,LM:0};render();scheduleSave();return}if(action==='add-item')return modifyItem(el.dataset.array);if(action==='remove-item')return modifyItem(el.dataset.array,n(el.dataset.index),true);if(action==='roll-skill'){const k=el.dataset.key;if(!trained(p,k))return showToast('Esta perícia exige treinamento.',true);return roll(2,skillTotal(p,k),k)}if(action==='roll-combat')return roll(2,combat(p,el.dataset.key),'Combate corporal');if(action==='roll-initiative')return roll(1,n(p.atributos.AGI)+skillTotal(p,'Prontidão'),'Iniciativa');if(action==='refresh-admin')return refreshAdmin();if(action==='open-admin'){if(!canAdmin()||!S.adminUnlocked)return showToast('Confirme a senha para acessar as fichas.',true);const x=S.adminSheets.find(a=>a.__id===el.dataset.id);if(x){const {__id,...safeData}=x;S.sheet=normalize(safeData);S.sheetId=__id;S.adminViewing=true;S.canvaMode='original';S.view='sheet';S.tab='identidade';render();}return}}
  document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;if(el.classList.contains('modalshade')&&ev.target!==el)return;clickAction(el)});
  document.addEventListener('submit',ev=>{if(ev.target.id==='auth-form'){ev.preventDefault();submitAuth(ev.target)}else if(ev.target.id==='admin-auth-form'){ev.preventDefault();unlockAdmin(ev.target)}});
  document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='admin-filter'){const q=el.value.toLocaleLowerCase('pt-BR');$('#admin-rows').innerHTML=adminRows(S.adminSheets.filter(x=>[x.nome,x.usuario,clanOf(x.clanId).name].some(z=>String(z||'').toLocaleLowerCase('pt-BR').includes(q))));return}if(el.dataset.cvArray){canvaUpdateArray(el,true);return}if(el.dataset.cvSkill){updateCanvaSkill(el,true);return}if(!el.dataset.bind||el.tagName==='SELECT')return;const old=getAt(active(),el.dataset.bind);if(!updateValue(el.dataset.bind,el.value)){el.value=old??''}});
  document.addEventListener('change',ev=>{const el=ev.target;if(el.matches('[data-portrait-file]')){const file=el.files?.[0];el.value='';void handlePortraitSelected(file);return}if(el.dataset.cvArray){canvaUpdateArray(el);return}if(el.dataset.cvSkill){updateCanvaSkill(el);return}if(!el.dataset.bind||el.tagName!=='SELECT')return;updateValue(el.dataset.bind,el.value)});
  async function startFirebase(){try{const base=`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;const [{initializeApp},{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,reauthenticateWithCredential,EmailAuthProvider},{getFirestore,doc,getDoc,setDoc,deleteDoc,collection,getDocs,query,where,onSnapshot}]=await Promise.all([import(base+'/firebase-app.js'),import(base+'/firebase-auth.js'),import(base+'/firebase-firestore.js')]);const app=initializeApp(FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);fb={auth,db,doc,getDoc,setDoc,deleteDoc,collection,getDocs,query,where,onSnapshot,reauthenticateWithCredential,EmailAuthProvider,signOut,createUserWithEmailAndPassword,signInWithEmailAndPassword};onAuthStateChanged(auth,async(user)=>{clearTimeout(S.saveTimer);if(!user){stopAdminLive();S.adminUnlocked=false;S.adminAuthBusy=false;S.adminLoginBusy=false;S.adminSheets=[];S.user=null;S.isAdmin=false;S.sheet=null;S.sheetId=null;S.sheets=[];S.adminViewing=false;S.loading=false;S.view='login';render();return}const fallback=user.email?.split('@')[0]||'Shinobi';S.user={uid:user.uid,displayName:fallback};try{const [profile,admin,found]=await Promise.all([getDoc(doc(db,'users',user.uid)),getDoc(doc(db,'admins',user.uid)),getDocs(query(collection(db,'fichas'),where('ownerUid','==',user.uid)))]);if(profile.exists())S.user.displayName=profile.data().username||fallback;S.isAdmin=admin.exists()||user.email===MASTER_EMAIL;if(user.email===MASTER_EMAIL)S.adminUnlocked=true;S.sheets=found.docs.map(d=>({id:d.id,data:normalize(d.data())}));const first=ownSheets()[0];S.sheet=first?.data||null;S.sheetId=first?.id||null;S.adminViewing=false;S.loading=false;if(S.adminUnlocked&&S.isAdmin)startAdminLive();S.view=S.adminUnlocked&&S.isAdmin?'admin':S.authPane==='admin'?'login':'home';render()}catch(e){console.error(e);S.loading=false;S.view='home';render();showToast('Conta conectada, mas houve um erro ao carregar os dados. Confira as regras do Firestore.',true)}})}catch(e){console.error(e);S.loading=false;S.view='login';render();showToast('Falha ao inicializar Firebase. Confira as chaves e o domínio autorizado.',true)}}
  if(CONFIGURED)startFirebase();else{S.loading=false;render()}
