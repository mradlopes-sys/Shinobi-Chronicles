name: Exportar artes de fichas em alta resolução
on:
  push:
    paths:
      - '.github/workflows/export-canva-hd.yml'
      - 'scripts/canva_hd_sources.json'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar ferramentas de imagem
        run: python -m pip install Pillow
      - name: Recuperar e validar as imagens de alta resolução
        run: python scripts/export_canva_hd.py
      - name: Salvar os arquivos validados no repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fichas-hd/ canva-hd-export-status.txt
          if ! git diff --staged --quiet; then
            git commit -m 'assets: substituir fichas comprimidas por artes HD do Canva'
            git push
          fi
