name: Gerar fichas com super-resolucao HD
on:
  push:
    paths:
      - '.github/workflows/upscale-fichas.yml'
      - 'scripts/upscale_fichas.py'
permissions:
  contents: write
jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Instalar biblioteca neural e de imagens
        run: python -m pip install --disable-pip-version-check Pillow opencv-contrib-python-headless numpy
      - name: Gerar ficha de teste usando super-resolucao
        env:
          SHINOBI_HD_TEST: '1'
        run: python scripts/upscale_fichas.py
      - name: Publicar imagens processadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fichas-hd/ assets/fichas-hd-preview/ upscale-fichas-status.txt
          if ! git diff --staged --quiet; then
            git commit -m 'assets: gerar paginas de ficha HD a partir de super-resolucao'
            git push
          fi
