name: Recuperar arte Canva de teste em alta definicao
on:
  push:
    paths:
      - '.github/workflows/canva-hd-test.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar arquivo em resolucao original
        env:
          CANVA_IMAGE_B64: 
        run: |
          python3 - <<'PY'
          import os,base64,urllib.request,struct
          url=base64.b64decode(os.environ['CANVA_IMAGE_B64']).decode()
          try:
              data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read()
          except Exception as e:
              print('FAILED_CANVA_REQUEST:',repr(e))
              raise
          print('Bytes:',len(data),'prefix:',data[:20])
          if data.startswith(b'\x89PNG\r\n\x1a\n'):
              w,h=struct.unpack('>II',data[16:24]); ext='png'
          elif data.startswith(b'\xff\xd8'):
              w=h=0;ext='jpg'
              j=2
              while j<len(data):
                  if data[j]!=255: j+=1;continue
                  marker=data[j+1]
                  if marker in (0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca):
                      h,w=struct.unpack('>HH',data[j+5:j+9]);break
                  size=struct.unpack('>H',data[j+2:j+4])[0]
                  j+=size+2
          else:
              raise Exception('Unexpected format')
          print('Image:',w,h,ext)
          if w < 1900 or h < 2600:
              raise Exception(f'Canva returned only low-res image {w}x{h}')
          import pathlib
          p=pathlib.Path('assets/fichas-hd')
          p.mkdir(parents=True,exist_ok=True)
          (p/('aburame-1.'+ext)).write_bytes(data)
          PY
      - name: Publicar arte HD no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fichas-hd/
          git commit -m "assets: recupera ficha Aburame em resolucao original do Canva"
          git push
